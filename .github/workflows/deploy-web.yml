# deploy-web.yml — 构建 WASM 并部署到 GitHub Pages
#
# 触发条件：push 到 main 分支，或手动触发
# 部署后访问：https://<username>.github.io/<repo>/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build WASM
        run: |
          mkdir -p dist/web
          GOOS=js GOARCH=wasm go build -ldflags="-s -w -X 'main.platformID=web'" -o dist/web/game.wasm ./cmd/game/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/web/
          cp web/index.html dist/web/

      - name: Copy assets
        run: |
          cp -r assets dist/web/
          cp -r config dist/web/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
