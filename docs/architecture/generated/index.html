<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>defense2 — Architecture Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .updated { font-size: 12px; color: #8b949e; }
  .tabs { display: flex; gap: 4px; background: #161b22; padding: 0 24px; border-bottom: 1px solid #30363d; }
  .tab { padding: 10px 16px; cursor: pointer; color: #8b949e; border-bottom: 2px solid transparent; font-size: 14px; }
  .tab:hover { color: #c9d1d9; }
  .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .panel { display: none; padding: 24px; }
  .panel.active { display: block; }
  .svg-container { background: #fff; border-radius: 8px; padding: 16px; overflow: auto; max-height: 80vh; }
  .svg-container object, .svg-container img { width: 100%; height: auto; }
  .md-container { max-width: 900px; line-height: 1.7; }
  .md-container h2 { color: #58a6ff; margin-top: 24px; font-size: 16px; font-family: monospace; }
  .md-container pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .md-container code { font-family: "SF Mono", "Fira Code", monospace; }
  .md-container blockquote { border-left: 3px solid #30363d; padding-left: 12px; color: #8b949e; margin: 8px 0; }
  .md-container hr { border: none; border-top: 1px solid #30363d; margin: 16px 0; }
  .md-container ul { padding-left: 20px; }
  .md-container li { margin: 2px 0; }
  .reload-btn { background: #238636; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .reload-btn:hover { background: #2ea043; }
  .hint { color: #8b949e; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>

<header>
  <h1>defense2 Architecture</h1>
  <span class="updated" id="timestamp"></span>
  <button class="reload-btn" onclick="location.reload()">Refresh</button>
</header>

<div class="tabs">
  <div class="tab active" data-panel="deps">Package Dependencies</div>
  <div class="tab" data-panel="structs">Struct Relationships</div>
  <div class="tab" data-panel="modules">Module Index</div>
</div>

<div class="panel active" id="deps">
  <div class="svg-container">
    <object data="pkg-deps.svg" type="image/svg+xml" id="deps-svg">
      <p>Run <code>make arch</code> to generate package dependency graph.</p>
    </object>
  </div>
  <p class="hint">Arrows show import direction. Node size reflects line count.</p>
</div>

<div class="panel" id="structs">
  <div class="svg-container">
    <object data="structs.svg" type="image/svg+xml" id="structs-svg">
      <p>Run <code>make arch</code> to generate struct relationship diagram.</p>
    </object>
  </div>
  <p class="hint">Boxes = structs, ellipses = interfaces. Grouped by package.</p>
</div>

<div class="panel" id="modules">
  <div class="md-container" id="modules-content">
    <p>Loading modules.md...</p>
  </div>
</div>

<script>
// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.panel).classList.add('active');
  });
});

// Load and render modules.md (basic markdown rendering)
fetch('modules.md')
  .then(r => r.ok ? r.text() : Promise.reject('not found'))
  .then(md => {
    const container = document.getElementById('modules-content');
    let html = md
      .replace(/^## (.+)/gm, '<h2>$1</h2>')
      .replace(/^> (.+)/gm, '<blockquote>$1</blockquote>')
      .replace(/^---$/gm, '<hr>')
      .replace(/^- `(.+?)` \((\d+ lines)\)/gm, '<li><code>$1</code> ($2)</li>')
      .replace(/^Files:$/gm, '<strong>Files:</strong><ul>')
      .replace(/^Exports:$/gm, '</ul><strong>Exports:</strong>')
      .replace(/^Methods:$/gm, '<strong>Methods:</strong>')
      .replace(/```go\n([\s\S]*?)```/gm, '<pre><code>$1</code></pre>')
      .ted;
    // Wrap loose <li> in <ul>
    html = md.split('\n').map(line => {
      if (line.startsWith('## ')) return `<h2>${line.slice(3)}</h2>`;
      if (line.startsWith('> ')) return `<blockquote>${line.slice(2)}</blockquote>`;
      if (line === '---') return '<hr>';
      if (line.startsWith('- ')) return `<li>${line.slice(2).replace(/`([^`]+)`/g, '<code>$1</code>')}</li>`;
      if (line === 'Files:') return '<strong>Files:</strong><ul>';
      if (line === 'Exports:' || line === 'Methods:') return `</ul><strong>${line}</strong>`;
      if (line === '```go') return '<pre><code>';
      if (line === '```') return '</code></pre>';
      if (line === '') return '';
      return line;
    }).join('\n');
    container.innerHTML = html;
  })
  .catch(() => {
    document.getElementById('modules-content').innerHTML =
      '<p>Run <code>make arch</code> first to generate module index.</p>';
  });

// Timestamp
const now = new Date();
document.getElementById('timestamp').textContent =
  `Last viewed: ${now.toLocaleString('zh-CN')}`;
</script>

</body>
</html>
