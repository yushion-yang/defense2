<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="coreBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="coreEng" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="coreOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <filter id="coreGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="coreGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Energy halo === -->
  <circle cx="64" cy="56" r="58" fill="url(#coreHalo)"/>
  <circle cx="64" cy="56" r="52" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.2" stroke-dasharray="3 5"/>

  <!-- === Layer 1: Engine flares === -->
  <ellipse cx="44" cy="100" rx="9" ry="18" fill="url(#coreEng)"/>
  <ellipse cx="84" cy="100" rx="9" ry="18" fill="url(#coreEng)"/>

  <!-- === Layer 2: Main fuselage === -->
  <polygon points="64,10 44,54 46,82 64,78 82,82 84,54" fill="url(#coreBody)" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Center spine -->
  <line x1="64" y1="14" x2="64" y2="74" stroke="#60a5fa" stroke-width="0.8" opacity="0.2"/>

  <!-- === Layer 3: Armor panels === -->
  <polygon points="50,34 44,54 56,50" fill="#1e293b" stroke="#3b82f6" stroke-width="0.7" opacity="0.55"/>
  <polygon points="78,34 84,54 72,50" fill="#1e293b" stroke="#3b82f6" stroke-width="0.7" opacity="0.55"/>
  <!-- Lower hull plates -->
  <polygon points="48,58 46,72 58,68" fill="#0f172a" stroke="#60a5fa" stroke-width="0.5" opacity="0.4"/>
  <polygon points="80,58 82,72 70,68" fill="#0f172a" stroke="#60a5fa" stroke-width="0.5" opacity="0.4"/>

  <!-- === Layer 4: Delta wings === -->
  <polygon points="44,50 6,72 16,64 38,44" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <polygon points="84,50 122,72 112,64 90,44" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <!-- Wing surface lines -->
  <line x1="26" y1="60" x2="38" y2="46" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>
  <line x1="102" y1="60" x2="90" y2="46" stroke="#60a5fa" stroke-width="0.4" opacity="0.2"/>

  <!-- === Layer 5: Forward canards === -->
  <polygon points="54,26 32,36 38,28 52,22" fill="#1e293b" stroke="#60a5fa" stroke-width="0.8"/>
  <polygon points="74,26 96,36 90,28 76,22" fill="#1e293b" stroke="#60a5fa" stroke-width="0.8"/>

  <!-- === Layer 6: Weapon hardpoints === -->
  <rect x="14" y="64" width="14" height="4" rx="1.5" fill="#334155" stroke="#3b82f6" stroke-width="0.5"/>
  <rect x="100" y="64" width="14" height="4" rx="1.5" fill="#334155" stroke="#3b82f6" stroke-width="0.5"/>
  <circle cx="18" cy="66" r="1.5" fill="#ef4444" filter="url(#coreGls)"/>
  <circle cx="24" cy="66" r="1.5" fill="#ef4444" filter="url(#coreGls)"/>
  <circle cx="104" cy="66" r="1.5" fill="#ef4444" filter="url(#coreGls)"/>
  <circle cx="110" cy="66" r="1.5" fill="#ef4444" filter="url(#coreGls)"/>

  <!-- === Layer 7: Twin engines === -->
  <rect x="38" y="78" width="12" height="18" rx="5" fill="#020617" stroke="#3b82f6" stroke-width="1"/>
  <rect x="78" y="78" width="12" height="18" rx="5" fill="#020617" stroke="#3b82f6" stroke-width="1"/>
  <!-- Engine exhaust glow -->
  <ellipse cx="44" cy="96" rx="5" ry="3.5" fill="#60a5fa" filter="url(#coreGl)"/>
  <ellipse cx="84" cy="96" rx="5" ry="3.5" fill="#60a5fa" filter="url(#coreGl)"/>

  <!-- === Layer 8: Energy core === -->
  <circle cx="64" cy="50" r="9" fill="url(#coreOrb)" filter="url(#coreGl)"/>
  <circle cx="64" cy="50" r="6" fill="#93c5fd" opacity="0.7"/>
  <circle cx="64" cy="50" r="3" fill="#ffffff" opacity="0.85"/>
  <!-- Containment rings -->
  <circle cx="64" cy="50" r="11" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.45"/>
  <circle cx="64" cy="50" r="14" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 3"/>

  <!-- === Layer 9: Cockpit === -->
  <ellipse cx="64" cy="28" rx="9" ry="16" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
  <ellipse cx="64" cy="25" rx="5.5" ry="10" fill="#0ea5e9" opacity="0.5"/>
  <ellipse cx="64" cy="23" rx="3" ry="6" fill="#38bdf8" opacity="0.4"/>
  <!-- Cockpit reflection -->
  <ellipse cx="62" cy="21" rx="1.5" ry="3" fill="#ffffff" opacity="0.2"/>

  <!-- === Layer 10: Nav lights === -->
  <circle cx="8" cy="71" r="3" fill="#ef4444" filter="url(#coreGl)"/>
  <circle cx="120" cy="71" r="3" fill="#22c55e" filter="url(#coreGl)"/>

  <!-- === Layer 11: Energy conduits === -->
  <line x1="54" y1="42" x2="54" y2="70" stroke="#60a5fa" stroke-width="1" opacity="0.35"/>
  <line x1="74" y1="42" x2="74" y2="70" stroke="#60a5fa" stroke-width="1" opacity="0.35"/>
  <line x1="64" y1="46" x2="64" y2="70" stroke="#3b82f6" stroke-width="0.6" opacity="0.2"/>
</svg>
