<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="envoyTriA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="envoyTriB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="envoyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="envoyCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="envoyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.04"/>
      <stop offset="90%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="envoyGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="envoyGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="envoyGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Aura field === -->
  <circle cx="64" cy="64" r="62" fill="url(#envoyAura)"/>
  <circle cx="64" cy="64" r="60" fill="url(#envoyGlow)"/>

  <!-- === Layer 1: Outer orbit rings === -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.3"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#d97706" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.2"/>

  <!-- === Layer 2: Radial energy lines (8 directions) === -->
  <!-- Cardinal directions (gold, stronger) -->
  <line x1="64" y1="12" x2="64" y2="30" stroke="#fbbf24" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
  <line x1="64" y1="98" x2="64" y2="116" stroke="#fbbf24" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="30" y2="64" stroke="#fbbf24" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
  <line x1="98" y1="64" x2="116" y2="64" stroke="#fbbf24" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
  <!-- Diagonal directions (darker, subtler) -->
  <line x1="22" y1="22" x2="36" y2="36" stroke="#d97706" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  <line x1="106" y1="22" x2="92" y2="36" stroke="#d97706" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  <line x1="22" y1="106" x2="36" y2="92" stroke="#d97706" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  <line x1="106" y1="106" x2="92" y2="92" stroke="#d97706" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  <!-- Ray endpoint glows (cardinal) -->
  <circle cx="64" cy="12" r="3" fill="#fbbf24" opacity="0.3" filter="url(#envoyGlt)"/>
  <circle cx="64" cy="116" r="3" fill="#fbbf24" opacity="0.3" filter="url(#envoyGlt)"/>
  <circle cx="12" cy="64" r="3" fill="#fbbf24" opacity="0.3" filter="url(#envoyGlt)"/>
  <circle cx="116" cy="64" r="3" fill="#fbbf24" opacity="0.3" filter="url(#envoyGlt)"/>

  <!-- === Layer 3: Hexagram body (Star of David — two overlapping triangles) === -->
  <!-- Upper triangle -->
  <polygon points="64,20 92,76 36,76" fill="url(#envoyTriA)" opacity="0.8" stroke="#fbbf24" stroke-width="1"/>
  <!-- Lower triangle -->
  <polygon points="64,108 36,52 92,52" fill="url(#envoyTriB)" opacity="0.8" stroke="#d97706" stroke-width="1"/>

  <!-- === Layer 4: Inner hexagram detail (smaller, brighter) === -->
  <polygon points="64,32 82,68 46,68" fill="none" stroke="#fef3c7" stroke-width="0.6" opacity="0.3"/>
  <polygon points="64,96 46,60 82,60" fill="none" stroke="#fef3c7" stroke-width="0.6" opacity="0.3"/>
  <!-- Hexagram edge highlights -->
  <line x1="50" y1="52" x2="78" y2="52" stroke="#fef3c7" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="76" x2="78" y2="76" stroke="#fef3c7" stroke-width="0.5" opacity="0.2"/>
  <line x1="36" y1="64" x2="92" y2="64" stroke="#fef3c7" stroke-width="0.4" opacity="0.15"/>

  <!-- === Layer 5: Star point gems (6 hexagram tips) === -->
  <circle cx="64" cy="20" r="3" fill="#fef3c7" opacity="0.7" filter="url(#envoyGls)"/>
  <circle cx="92" cy="76" r="3" fill="#fef3c7" opacity="0.7" filter="url(#envoyGls)"/>
  <circle cx="36" cy="76" r="3" fill="#fef3c7" opacity="0.7" filter="url(#envoyGls)"/>
  <circle cx="64" cy="108" r="3" fill="#fef3c7" opacity="0.7" filter="url(#envoyGls)"/>
  <circle cx="36" cy="52" r="3" fill="#fef3c7" opacity="0.7" filter="url(#envoyGls)"/>
  <circle cx="92" cy="52" r="3" fill="#fef3c7" opacity="0.7" filter="url(#envoyGls)"/>
  <!-- Inner gem dots -->
  <circle cx="64" cy="20" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="92" cy="76" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="36" cy="76" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="64" cy="108" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="36" cy="52" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="92" cy="52" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- === Layer 6: Central energy core === -->
  <circle cx="64" cy="64" r="14" fill="url(#envoyCore)" filter="url(#envoyGl)"/>
  <circle cx="64" cy="64" r="9" fill="#fef3c7" opacity="0.75"/>
  <circle cx="64" cy="64" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff" opacity="1"/>
  <!-- Core containment ring -->
  <circle cx="64" cy="64" r="17" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <circle cx="64" cy="64" r="20" fill="none" stroke="#d97706" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 3"/>
  <!-- Core reflection -->
  <ellipse cx="61" cy="60" rx="2" ry="3" fill="#ffffff" opacity="0.2"/>

  <!-- === Layer 7: Buff channel lines (inner star connections) === -->
  <line x1="64" y1="50" x2="50" y2="64" stroke="#fbbf24" stroke-width="0.6" opacity="0.2"/>
  <line x1="64" y1="50" x2="78" y2="64" stroke="#fbbf24" stroke-width="0.6" opacity="0.2"/>
  <line x1="50" y1="64" x2="64" y2="78" stroke="#fbbf24" stroke-width="0.6" opacity="0.2"/>
  <line x1="78" y1="64" x2="64" y2="78" stroke="#fbbf24" stroke-width="0.6" opacity="0.2"/>

  <!-- === Layer 8: Ambient particles === -->
  <circle cx="44" cy="36" r="1.5" fill="#fbbf24" opacity="0.4" filter="url(#envoyGlt)"/>
  <circle cx="86" cy="42" r="1" fill="#fef3c7" opacity="0.35" filter="url(#envoyGlt)"/>
  <circle cx="40" cy="88" r="1.2" fill="#fbbf24" opacity="0.3" filter="url(#envoyGlt)"/>
  <circle cx="90" cy="84" r="1.5" fill="#fef3c7" opacity="0.35" filter="url(#envoyGlt)"/>
  <circle cx="28" cy="64" r="1" fill="#d97706" opacity="0.3" filter="url(#envoyGlt)"/>
  <circle cx="100" cy="64" r="1" fill="#d97706" opacity="0.3" filter="url(#envoyGlt)"/>
</svg>
