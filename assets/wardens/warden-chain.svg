<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="chainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chainCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ddd6fe" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chainNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chainHex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="chainGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="chainGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="chainGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Ambient glow === -->
  <circle cx="64" cy="64" r="62" fill="url(#chainGlow)"/>

  <!-- === Layer 1: Outer energy ring (slow orbit) === -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 4" opacity="0.35"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#c4b5fd" stroke-width="0.5" opacity="0.15"/>
  <!-- Ring accent nodes (6 points) -->
  <circle cx="64" cy="14" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="107" cy="39" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="107" cy="89" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="64" cy="114" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="21" cy="89" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="21" cy="39" r="2" fill="#c4b5fd" opacity="0.4"/>

  <!-- === Layer 2: Middle energy ring === -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.5"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ddd6fe" stroke-width="0.4" opacity="0.15"/>

  <!-- === Layer 3: Inner energy ring === -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.65"/>
  <circle cx="64" cy="64" r="26" fill="none" stroke="#ddd6fe" stroke-width="0.3" opacity="0.2"/>

  <!-- === Layer 4: Lightning chains (6 directions) === -->
  <!-- Chain 1: North -->
  <line x1="64" y1="64" x2="64" y2="18" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  <path d="M64,52 L60,46 L68,40 L62,34 L66,28 L64,18" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- Chain 2: NE -->
  <line x1="64" y1="64" x2="108" y2="38" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  <path d="M76,58 L82,54 L86,48 L92,46 L98,40 L108,38" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- Chain 3: SE -->
  <line x1="64" y1="64" x2="108" y2="90" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  <path d="M76,70 L80,76 L88,78 L94,82 L100,88 L108,90" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- Chain 4: South -->
  <line x1="64" y1="64" x2="64" y2="110" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  <path d="M64,76 L68,82 L60,88 L66,94 L62,100 L64,110" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- Chain 5: SW -->
  <line x1="64" y1="64" x2="20" y2="90" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  <path d="M52,70 L48,76 L40,78 L34,82 L28,88 L20,90" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <!-- Chain 6: NW -->
  <line x1="64" y1="64" x2="20" y2="38" stroke="#a78bfa" stroke-width="1.8" opacity="0.5"/>
  <path d="M52,58 L46,54 L42,48 L36,46 L30,40 L20,38" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35" stroke-linecap="round"/>

  <!-- === Layer 5: Chain endpoint nodes (glowing) === -->
  <circle cx="64" cy="16" r="5" fill="url(#chainNode)" filter="url(#chainGls)"/>
  <circle cx="108" cy="38" r="5" fill="url(#chainNode)" filter="url(#chainGls)"/>
  <circle cx="108" cy="90" r="5" fill="url(#chainNode)" filter="url(#chainGls)"/>
  <circle cx="64" cy="112" r="5" fill="url(#chainNode)" filter="url(#chainGls)"/>
  <circle cx="20" cy="90" r="5" fill="url(#chainNode)" filter="url(#chainGls)"/>
  <circle cx="20" cy="38" r="5" fill="url(#chainNode)" filter="url(#chainGls)"/>
  <!-- Node inner glow -->
  <circle cx="64" cy="16" r="2.5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="108" cy="38" r="2.5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="108" cy="90" r="2.5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="64" cy="112" r="2.5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="20" cy="90" r="2.5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="20" cy="38" r="2.5" fill="#ddd6fe" opacity="0.7"/>

  <!-- === Layer 6: Hexagonal core === -->
  <polygon points="64,48 77.9,56 77.9,72 64,80 50.1,72 50.1,56" fill="url(#chainHex)" stroke="#ddd6fe" stroke-width="1.2" opacity="0.9"/>
  <!-- Inner hex edge glow -->
  <polygon points="64,52 74,58 74,70 64,76 54,70 54,58" fill="none" stroke="#c4b5fd" stroke-width="0.5" opacity="0.3"/>

  <!-- === Layer 7: Central energy orb === -->
  <circle cx="64" cy="64" r="10" fill="url(#chainCore)" filter="url(#chainGl)"/>
  <circle cx="64" cy="64" r="6.5" fill="#ddd6fe" opacity="0.7"/>
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" opacity="0.85"/>
  <!-- Core containment ring -->
  <circle cx="64" cy="64" r="12" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.4"/>

  <!-- === Layer 8: Spark particles (scattered) === -->
  <circle cx="48" cy="30" r="1.5" fill="#c4b5fd" opacity="0.5" filter="url(#chainGlt)"/>
  <circle cx="86" cy="34" r="1" fill="#ddd6fe" opacity="0.4" filter="url(#chainGlt)"/>
  <circle cx="94" cy="64" r="1.2" fill="#c4b5fd" opacity="0.45" filter="url(#chainGlt)"/>
  <circle cx="80" cy="96" r="1.5" fill="#ddd6fe" opacity="0.4" filter="url(#chainGlt)"/>
  <circle cx="38" cy="92" r="1" fill="#c4b5fd" opacity="0.5" filter="url(#chainGlt)"/>
  <circle cx="32" cy="52" r="1.2" fill="#ddd6fe" opacity="0.45" filter="url(#chainGlt)"/>
</svg>
