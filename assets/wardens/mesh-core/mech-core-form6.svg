<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="eng6" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="core6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shield6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="90%" stop-color="#60a5fa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.08"/>
    </radialGradient>
    <filter id="gl6"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gl6s"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Shield bubble === -->
  <circle cx="64" cy="58" r="63" fill="url(#shield6)"/>
  <circle cx="64" cy="58" r="60" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 4"/>
  <circle cx="64" cy="58" r="56" fill="none" stroke="#93c5fd" stroke-width="0.3" opacity="0.12" stroke-dasharray="1 6"/>

  <!-- === Layer 1: Energy halo (stronger than form5) === -->
  <circle cx="64" cy="54" r="58" fill="url(#halo6)"/>
  <circle cx="64" cy="54" r="52" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 4"/>
  <circle cx="64" cy="54" r="46" fill="none" stroke="#f97316" stroke-width="0.4" opacity="0.15" stroke-dasharray="3 6"/>

  <!-- === Layer 2: Quad engine super-flares === -->
  <ellipse cx="32" cy="104" rx="9" ry="22" fill="url(#eng6)"/>
  <ellipse cx="52" cy="106" rx="7" ry="18" fill="url(#eng6)"/>
  <ellipse cx="76" cy="106" rx="7" ry="18" fill="url(#eng6)"/>
  <ellipse cx="96" cy="104" rx="9" ry="22" fill="url(#eng6)"/>

  <!-- === Layer 3: Main fuselage (wider, heavier) === -->
  <polygon points="64,4 40,50 42,86 64,80 86,86 88,50" fill="url(#body6)" stroke="#fbbf24" stroke-width="1.8"/>
  <!-- Reinforced center spine -->
  <line x1="64" y1="10" x2="64" y2="78" stroke="#fbbf24" stroke-width="1" opacity="0.25"/>
  <!-- Upper armor chevrons -->
  <polygon points="52,28 40,50 56,46" fill="#1e293b" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <polygon points="76,28 88,50 72,46" fill="#1e293b" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <!-- Lower armor panels -->
  <polygon points="46,54 42,72 58,68" fill="#0f172a" stroke="#3b82f6" stroke-width="0.7" opacity="0.5"/>
  <polygon points="82,54 86,72 70,68" fill="#0f172a" stroke="#3b82f6" stroke-width="0.7" opacity="0.5"/>

  <!-- === Layer 4: Primary delta wings (larger than form5) === -->
  <polygon points="40,46 -2,70 10,60 32,40" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <polygon points="88,46 130,70 118,60 96,40" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <!-- Wing surface detail lines -->
  <line x1="20" y1="58" x2="36" y2="44" stroke="#fbbf24" stroke-width="0.4" opacity="0.2"/>
  <line x1="108" y1="58" x2="92" y2="44" stroke="#fbbf24" stroke-width="0.4" opacity="0.2"/>

  <!-- === Layer 5: Secondary swept wings (new in form6) === -->
  <polygon points="38,64 8,82 16,76 36,60" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8" opacity="0.8"/>
  <polygon points="90,64 120,82 112,76 92,60" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8" opacity="0.8"/>
  <!-- Tertiary ventral fins -->
  <polygon points="44,76 22,90 28,84 42,72" fill="#020617" stroke="#60a5fa" stroke-width="0.6" opacity="0.5"/>
  <polygon points="84,76 106,90 100,84 86,72" fill="#020617" stroke="#60a5fa" stroke-width="0.6" opacity="0.5"/>

  <!-- === Layer 6: Canards (forward wings, golden) === -->
  <polygon points="52,18 22,32 30,24 50,14" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <polygon points="76,18 106,32 98,24 78,14" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>

  <!-- === Layer 7: Weapon pods (6 total, 3 per side) === -->
  <rect x="2" y="62" width="14" height="5" rx="2" fill="#334155" stroke="#fbbf24" stroke-width="0.6"/>
  <rect x="2" y="70" width="12" height="4" rx="1.5" fill="#334155" stroke="#f97316" stroke-width="0.5"/>
  <rect x="112" y="62" width="14" height="5" rx="2" fill="#334155" stroke="#fbbf24" stroke-width="0.6"/>
  <rect x="114" y="70" width="12" height="4" rx="1.5" fill="#334155" stroke="#f97316" stroke-width="0.5"/>
  <!-- Missile pods on secondary wings -->
  <rect x="14" y="78" width="10" height="4" rx="1.5" fill="#334155" stroke="#ef4444" stroke-width="0.5"/>
  <rect x="104" y="78" width="10" height="4" rx="1.5" fill="#334155" stroke="#ef4444" stroke-width="0.5"/>
  <!-- Weapon glow points -->
  <circle cx="6" cy="64.5" r="1.5" fill="#ef4444" filter="url(#gl6s)"/>
  <circle cx="12" cy="64.5" r="1.5" fill="#ef4444" filter="url(#gl6s)"/>
  <circle cx="6" cy="72" r="1.2" fill="#f97316" filter="url(#gl6s)"/>
  <circle cx="116" cy="64.5" r="1.5" fill="#ef4444" filter="url(#gl6s)"/>
  <circle cx="122" cy="64.5" r="1.5" fill="#ef4444" filter="url(#gl6s)"/>
  <circle cx="122" cy="72" r="1.2" fill="#f97316" filter="url(#gl6s)"/>
  <circle cx="18" cy="80" r="1" fill="#ef4444" filter="url(#gl6s)"/>
  <circle cx="110" cy="80" r="1" fill="#ef4444" filter="url(#gl6s)"/>

  <!-- === Layer 8: Central energy core (exposed, powerful) === -->
  <circle cx="64" cy="60" r="8" fill="url(#core6)" filter="url(#gl6)"/>
  <circle cx="64" cy="60" r="5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="64" cy="60" r="2.5" fill="#ffffff" opacity="0.8"/>
  <!-- Core containment ring -->
  <circle cx="64" cy="60" r="10" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.5"/>
  <circle cx="64" cy="60" r="13" fill="none" stroke="#f97316" stroke-width="0.6" opacity="0.3" stroke-dasharray="2 3"/>

  <!-- === Layer 9: Belly turret (upgraded, double) === -->
  <circle cx="56" cy="68" r="3.5" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8"/>
  <circle cx="56" cy="68" r="1.5" fill="#fbbf24" opacity="0.7" filter="url(#gl6s)"/>
  <circle cx="72" cy="68" r="3.5" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8"/>
  <circle cx="72" cy="68" r="1.5" fill="#fbbf24" opacity="0.7" filter="url(#gl6s)"/>

  <!-- === Layer 10: Quad engines === -->
  <rect x="28" y="82" width="10" height="18" rx="4" fill="#020617" stroke="#fbbf24" stroke-width="1"/>
  <rect x="46" y="84" width="10" height="16" rx="4" fill="#020617" stroke="#f97316" stroke-width="0.8"/>
  <rect x="72" y="84" width="10" height="16" rx="4" fill="#020617" stroke="#f97316" stroke-width="0.8"/>
  <rect x="90" y="82" width="10" height="18" rx="4" fill="#020617" stroke="#fbbf24" stroke-width="1"/>
  <!-- Engine exhaust glow -->
  <ellipse cx="33" cy="100" rx="4.5" ry="4" fill="#fbbf24" filter="url(#gl6)"/>
  <ellipse cx="51" cy="100" rx="4" ry="3.5" fill="#f97316" filter="url(#gl6)"/>
  <ellipse cx="77" cy="100" rx="4" ry="3.5" fill="#f97316" filter="url(#gl6)"/>
  <ellipse cx="95" cy="100" rx="4.5" ry="4" fill="#fbbf24" filter="url(#gl6)"/>

  <!-- === Layer 11: Cockpit (reinforced golden canopy) === -->
  <ellipse cx="64" cy="22" rx="11" ry="19" fill="#0c4a6e" stroke="#fbbf24" stroke-width="1.5"/>
  <ellipse cx="64" cy="20" rx="8" ry="14" fill="#0e7490" opacity="0.6"/>
  <ellipse cx="64" cy="18" rx="5" ry="9" fill="#0ea5e9" opacity="0.5"/>
  <ellipse cx="64" cy="16" rx="2.5" ry="5" fill="#38bdf8" opacity="0.4"/>
  <!-- Cockpit reflection -->
  <ellipse cx="61" cy="14" rx="1.5" ry="3" fill="#ffffff" opacity="0.2"/>

  <!-- === Layer 12: Nav lights (larger) === -->
  <circle cx="0" cy="69" r="4" fill="#ef4444" filter="url(#gl6)"/>
  <circle cx="128" cy="69" r="4" fill="#22c55e" filter="url(#gl6)"/>

  <!-- === Layer 13: Golden energy conduits === -->
  <line x1="50" y1="38" x2="50" y2="76" stroke="#fbbf24" stroke-width="1.2" opacity="0.35"/>
  <line x1="78" y1="38" x2="78" y2="76" stroke="#fbbf24" stroke-width="1.2" opacity="0.35"/>
  <line x1="64" y1="42" x2="64" y2="56" stroke="#fbbf24" stroke-width="1.5" opacity="0.25"/>
  <!-- Cross conduits (new in form6) -->
  <line x1="50" y1="50" x2="78" y2="50" stroke="#f97316" stroke-width="0.5" opacity="0.2"/>
  <line x1="50" y1="65" x2="78" y2="65" stroke="#f97316" stroke-width="0.5" opacity="0.2"/>

  <!-- === Layer 14: Crown emblem (upgraded, triple-pointed) === -->
  <polygon points="64,0 56,10 60,6 62,12 64,4 66,12 68,6 72,10" fill="#fbbf24" opacity="0.9" filter="url(#gl6)"/>
  <!-- Crown side jewels -->
  <circle cx="57" cy="9" r="1.2" fill="#ef4444" filter="url(#gl6s)"/>
  <circle cx="71" cy="9" r="1.2" fill="#ef4444" filter="url(#gl6s)"/>
</svg>
