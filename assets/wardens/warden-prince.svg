<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="princeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="princeInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="princeGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="princeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="princeFlame" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="princeGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="princeGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Heat halo === -->
  <circle cx="64" cy="52" r="60" fill="url(#princeGlow)"/>
  <circle cx="64" cy="52" r="54" fill="none" stroke="#fbbf24" stroke-width="0.6" opacity="0.2" stroke-dasharray="2 4"/>

  <!-- === Layer 1: Flame trails (exhaust) === -->
  <ellipse cx="38" cy="94" rx="10" ry="22" fill="url(#princeFlame)"/>
  <ellipse cx="64" cy="98" rx="8" ry="24" fill="url(#princeFlame)"/>
  <ellipse cx="90" cy="94" rx="10" ry="22" fill="url(#princeFlame)"/>
  <!-- Inner flame cores -->
  <ellipse cx="38" cy="96" rx="4" ry="12" fill="#fbbf24" opacity="0.6" filter="url(#princeGl)"/>
  <ellipse cx="64" cy="100" rx="3" ry="14" fill="#fef3c7" opacity="0.5" filter="url(#princeGl)"/>
  <ellipse cx="90" cy="96" rx="4" ry="12" fill="#fbbf24" opacity="0.6" filter="url(#princeGl)"/>

  <!-- === Layer 2: Outer diamond body === -->
  <polygon points="64,8 106,52 64,88 22,52" fill="url(#princeBody)" stroke="#fbbf24" stroke-width="1.8"/>
  <!-- Center spine -->
  <line x1="64" y1="12" x2="64" y2="84" stroke="#fef3c7" stroke-width="0.8" opacity="0.2"/>

  <!-- === Layer 3: Armor chevrons === -->
  <polygon points="44,30 22,52 42,48" fill="#ea580c" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <polygon points="84,30 106,52 86,48" fill="#ea580c" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <!-- Lower armor panels -->
  <polygon points="36,56 22,52 40,72" fill="#c2410c" stroke="#f97316" stroke-width="0.5" opacity="0.45"/>
  <polygon points="92,56 106,52 88,72" fill="#c2410c" stroke="#f97316" stroke-width="0.5" opacity="0.45"/>

  <!-- === Layer 4: Inner diamond (brighter) === -->
  <polygon points="64,26 84,52 64,74 44,52" fill="url(#princeInner)" opacity="0.55"/>
  <!-- Inner armor lines -->
  <line x1="54" y1="38" x2="44" y2="52" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>
  <line x1="74" y1="38" x2="84" y2="52" stroke="#fbbf24" stroke-width="0.5" opacity="0.3"/>

  <!-- === Layer 5: Side flame wings (swept back) === -->
  <path d="M34,56 Q14,72 18,96 L30,78 Q26,66 34,56 Z" fill="#ea580c" opacity="0.65" stroke="#fbbf24" stroke-width="0.5"/>
  <path d="M94,56 Q114,72 110,96 L98,78 Q102,66 94,56 Z" fill="#ea580c" opacity="0.65" stroke="#fbbf24" stroke-width="0.5"/>
  <!-- Secondary inner flames -->
  <path d="M36,62 Q22,76 26,92 L34,76 Z" fill="#f97316" opacity="0.4"/>
  <path d="M92,62 Q106,76 102,92 L94,76 Z" fill="#f97316" opacity="0.4"/>

  <!-- === Layer 6: Tail flame === -->
  <polygon points="54,80 64,118 74,80" fill="#c2410c" opacity="0.6"/>
  <polygon points="58,82 64,110 70,82" fill="#ea580c" opacity="0.45"/>
  <polygon points="61,84 64,102 67,84" fill="#fbbf24" opacity="0.3" filter="url(#princeGls)"/>

  <!-- === Layer 7: Energy core (central) === -->
  <circle cx="64" cy="48" r="10" fill="url(#princeCore)" filter="url(#princeGl)"/>
  <circle cx="64" cy="48" r="6" fill="#fef3c7" opacity="0.7"/>
  <circle cx="64" cy="48" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- Core containment ring -->
  <circle cx="64" cy="48" r="12" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <circle cx="64" cy="48" r="15" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 3"/>

  <!-- === Layer 8: Eyes (fierce, aggressive) === -->
  <ellipse cx="54" cy="44" rx="5" ry="7" fill="#fef3c7" opacity="0.9" stroke="#fbbf24" stroke-width="0.5"/>
  <ellipse cx="74" cy="44" rx="5" ry="7" fill="#fef3c7" opacity="0.9" stroke="#fbbf24" stroke-width="0.5"/>
  <!-- Pupils (red-orange, glowing) -->
  <circle cx="55" cy="43" r="2.5" fill="#dc2626" filter="url(#princeGls)"/>
  <circle cx="75" cy="43" r="2.5" fill="#dc2626" filter="url(#princeGls)"/>
  <!-- Eye highlights -->
  <circle cx="53" cy="41" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="73" cy="41" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- === Layer 9: Crown/horns (fire spirit emblem) === -->
  <polygon points="64,4 58,14 61,10 64,16 67,10 70,14" fill="#fbbf24" opacity="0.85" filter="url(#princeGl)"/>
  <!-- Side flame horns -->
  <polygon points="40,26 34,18 38,24" fill="#f97316" opacity="0.6" filter="url(#princeGls)"/>
  <polygon points="88,26 94,18 90,24" fill="#f97316" opacity="0.6" filter="url(#princeGls)"/>

  <!-- === Layer 10: Energy conduits === -->
  <line x1="48" y1="36" x2="38" y2="62" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="36" x2="90" y2="62" stroke="#fbbf24" stroke-width="0.8" opacity="0.3"/>
  <!-- Fireball charge points -->
  <circle cx="18" cy="92" r="3" fill="#ef4444" opacity="0.6" filter="url(#princeGls)"/>
  <circle cx="110" cy="92" r="3" fill="#ef4444" opacity="0.6" filter="url(#princeGls)"/>
</svg>
