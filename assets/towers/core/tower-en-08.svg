<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- en-08 湮灭射线塔：大型底座 + 红色聚焦球 -->
  <defs>
    <radialGradient id="en08core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="en08glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外层红光晕 -->
  <circle cx="64" cy="52" r="48" fill="url(#en08glow)"/>
  <!-- 大型底座 -->
  <ellipse cx="64" cy="106" rx="38" ry="14" fill="#1c1917" opacity="0.8"/>
  <polygon points="38,56 90,56 94,100 34,100" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
  <!-- 支撑臂（四根） -->
  <line x1="44" y1="56" x2="52" y2="38" stroke="#44403c" stroke-width="3"/>
  <line x1="84" y1="56" x2="76" y2="38" stroke="#44403c" stroke-width="3"/>
  <line x1="50" y1="56" x2="56" y2="42" stroke="#44403c" stroke-width="2"/>
  <line x1="78" y1="56" x2="72" y2="42" stroke="#44403c" stroke-width="2"/>
  <!-- 红色聚焦球 -->
  <circle cx="64" cy="36" r="22" fill="url(#en08core)"/>
  <!-- 核心亮点 -->
  <circle cx="60" cy="30" r="6" fill="#fca5a5" opacity="0.6"/>
  <circle cx="64" cy="36" r="3" fill="#fff" opacity="0.4"/>
</svg>
