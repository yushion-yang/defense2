<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- en-04 光束照射塔：宽扁底座 + 矩形发射面板 -->
  <defs>
    <linearGradient id="en04base" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="en04panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- 底座（宽扁） -->
  <ellipse cx="64" cy="100" rx="40" ry="14" fill="url(#en04base)" opacity="0.8"/>
  <rect x="34" y="60" width="60" height="42" rx="6" fill="url(#en04base)"/>
  <!-- 发射面板（矩形） -->
  <rect x="28" y="28" width="72" height="36" rx="4" fill="url(#en04panel)" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- 能量格纹 -->
  <line x1="40" y1="32" x2="40" y2="60" stroke="#dbeafe" stroke-width="1" opacity="0.3"/>
  <line x1="52" y1="32" x2="52" y2="60" stroke="#dbeafe" stroke-width="1" opacity="0.3"/>
  <line x1="64" y1="32" x2="64" y2="60" stroke="#dbeafe" stroke-width="1" opacity="0.3"/>
  <line x1="76" y1="32" x2="76" y2="60" stroke="#dbeafe" stroke-width="1" opacity="0.3"/>
  <line x1="88" y1="32" x2="88" y2="60" stroke="#dbeafe" stroke-width="1" opacity="0.3"/>
  <!-- 中央发光核心 -->
  <rect x="48" y="38" width="32" height="14" rx="2" fill="#dbeafe" opacity="0.7"/>
  <rect x="52" y="41" width="24" height="8" rx="1" fill="#fff" opacity="0.5"/>
</svg>
