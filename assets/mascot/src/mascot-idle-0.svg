<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 180">
  <defs>
    <!-- Hair gradients -->
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4A0F0"/>
      <stop offset="100%" stop-color="#9B75D0"/>
    </linearGradient>
    <linearGradient id="hairShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B75D0"/>
      <stop offset="100%" stop-color="#7B55B0"/>
    </linearGradient>

    <!-- Eye iris -->
    <radialGradient id="irisL" cx="0.45" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#90D0FF"/>
      <stop offset="45%" stop-color="#50A0F0"/>
      <stop offset="100%" stop-color="#2868D0"/>
    </radialGradient>
    <radialGradient id="irisR" cx="0.45" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#90D0FF"/>
      <stop offset="45%" stop-color="#50A0F0"/>
      <stop offset="100%" stop-color="#2868D0"/>
    </radialGradient>

    <!-- Outfit -->
    <linearGradient id="outfit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8CF0"/>
      <stop offset="100%" stop-color="#4878E0"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A7CE8"/>
      <stop offset="100%" stop-color="#3868D8"/>
    </linearGradient>
  </defs>

  <!-- ============ BACK HAIR ============ -->
  <!-- Main hair volume behind head -->
  <ellipse cx="64" cy="44" rx="43" ry="40" fill="url(#hair)"/>

  <!-- Twin tail LEFT -->
  <path d="M 24,48 C 16,68 12,92 16,118
           C 17,124 23,122 22,116
           C 19,94 22,72 28,54 Z" fill="url(#hairShadow)"/>
  <path d="M 26,50 C 20,66 17,88 20,112
           C 21,117 25,115 24,110
           C 22,90 24,70 29,55 Z" fill="url(#hair)"/>

  <!-- Twin tail RIGHT -->
  <path d="M 104,48 C 112,68 116,92 112,118
           C 111,124 105,122 106,116
           C 109,94 106,72 100,54 Z" fill="url(#hairShadow)"/>
  <path d="M 102,50 C 108,66 111,88 108,112
           C 107,117 103,115 104,110
           C 106,90 104,70 99,55 Z" fill="url(#hair)"/>

  <!-- Hair tie bows LEFT -->
  <circle cx="26" cy="50" r="4.5" fill="#FF6090"/>
  <circle cx="26" cy="50" r="2.5" fill="#FF78A0"/>

  <!-- Hair tie bows RIGHT -->
  <circle cx="102" cy="50" r="4.5" fill="#FF6090"/>
  <circle cx="102" cy="50" r="2.5" fill="#FF78A0"/>

  <!-- ============ FACE ============ -->
  <ellipse cx="64" cy="52" rx="34" ry="32" fill="#FFE2CC"/>
  <!-- Subtle jaw shadow -->
  <ellipse cx="64" cy="62" rx="30" ry="22" fill="#FFD8BE" opacity="0.4"/>

  <!-- ============ EYES ============ -->
  <!-- LEFT EYE -->
  <!-- Outer shape / sclera -->
  <ellipse cx="47" cy="52" rx="11" ry="12.5" fill="white"/>
  <!-- Iris -->
  <ellipse cx="47" cy="53.5" rx="9" ry="10.5" fill="url(#irisL)"/>
  <!-- Pupil -->
  <ellipse cx="47" cy="55.5" rx="4" ry="5" fill="#0E1840"/>
  <!-- Main highlight upper-left -->
  <ellipse cx="43" cy="48" rx="3.8" ry="3.2" fill="white" opacity="0.92"/>
  <!-- Secondary highlight lower-right -->
  <circle cx="51" cy="56.5" r="2" fill="white" opacity="0.65"/>
  <!-- Tiny sparkle -->
  <circle cx="44.5" cy="52" r="1" fill="white" opacity="0.5"/>
  <!-- Upper eyelid -->
  <path d="M 35.5,43 Q 41,38.5 47,38.5 Q 53,38.5 58.5,43"
        fill="none" stroke="#4A3080" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Eyelashes -->
  <path d="M 35.5,43 L 33,40" stroke="#4A3080" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 58.5,43 L 60.5,40" stroke="#4A3080" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Lower lid subtle line -->
  <path d="M 38,62.5 Q 43,65 47,65 Q 51,65 56,62.5"
        fill="none" stroke="#7060A0" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>

  <!-- RIGHT EYE -->
  <ellipse cx="81" cy="52" rx="11" ry="12.5" fill="white"/>
  <ellipse cx="81" cy="53.5" rx="9" ry="10.5" fill="url(#irisR)"/>
  <ellipse cx="81" cy="55.5" rx="4" ry="5" fill="#0E1840"/>
  <ellipse cx="77" cy="48" rx="3.8" ry="3.2" fill="white" opacity="0.92"/>
  <circle cx="85" cy="56.5" r="2" fill="white" opacity="0.65"/>
  <circle cx="78.5" cy="52" r="1" fill="white" opacity="0.5"/>
  <path d="M 69.5,43 Q 75,38.5 81,38.5 Q 87,38.5 92.5,43"
        fill="none" stroke="#4A3080" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 69.5,43 L 67,40" stroke="#4A3080" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 92.5,43 L 95,40" stroke="#4A3080" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 72,62.5 Q 77,65 81,65 Q 85,65 90,62.5"
        fill="none" stroke="#7060A0" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>

  <!-- ============ BLUSH ============ -->
  <ellipse cx="34" cy="63" rx="7.5" ry="4" fill="#FFA0A0" opacity="0.30"/>
  <ellipse cx="94" cy="63" rx="7.5" ry="4" fill="#FFA0A0" opacity="0.30"/>

  <!-- ============ MOUTH ============ -->
  <!-- Small happy cat-mouth -->
  <path d="M 58,69 Q 61,72.5 64,70 Q 67,72.5 70,69"
        fill="none" stroke="#D07070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ FRONT HAIR (BANGS) ============ -->
  <path d="M 26,44
           C 24,28 34,16 48,12
           C 56,10 72,10 80,12
           C 94,16 104,28 102,44
           C 98,38 90,30 82,27
           C 74,24 68,26 64,25
           C 60,26 54,24 46,27
           C 38,30 30,38 26,44 Z" fill="url(#hair)"/>

  <!-- Bang strand highlights -->
  <path d="M 38,42 C 36,32 40,22 48,15" fill="none" stroke="#D4B8F8" stroke-width="0.8" opacity="0.4"/>
  <path d="M 54,38 C 53,28 56,18 62,13" fill="none" stroke="#D4B8F8" stroke-width="0.8" opacity="0.4"/>
  <path d="M 74,38 C 74,28 76,18 80,14" fill="none" stroke="#D4B8F8" stroke-width="0.8" opacity="0.4"/>
  <path d="M 90,42 C 90,34 86,24 80,16" fill="none" stroke="#D4B8F8" stroke-width="0.8" opacity="0.4"/>

  <!-- Side hair strands (frame the face) -->
  <path d="M 28,44 C 24,58 22,74 24,90
           C 25,94 28,92 27,88
           C 26,74 28,60 30,48 Z" fill="url(#hair)"/>
  <path d="M 100,44 C 104,58 106,74 104,90
           C 103,94 100,92 101,88
           C 102,74 100,60 98,48 Z" fill="url(#hair)"/>

  <!-- ============ BERET ============ -->
  <ellipse cx="64" cy="15" rx="28" ry="11" fill="#4878E8"/>
  <ellipse cx="64" cy="13" rx="24" ry="9" fill="#5888F0"/>
  <!-- Beret pom-pom -->
  <circle cx="64" cy="5" r="4.5" fill="#6898F8"/>
  <circle cx="64" cy="5" r="2.5" fill="#80A8FF"/>
  <!-- Beret band -->
  <path d="M 36,16 Q 64,22 92,16" fill="none" stroke="#3860C8" stroke-width="1.2"/>
  <!-- Gold star badge -->
  <polygon points="52,15 53.5,12 55,15 58,15.5 56,17.5 56.5,20.5 54,19 51.5,20.5 52,17.5 50,15.5"
           fill="#FFD700" stroke="#E8B800" stroke-width="0.3"/>

  <!-- ============ NECK ============ -->
  <path d="M 56,82 C 56,86 58,88 64,88 C 70,88 72,86 72,82 Z" fill="#FFD8C0"/>

  <!-- ============ ARMS (behind body) ============ -->
  <!-- Left arm -->
  <path d="M 42,94 C 36,102 32,112 30,122
           C 29,126 33,126 34,122
           C 35,114 38,106 42,98 Z" fill="#FFD8C0"/>
  <!-- Left hand -->
  <ellipse cx="31" cy="124" rx="4.5" ry="4" fill="#FFE0CC"/>

  <!-- Right arm -->
  <path d="M 86,94 C 92,102 96,112 98,122
           C 99,126 95,126 94,122
           C 93,114 90,106 86,98 Z" fill="#FFD8C0"/>
  <!-- Right hand -->
  <ellipse cx="97" cy="124" rx="4.5" ry="4" fill="#FFE0CC"/>

  <!-- ============ BODY / TORSO ============ -->
  <path d="M 44,88 C 42,100 40,112 38,126
           L 90,126
           C 88,112 86,100 84,88 Z" fill="url(#outfit)"/>

  <!-- Sailor collar -->
  <path d="M 46,88 L 64,103 L 82,88 L 78,87 L 64,100 L 50,87 Z" fill="white"/>
  <path d="M 48,88 L 64,101 L 80,88" fill="none" stroke="#4070E0" stroke-width="0.8" opacity="0.5"/>

  <!-- Collar ribbon bow -->
  <path d="M 57,90 L 64,97 L 71,90" fill="#FF6090"/>
  <path d="M 59,90 L 64,95 L 69,90" fill="#FF78A0"/>
  <circle cx="64" cy="90" r="2.8" fill="#FF6090"/>
  <circle cx="64" cy="90" r="1.5" fill="#FF78A0"/>

  <!-- Puff sleeves -->
  <ellipse cx="42" cy="92" rx="6" ry="5" fill="white"/>
  <ellipse cx="86" cy="92" rx="6" ry="5" fill="white"/>
  <!-- Sleeve cuffs -->
  <path d="M 36,95 Q 42,98 48,95" fill="none" stroke="#D0D4E0" stroke-width="0.8"/>
  <path d="M 80,95 Q 86,98 92,95" fill="none" stroke="#D0D4E0" stroke-width="0.8"/>

  <!-- Gold buttons -->
  <circle cx="64" cy="108" r="1.8" fill="#FFD700"/>
  <circle cx="64" cy="108" r="0.8" fill="#FFF0A0"/>
  <circle cx="64" cy="116" r="1.8" fill="#FFD700"/>
  <circle cx="64" cy="116" r="0.8" fill="#FFF0A0"/>

  <!-- ============ SKIRT ============ -->
  <path d="M 36,124 C 33,134 29,142 26,150
           L 102,150
           C 99,142 95,134 92,124 Z" fill="url(#skirt)"/>
  <!-- Skirt pleats -->
  <line x1="46" y1="124" x2="39" y2="150" stroke="#3060C8" stroke-width="0.7" opacity="0.35"/>
  <line x1="55" y1="124" x2="50" y2="150" stroke="#3060C8" stroke-width="0.7" opacity="0.35"/>
  <line x1="64" y1="124" x2="64" y2="150" stroke="#3060C8" stroke-width="0.7" opacity="0.35"/>
  <line x1="73" y1="124" x2="78" y2="150" stroke="#3060C8" stroke-width="0.7" opacity="0.35"/>
  <line x1="82" y1="124" x2="89" y2="150" stroke="#3060C8" stroke-width="0.7" opacity="0.35"/>
  <!-- Skirt hem highlight -->
  <path d="M 26,149 L 102,149" stroke="white" stroke-width="0.8" opacity="0.2"/>

  <!-- ============ LEGS ============ -->
  <!-- Thigh-high socks -->
  <path d="M 44,150 L 44,168 Q 44,172 50,172 Q 56,172 56,168 L 56,150 Z" fill="white"/>
  <path d="M 72,150 L 72,168 Q 72,172 78,172 Q 84,172 84,168 L 84,150 Z" fill="white"/>
  <!-- Sock top bands -->
  <rect x="43" y="150" width="14" height="2.5" rx="1" fill="#E0E0F0"/>
  <rect x="71" y="150" width="14" height="2.5" rx="1" fill="#E0E0F0"/>

  <!-- ============ SHOES ============ -->
  <path d="M 42,168 C 42,174 46,177 50,177 C 54,177 58,174 58,168 Z" fill="#2D2D48"/>
  <path d="M 70,168 C 70,174 74,177 78,177 C 82,177 86,174 86,168 Z" fill="#2D2D48"/>
  <!-- Shoe straps -->
  <path d="M 43,170 L 57,170" stroke="#4878E8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 71,170 L 85,170" stroke="#4878E8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Strap buckles -->
  <circle cx="50" cy="170" r="1.2" fill="#FFD700"/>
  <circle cx="78" cy="170" r="1.2" fill="#FFD700"/>
</svg>
