<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="64" cy="118" rx="28" ry="6" fill="url(#shadowGrad)"/>

  <!-- 传送环 -->
  <ellipse cx="64" cy="78" rx="30" ry="8" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
  <ellipse cx="64" cy="78" rx="26" ry="6" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.4"/>

  <!-- 左腿（后撤） -->
  <rect x="46" y="90" width="10" height="18" rx="5" fill="#0c6478" transform="rotate(8 51 90)"/>
  <!-- 右腿（前迈） -->
  <rect x="72" y="90" width="10" height="18" rx="5" fill="#0c6478" transform="rotate(-8 77 90)"/>

  <!-- 左脚 -->
  <ellipse cx="57" cy="111" rx="7" ry="4" fill="#0a5568"/>
  <!-- 右脚 -->
  <ellipse cx="71" cy="111" rx="7" ry="4" fill="#0a5568"/>

  <!-- 身体 -->
  <ellipse cx="64" cy="65" rx="28" ry="32" fill="url(#bodyGrad)"/>

  <!-- 传送纹路 -->
  <path d="M50 50 L55 58 L48 62 L56 72" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M78 50 L73 58 L80 62 L72 72" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 面罩 -->
  <ellipse cx="64" cy="52" rx="18" ry="12" fill="#083344" opacity="0.85"/>

  <!-- 眼睛 -->
  <ellipse cx="64" cy="52" rx="11" ry="9" fill="url(#eyeGrad)"/>
  <circle cx="64" cy="53" r="5" fill="#155e75"/>
  <circle cx="64" cy="53" r="3" fill="#0e7490"/>
  <circle cx="61" cy="50" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="67" cy="55" r="1.2" fill="white" opacity="0.5"/>

  <!-- 天线 -->
  <line x1="64" y1="33" x2="64" y2="22" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="20" r="4" fill="#22d3ee" opacity="0.9"/>
  <circle cx="64" cy="20" r="2.5" fill="#ecfeff"/>

  <!-- 肩翼 -->
  <path d="M36 58 L28 50 L32 60 Z" fill="#0891b2" opacity="0.7"/>
  <path d="M92 58 L100 50 L96 60 Z" fill="#0891b2" opacity="0.7"/>

  <ellipse cx="64" cy="112" rx="22" ry="5" fill="url(#glowGrad)"/>
</svg>
