<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a21caf"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="112" rx="22" ry="9" fill="rgba(15,23,42,0.25)"/>
  <!-- Legs -->
  <path d="M54 88 L50 106" stroke="#581c87" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 88 L78 106" stroke="#581c87" stroke-width="5" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="46" y="46" width="36" height="40" rx="10" fill="url(#body)" stroke="#d946ef" stroke-width="3" filter="url(#shadow)"/>
  <!-- Stun-immune symbol -->
  <circle cx="64" cy="66" r="12" fill="rgba(217,70,239,0.2)" stroke="#d946ef" stroke-width="1.5"/>
  <text x="64" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#fae8ff" font-family="sans-serif">!</text>
  <line x1="57" y1="59" x2="71" y2="73" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Stun-immune aura -->
  <circle cx="64" cy="66" r="26" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="5 5" opacity="0.5"/>
  <!-- Head: protected helmet -->
  <circle cx="64" cy="34" r="14" fill="#f5d0fe" stroke="#a21caf" stroke-width="2"/>
  <rect x="50" y="22" width="28" height="10" rx="5" fill="#86198f"/>
  <circle cx="58" cy="34" r="2" fill="#0f172a"/>
  <circle cx="70" cy="34" r="2" fill="#0f172a"/>
  <path d="M57 40 Q64 43 71 40" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M46 54 L32 66" stroke="#a21caf" stroke-width="6" stroke-linecap="round"/>
  <path d="M82 54 L96 66" stroke="#a21caf" stroke-width="6" stroke-linecap="round"/>
  <!-- Fists: clenched -->
  <circle cx="30" cy="68" r="5" fill="#d946ef"/>
  <circle cx="98" cy="68" r="5" fill="#d946ef"/>
</svg>
