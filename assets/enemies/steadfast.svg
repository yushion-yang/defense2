<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="112" rx="20" ry="8" fill="rgba(15,23,42,0.25)"/>
  <!-- Legs: swift stance -->
  <path d="M54 88 L48 108" stroke="#155e75" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 88 L80 108" stroke="#155e75" stroke-width="5" stroke-linecap="round"/>
  <!-- Body: streamlined -->
  <rect x="48" y="48" width="32" height="38" rx="12" fill="url(#body)" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <!-- Slow-immune aura ring -->
  <circle cx="64" cy="68" r="28" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <!-- Cross-out slow icon -->
  <circle cx="64" cy="68" r="10" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="64" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#ecfeff" font-family="sans-serif">S</text>
  <line x1="57" y1="61" x2="71" y2="75" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="64" cy="36" r="13" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <circle cx="59" cy="35" r="2" fill="#0f172a"/>
  <circle cx="69" cy="35" r="2" fill="#0f172a"/>
  <path d="M58 40 Q64 43 70 40" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M48 56 L36 66" stroke="#0891b2" stroke-width="6" stroke-linecap="round"/>
  <path d="M80 56 L92 66" stroke="#0891b2" stroke-width="6" stroke-linecap="round"/>
  <!-- Speed lines -->
  <path d="M24 50 L34 50" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  <path d="M22 60 L32 60" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  <path d="M24 70 L34 70" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
</svg>
