<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="112" rx="24" ry="9" fill="rgba(15,23,42,0.25)"/>
  <!-- Legs -->
  <path d="M50 90 L46 108" stroke="#57534e" stroke-width="6" stroke-linecap="round"/>
  <path d="M78 90 L82 108" stroke="#57534e" stroke-width="6" stroke-linecap="round"/>
  <!-- Body: heavy plated -->
  <rect x="44" y="48" width="40" height="40" rx="8" fill="url(#armor)" stroke="#a8a29e" stroke-width="3" filter="url(#shadow)"/>
  <!-- Rivets -->
  <circle cx="50" cy="56" r="2.5" fill="#44403c"/>
  <circle cx="78" cy="56" r="2.5" fill="#44403c"/>
  <circle cx="50" cy="80" r="2.5" fill="#44403c"/>
  <circle cx="78" cy="80" r="2.5" fill="#44403c"/>
  <!-- Center plate -->
  <rect x="54" y="58" width="20" height="20" rx="4" fill="#57534e" stroke="#a8a29e" stroke-width="2"/>
  <text x="64" y="73" text-anchor="middle" font-size="14" font-weight="bold" fill="#e7e5e4" font-family="sans-serif">60</text>
  <!-- Head -->
  <circle cx="64" cy="36" r="14" fill="#d6d3d1" stroke="#78716c" stroke-width="2"/>
  <rect x="50" y="28" width="28" height="8" rx="4" fill="#57534e"/>
  <circle cx="58" cy="35" r="2" fill="#0f172a"/>
  <circle cx="70" cy="35" r="2" fill="#0f172a"/>
  <!-- Arms -->
  <path d="M44 56 L30 68" stroke="#78716c" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 56 L98 68" stroke="#78716c" stroke-width="7" stroke-linecap="round"/>
</svg>
