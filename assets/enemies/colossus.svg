<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="116" rx="32" ry="10" fill="rgba(15,23,42,0.3)"/>
  <!-- Legs: thick pillars -->
  <rect x="40" y="88" width="14" height="24" rx="5" fill="#57534e"/>
  <rect x="74" y="88" width="14" height="24" rx="5" fill="#57534e"/>
  <!-- Massive body -->
  <rect x="34" y="38" width="60" height="52" rx="12" fill="url(#stone)" stroke="#a8a29e" stroke-width="3" filter="url(#shadow)"/>
  <!-- Regen glow -->
  <circle cx="64" cy="64" r="16" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
  <circle cx="64" cy="64" r="10" fill="#4ade80" opacity="0.15"/>
  <!-- Cracks pattern -->
  <path d="M48 50 L56 62 L50 74" stroke="#292524" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M80 48 L74 58 L82 70" stroke="#292524" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Head: small compared to body -->
  <circle cx="64" cy="28" r="12" fill="#a8a29e" stroke="#57534e" stroke-width="2"/>
  <circle cx="59" cy="27" r="2.5" fill="#ef4444"/>
  <circle cx="69" cy="27" r="2.5" fill="#ef4444"/>
  <!-- Shoulders -->
  <rect x="26" y="42" width="14" height="20" rx="6" fill="#57534e"/>
  <rect x="88" y="42" width="14" height="20" rx="6" fill="#57534e"/>
  <!-- %HP cap symbol -->
  <text x="64" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#fbbf24" font-family="sans-serif">8%</text>
</svg>
