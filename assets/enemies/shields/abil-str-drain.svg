<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- 吸能漩涡：表示削弱炮塔 -->
  <circle cx="40" cy="40" r="25" fill="none" stroke="#AA55FF" stroke-width="3"/>
  <!-- 螺旋线 -->
  <path d="M 40,15 A 25,25 0 0 1 65,40" fill="none" stroke="#CC77FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M 65,40 A 25,25 0 0 1 40,65" fill="none" stroke="#BB66FF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 40,65 A 25,25 0 0 1 15,40" fill="none" stroke="#AA55EE" stroke-width="3" stroke-linecap="round"/>
  <!-- 中心吸入箭头 -->
  <polygon points="40,30 35,42 40,38 45,42" fill="#DD88FF"/>
  <polygon points="40,50 45,38 40,42 35,38" fill="#DD88FF"/>
</svg>
