<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="80" height="96">
  <!-- 旗杆 -->
  <line x1="20" y1="10" x2="20" y2="90" stroke="#C0C0C0" stroke-width="5" stroke-linecap="round"/>
  <!-- 旗帜（三角旗） -->
  <polygon points="23,12 70,30 23,48"
    fill="#FFB833" stroke="#E69500" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 旗帜上的加速箭头 -->
  <polygon points="35,26 55,30 35,34" fill="#FFFFFF" opacity="0.9"/>
  <!-- 杆顶圆珠 -->
  <circle cx="20" cy="9" r="5" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
</svg>
