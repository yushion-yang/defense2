<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 52" width="40" height="52">
  <!-- 中式盾牌底座：带云纹边框 + 三个空槽位 -->

  <!-- 盾牌主体轮廓（上宽下收，微弧） -->
  <path d="M4 4 Q4 0 10 0 L30 0 Q36 0 36 4 L36 36 Q36 44 20 52 Q4 44 4 36 Z"
        fill="#8b4513" stroke="#5a2d0c" stroke-width="1.5"/>

  <!-- 内层面板 -->
  <path d="M7 5 Q7 2 12 2 L28 2 Q33 2 33 5 L33 34 Q33 41 20 48 Q7 41 7 34 Z"
        fill="#a0522d" stroke="#6b3410" stroke-width="0.8"/>

  <!-- 上边云纹装饰 -->
  <path d="M10 4 Q14 7 18 4 Q22 7 26 4 Q30 7 32 4"
        fill="none" stroke="#c8963e" stroke-width="0.8" opacity="0.7"/>

  <!-- 左右对称卷草纹 -->
  <path d="M8 12 Q6 18 8 24 Q6 30 8 36" fill="none" stroke="#c8963e" stroke-width="0.6" opacity="0.5"/>
  <path d="M32 12 Q34 18 32 24 Q34 30 32 36" fill="none" stroke="#c8963e" stroke-width="0.6" opacity="0.5"/>

  <!-- 下部尖端回纹 -->
  <path d="M14 40 Q17 44 20 46 Q23 44 26 40" fill="none" stroke="#c8963e" stroke-width="0.7" opacity="0.6"/>

  <!-- 槽位 1（上）-->
  <rect x="14" y="8" width="12" height="10" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <rect x="15" y="9" width="10" height="8" rx="1.5" fill="#2a1005" opacity="0.6"/>

  <!-- 槽位 2（中）-->
  <rect x="14" y="20" width="12" height="10" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <rect x="15" y="21" width="10" height="8" rx="1.5" fill="#2a1005" opacity="0.6"/>

  <!-- 槽位 3（下）-->
  <rect x="14" y="32" width="12" height="10" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <rect x="15" y="33" width="10" height="8" rx="1.5" fill="#2a1005" opacity="0.6"/>

  <!-- 四角铆钉 -->
  <circle cx="9"  cy="6"  r="1.5" fill="#c8963e" stroke="#8a6a20" stroke-width="0.4"/>
  <circle cx="31" cy="6"  r="1.5" fill="#c8963e" stroke="#8a6a20" stroke-width="0.4"/>
  <circle cx="9"  cy="36" r="1.5" fill="#c8963e" stroke="#8a6a20" stroke-width="0.4"/>
  <circle cx="31" cy="36" r="1.5" fill="#c8963e" stroke="#8a6a20" stroke-width="0.4"/>
</svg>
