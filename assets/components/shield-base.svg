<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 52" width="40" height="52">
  <!-- 中式盾牌底座：三个大槽位几乎占满盾面 -->

  <!-- 盾牌主体轮廓 -->
  <path d="M4 4 Q4 0 10 0 L30 0 Q36 0 36 4 L36 36 Q36 44 20 52 Q4 44 4 36 Z"
        fill="#8b4513" stroke="#5a2d0c" stroke-width="1.5"/>

  <!-- 内层面板 -->
  <path d="M6 4 Q6 1 11 1 L29 1 Q34 1 34 4 L34 35 Q34 42 20 50 Q6 42 6 35 Z"
        fill="#a0522d" stroke="#6b3410" stroke-width="0.8"/>

  <!-- 上边云纹 -->
  <path d="M10 2.5 Q15 5 20 2.5 Q25 5 30 2.5" fill="none" stroke="#c8963e" stroke-width="0.6" opacity="0.5"/>

  <!-- 下部回纹 -->
  <path d="M14 42 Q17 46 20 48 Q23 46 26 42" fill="none" stroke="#c8963e" stroke-width="0.5" opacity="0.4"/>

  <!-- 槽位 1（上）: 8,4 → 32,16 = 24×12 -->
  <rect x="8" y="4" width="24" height="12" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <rect x="9" y="5" width="22" height="10" rx="1.5" fill="#2a1005" opacity="0.6"/>

  <!-- 槽位 2（中）: 8,18 → 32,30 = 24×12 -->
  <rect x="8" y="18" width="24" height="12" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <rect x="9" y="19" width="22" height="10" rx="1.5" fill="#2a1005" opacity="0.6"/>

  <!-- 槽位 3（下）: 8,32 → 32,44 = 24×12 -->
  <rect x="8" y="32" width="24" height="12" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <rect x="9" y="33" width="22" height="10" rx="1.5" fill="#2a1005" opacity="0.6"/>

  <!-- 槽位间铆钉（分隔装饰） -->
  <circle cx="7"  cy="17" r="1" fill="#c8963e" stroke="#8a6a20" stroke-width="0.3"/>
  <circle cx="33" cy="17" r="1" fill="#c8963e" stroke="#8a6a20" stroke-width="0.3"/>
  <circle cx="7"  cy="31" r="1" fill="#c8963e" stroke="#8a6a20" stroke-width="0.3"/>
  <circle cx="33" cy="31" r="1" fill="#c8963e" stroke="#8a6a20" stroke-width="0.3"/>
</svg>
