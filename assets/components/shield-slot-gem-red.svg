<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 10" width="12" height="10">
  <!-- 红色宝石镶嵌件（攻击类能力） -->
  <rect x="0" y="0" width="12" height="10" rx="2" fill="#3a1a08" stroke="#6b3410" stroke-width="0.8"/>
  <!-- 宝石底光 -->
  <rect x="2" y="2" width="8" height="6" rx="1" fill="#6b1010" opacity="0.5"/>
  <!-- 宝石主体（菱形切割） -->
  <polygon points="6,1.5 10,5 6,8.5 2,5" fill="#dc2626" stroke="#8b1a1a" stroke-width="0.5"/>
  <!-- 高光 -->
  <polygon points="6,2.5 8,5 6,5 4,5" fill="#ff6666" opacity="0.4"/>
</svg>
