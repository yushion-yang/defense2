<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 52" width="40" height="52">
  <!-- 白色盾牌（无槽位）：弹幕盾能力的视觉标识，叠加在怪物精灵上 -->

  <!-- 盾牌主体轮廓 -->
  <path d="M4 4 Q4 0 10 0 L30 0 Q36 0 36 4 L36 36 Q36 44 20 52 Q4 44 4 36 Z"
        fill="#e8e4e0" stroke="#b0a898" stroke-width="1.5"/>

  <!-- 内层面板 -->
  <path d="M6 4 Q6 1 11 1 L29 1 Q34 1 34 4 L34 35 Q34 42 20 50 Q6 42 6 35 Z"
        fill="#f5f2ef" stroke="#c8c0b8" stroke-width="0.8"/>

  <!-- 金属高光（上部弧线） -->
  <path d="M10 6 Q20 2 30 6" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

  <!-- 中央纵向脊线 -->
  <line x1="20" y1="4" x2="20" y2="46" stroke="#d0c8c0" stroke-width="1.2" opacity="0.5"/>

  <!-- 横向加固条 -->
  <line x1="8" y1="18" x2="32" y2="18" stroke="#c8c0b8" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="32" x2="32" y2="32" stroke="#c8c0b8" stroke-width="0.8" opacity="0.4"/>

  <!-- 边缘金属包边 -->
  <path d="M4 4 Q4 0 10 0 L30 0 Q36 0 36 4 L36 36 Q36 44 20 52 Q4 44 4 36 Z"
        fill="none" stroke="#d8d0c8" stroke-width="0.5" opacity="0.8"/>

  <!-- 四角铆钉 -->
  <circle cx="9"  cy="6"  r="1.5" fill="#c8c0b8" stroke="#a09890" stroke-width="0.4"/>
  <circle cx="31" cy="6"  r="1.5" fill="#c8c0b8" stroke="#a09890" stroke-width="0.4"/>
  <circle cx="9"  cy="36" r="1.5" fill="#c8c0b8" stroke="#a09890" stroke-width="0.4"/>
  <circle cx="31" cy="36" r="1.5" fill="#c8c0b8" stroke="#a09890" stroke-width="0.4"/>

  <!-- 中心铆钉 -->
  <circle cx="20" cy="20" r="2" fill="#d0c8c0" stroke="#a09890" stroke-width="0.5"/>
</svg>
