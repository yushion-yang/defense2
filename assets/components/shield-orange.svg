<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 46" width="42" height="46">
  <!-- 橙色盾牌：棱角型，烈焰风格 -->

  <!-- 盾牌主体（六边形变体，上宽下尖） -->
  <polygon points="21,0 40,10 42,30 21,46 0,30 2,10"
           fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>

  <!-- 内层面板 -->
  <polygon points="21,3 37,12 39,29 21,43 3,29 5,12"
           fill="#f97316" stroke="#c2410c" stroke-width="0.8"/>

  <!-- 火焰纹路 -->
  <path d="M21,8 Q16,16 21,22 Q26,16 21,8" fill="#fbbf24" opacity="0.3"/>
  <path d="M21,22 Q14,30 21,38 Q28,30 21,22" fill="#fbbf24" opacity="0.2"/>

  <!-- 横向加固条 -->
  <line x1="7" y1="18" x2="35" y2="18" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>
  <line x1="5" y1="28" x2="37" y2="28" stroke="#fbbf24" stroke-width="0.8" opacity="0.4"/>

  <!-- 上部高光 -->
  <path d="M10 8 Q21 3 32 8" fill="none" stroke="#fed7aa" stroke-width="1" opacity="0.5"/>

  <!-- 中心火焰徽记 -->
  <path d="M21,14 L24,20 L21,18 L18,20 Z" fill="#fbbf24" stroke="#ea580c" stroke-width="0.5"/>
  <path d="M21,20 L23,25 L21,23 L19,25 Z" fill="#fde68a" stroke="#f97316" stroke-width="0.4" opacity="0.8"/>

  <!-- 六角铆钉 -->
  <circle cx="21" cy="4"  r="1.3" fill="#fbbf24" stroke="#b45309" stroke-width="0.3"/>
  <circle cx="38" cy="12" r="1.3" fill="#fbbf24" stroke="#b45309" stroke-width="0.3"/>
  <circle cx="40" cy="29" r="1.3" fill="#fbbf24" stroke="#b45309" stroke-width="0.3"/>
  <circle cx="21" cy="43" r="1.3" fill="#fbbf24" stroke="#b45309" stroke-width="0.3"/>
  <circle cx="2"  cy="29" r="1.3" fill="#fbbf24" stroke="#b45309" stroke-width="0.3"/>
  <circle cx="4"  cy="12" r="1.3" fill="#fbbf24" stroke="#b45309" stroke-width="0.3"/>
</svg>
