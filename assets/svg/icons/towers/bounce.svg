<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#1e293b"/>
  <!-- Zigzag arrow bouncing between 2 points -->
  <polyline points="14,46 26,20 38,44 50,18" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead at end -->
  <polygon points="50,12 44,22 54,20" fill="#22c55e"/>
  <!-- Bounce dots -->
  <circle cx="14" cy="46" r="3" fill="#22c55e"/>
  <circle cx="26" cy="20" r="2.5" fill="#4ade80"/>
  <circle cx="38" cy="44" r="2.5" fill="#4ade80"/>
</svg>
