  <line x1="22" y1="26" x2="18" y2="20" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="46" y2="44" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
