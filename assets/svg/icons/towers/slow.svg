  <line x1="49.3" y1="22" x2="14.7" y2="42" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <!-- Branch ticks on vertical -->
  <line x1="32" y1="18" x2="26" y2="14" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="38" y2="14" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="26" y2="50" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="38" y2="50" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
