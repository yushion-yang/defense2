  <!-- Tail feathers -->
  <line x1="12" y1="38" x2="16" y2="42" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="38" x2="10" y2="34" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>
</svg>
