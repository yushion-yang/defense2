<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#1e293b"/>
  <!-- Gear teeth (8 teeth) -->
  <g fill="#eab308">
    <rect x="29" y="10" width="6" height="8" rx="1"/>
    <rect x="29" y="46" width="6" height="8" rx="1"/>
    <rect x="10" y="29" width="8" height="6" rx="1"/>
    <rect x="46" y="29" width="8" height="6" rx="1"/>
    <rect x="14.5" y="14.5" width="6" height="8" rx="1" transform="rotate(45 17.5 18.5)"/>
    <rect x="43.5" y="14.5" width="6" height="8" rx="1" transform="rotate(-45 46.5 18.5)"/>
    <rect x="14.5" y="41.5" width="6" height="8" rx="1" transform="rotate(-45 17.5 45.5)"/>
    <rect x="43.5" y="41.5" width="6" height="8" rx="1" transform="rotate(45 46.5 45.5)"/>
  </g>
  <!-- Gear body -->
  <circle cx="32" cy="32" r="14" fill="#eab308"/>
  <circle cx="32" cy="32" r="11" fill="#ca8a04"/>
  <!-- Center hole -->
  <circle cx="32" cy="32" r="5" fill="#1e293b"/>
  <!-- Speed lines -->
  <line x1="40" y1="30" x2="52" y2="26" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="40" y1="34" x2="54" y2="34" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="38" x2="52" y2="42" stroke="#fde68a" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>
