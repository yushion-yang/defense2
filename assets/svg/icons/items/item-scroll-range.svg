<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#1e293b"/>
  <!-- Scroll body -->
  <rect x="20" y="14" width="24" height="36" rx="2" fill="#fef3c7"/>
  <!-- Top roll -->
  <ellipse cx="32" cy="14" rx="14" ry="4" fill="#f59e0b"/>
  <ellipse cx="32" cy="14" rx="14" ry="3" fill="#fde68a"/>
  <!-- Bottom roll -->
  <ellipse cx="32" cy="50" rx="14" ry="4" fill="#f59e0b"/>
  <ellipse cx="32" cy="50" rx="14" ry="3" fill="#fde68a"/>
  <!-- Range symbol (crosshair) -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="#1e40af" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="none" stroke="#1e40af" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="1" fill="#1e40af"/>
  <line x1="32" y1="22" x2="32" y2="26" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="32" y2="42" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="26" y2="32" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="42" y2="32" stroke="#1e40af" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Blue glow -->
  <circle cx="32" cy="32" r="10" fill="#3b82f6" opacity="0.12"/>
</svg>
