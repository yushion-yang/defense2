<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#1e293b"/>
  <!-- Lens body (circular glass) -->
  <circle cx="28" cy="28" r="14" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <circle cx="28" cy="28" r="14" fill="#3b82f6" opacity="0.15"/>
  <!-- Glass shine -->
  <path d="M20,22 Q24,16 32,20" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Lens frame rim -->
  <circle cx="28" cy="28" r="16" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
  <!-- Handle -->
  <line x1="39" y1="39" x2="50" y2="50" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <line x1="39" y1="39" x2="50" y2="50" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Crosshair inside lens -->
  <line x1="28" y1="20" x2="28" y2="36" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="20" y1="28" x2="36" y2="28" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <circle cx="28" cy="28" r="3" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.5"/>
</svg>
