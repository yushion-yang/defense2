<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="30" fill="#1e293b"/>
  <!-- outer portal ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fb923c" stroke-width="3" opacity="0.5"/>
  <!-- inner portal ring -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#fb923c" stroke-width="2.5"/>
  <!-- summoning rune marks at cardinal points -->
  <line x1="32" y1="12" x2="32" y2="18" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="52" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="18" y2="32" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="52" y2="32" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="3" fill="#fb923c"/>
</svg>
