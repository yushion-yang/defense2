<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#163050"/>
      <stop offset="100%" stop-color="#0c2240"/>
    </linearGradient>
    <radialGradient id="hubMetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="70%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0a3655"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1e3a5f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="residualGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Hydra: attack-2 — cooldown, arms retract, glow fades -->
  <circle cx="64" cy="70" r="48" fill="url(#ambientGlow)"/>
  <polygon points="64,40 93,54 93,82 64,96 35,82 35,54" fill="url(#basePlate)" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <polygon points="64,44 89,56 89,80 64,92 39,80 39,56" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.4"/>
  <line x1="39" y1="56" x2="52" y2="62" stroke="#3b82f6" stroke-width="0.4" opacity="0.2"/>
  <line x1="89" y1="56" x2="76" y2="62" stroke="#3b82f6" stroke-width="0.4" opacity="0.2"/>
  <line x1="64" y1="92" x2="64" y2="80" stroke="#3b82f6" stroke-width="0.4" opacity="0.2"/>
  <!-- Central hub -->
  <circle cx="64" cy="68" r="16" fill="url(#hubMetal)" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="64" cy="68" r="12" fill="none" stroke="#0c4a6e" stroke-width="0.6" opacity="0.4"/>
  <circle cx="64" cy="68" r="8" fill="#0c2240" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- Arm 1 (retracting) -->
  <line x1="56" y1="60" x2="36" y2="36" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="60" x2="36" y2="36" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="48" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <circle cx="36" cy="36" r="7" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="30" y="30" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="36" cy="36" r="3" fill="#0c4a6e"/>
  <circle cx="36" cy="36" r="2" fill="url(#residualGlow)"/>
  <circle cx="36" cy="36" r="1" fill="#3b82f6" opacity="0.4"/>
  <!-- Arm 2 (retracting) -->
  <line x1="64" y1="56" x2="64" y2="28" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="56" x2="64" y2="28" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="42" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <circle cx="64" cy="28" r="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="58" y="21" width="5" height="3" rx="1" fill="#374151"/>
  <rect x="65" y="21" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="64" cy="28" r="3.5" fill="#0c4a6e"/>
  <circle cx="64" cy="28" r="2.5" fill="url(#residualGlow)"/>
  <circle cx="64" cy="28" r="1.2" fill="#3b82f6" opacity="0.4"/>
  <!-- Arm 3 (retracting) -->
  <line x1="72" y1="60" x2="92" y2="36" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="92" y2="36" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="82" cy="48" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <circle cx="92" cy="36" r="7" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <rect x="93" y="30" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="92" cy="36" r="3" fill="#0c4a6e"/>
  <circle cx="92" cy="36" r="2" fill="url(#residualGlow)"/>
  <circle cx="92" cy="36" r="1" fill="#3b82f6" opacity="0.4"/>
  <!-- LEDs dim -->
  <circle cx="32" cy="33" r="1" fill="#ef4444" opacity="0.3"/>
  <circle cx="60" cy="24" r="1" fill="#ef4444" opacity="0.3"/>
  <circle cx="96" cy="33" r="1" fill="#ef4444" opacity="0.3"/>
  <!-- Core fading -->
  <circle cx="64" cy="68" r="10" fill="url(#coreGlow)"/>
  <circle cx="64" cy="68" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="64" cy="68" r="2" fill="#bfdbfe" opacity="0.5"/>
</svg>
