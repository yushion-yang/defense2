<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#163050"/>
      <stop offset="100%" stop-color="#0c2240"/>
    </linearGradient>
    <radialGradient id="hubMetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="70%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0a3655"/>
    </radialGradient>
    <linearGradient id="armMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1e3a5f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Hydra: idle-0 — steady scan, LEDs on -->
  <circle cx="64" cy="70" r="50" fill="url(#ambientGlow)"/>
  <!-- Hexagonal base platform -->
  <polygon points="64,40 93,54 93,82 64,96 35,82 35,54" fill="url(#basePlate)" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <polygon points="64,44 89,56 89,80 64,92 39,80 39,56" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.5"/>
  <!-- Circuit traces -->
  <line x1="39" y1="56" x2="52" y2="62" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  <line x1="89" y1="56" x2="76" y2="62" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  <line x1="64" y1="92" x2="64" y2="80" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  <!-- Central hub body -->
  <circle cx="64" cy="68" r="16" fill="url(#hubMetal)" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="64" cy="68" r="12" fill="none" stroke="#0c4a6e" stroke-width="0.6" opacity="0.5"/>
  <!-- Hub detail rings -->
  <circle cx="64" cy="68" r="8" fill="#0c2240" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- Articulated arm 1 (top-left) -->
  <line x1="56" y1="60" x2="34" y2="34" stroke="url(#armMetal)" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="60" x2="34" y2="34" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="45" cy="47" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <!-- Turret head 1 -->
  <circle cx="34" cy="34" r="7" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <rect x="28" y="28" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="34" cy="34" r="3" fill="#0c4a6e"/>
  <circle cx="34" cy="34" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <!-- Articulated arm 2 (top-center) -->
  <line x1="64" y1="56" x2="64" y2="26" stroke="url(#armMetal)" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="56" x2="64" y2="26" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="41" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <!-- Turret head 2 -->
  <circle cx="64" cy="26" r="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <rect x="58" y="19" width="5" height="3" rx="1" fill="#374151"/>
  <rect x="65" y="19" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="64" cy="26" r="3.5" fill="#0c4a6e"/>
  <circle cx="64" cy="26" r="2" fill="#3b82f6" opacity="0.7"/>
  <!-- Articulated arm 3 (top-right) -->
  <line x1="72" y1="60" x2="94" y2="34" stroke="url(#armMetal)" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="94" y2="34" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="83" cy="47" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <!-- Turret head 3 -->
  <circle cx="94" cy="34" r="7" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <rect x="95" y="28" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="94" cy="34" r="3" fill="#0c4a6e"/>
  <circle cx="94" cy="34" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <!-- Targeting LEDs on each head (steady) -->
  <circle cx="30" cy="31" r="1" fill="#ef4444" opacity="0.7"/>
  <circle cx="60" cy="22" r="1" fill="#ef4444" opacity="0.7"/>
  <circle cx="98" cy="31" r="1" fill="#ef4444" opacity="0.7"/>
  <!-- Central core glow -->
  <circle cx="64" cy="68" r="12" fill="url(#coreGlow)"/>
  <circle cx="64" cy="68" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="64" cy="68" r="2.5" fill="#bfdbfe" opacity="0.8"/>
</svg>
