<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#163050"/>
      <stop offset="100%" stop-color="#0c2240"/>
    </linearGradient>
    <radialGradient id="hubMetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="70%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0a3655"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Hydra: attack-0 — target lock, all LEDs red, charge -->
  <circle cx="64" cy="70" r="54" fill="url(#ambientGlow)"/>
  <polygon points="64,40 93,54 93,82 64,96 35,82 35,54" fill="url(#basePlate)" stroke="#ef4444" stroke-width="1.2"/>
  <polygon points="64,44 89,56 89,80 64,92 39,80 39,56" fill="none" stroke="#1e3a5f" stroke-width="0.7" opacity="0.6"/>
  <line x1="39" y1="56" x2="52" y2="62" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
  <line x1="89" y1="56" x2="76" y2="62" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
  <line x1="64" y1="92" x2="64" y2="80" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
  <!-- Central hub -->
  <circle cx="64" cy="68" r="16" fill="url(#hubMetal)" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="64" cy="68" r="12" fill="none" stroke="#0c4a6e" stroke-width="0.6" opacity="0.5"/>
  <circle cx="64" cy="68" r="8" fill="#0c2240" stroke="#ef4444" stroke-width="0.5" opacity="0.6"/>
  <!-- Arm 1 — slightly raised for target tracking -->
  <line x1="56" y1="60" x2="32" y2="32" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="60" x2="32" y2="32" stroke="#6b7280" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44" cy="46" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="7" fill="#1f2937" stroke="#ef4444" stroke-width="1"/>
  <rect x="26" y="26" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="32" cy="32" r="4" fill="url(#lockGlow)"/>
  <circle cx="32" cy="32" r="3" fill="#0c4a6e"/>
  <circle cx="32" cy="32" r="1.5" fill="#ef4444" opacity="0.9"/>
  <!-- Arm 2 -->
  <line x1="64" y1="56" x2="64" y2="24" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="56" x2="64" y2="24" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="40" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <circle cx="64" cy="24" r="8" fill="#1f2937" stroke="#ef4444" stroke-width="1"/>
  <rect x="58" y="17" width="5" height="3" rx="1" fill="#374151"/>
  <rect x="65" y="17" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="64" cy="24" r="5" fill="url(#lockGlow)"/>
  <circle cx="64" cy="24" r="3.5" fill="#0c4a6e"/>
  <circle cx="64" cy="24" r="2" fill="#ef4444" opacity="0.9"/>
  <!-- Arm 3 -->
  <line x1="72" y1="60" x2="96" y2="32" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="96" y2="32" stroke="#6b7280" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="84" cy="46" r="2" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
  <circle cx="96" cy="32" r="7" fill="#1f2937" stroke="#ef4444" stroke-width="1"/>
  <rect x="97" y="26" width="5" height="3" rx="1" fill="#374151"/>
  <circle cx="96" cy="32" r="4" fill="url(#lockGlow)"/>
  <circle cx="96" cy="32" r="3" fill="#0c4a6e"/>
  <circle cx="96" cy="32" r="1.5" fill="#ef4444" opacity="0.9"/>
  <!-- All targeting LEDs bright red -->
  <circle cx="28" cy="29" r="1.5" fill="#ef4444" opacity="1"/>
  <circle cx="59" cy="20" r="1.5" fill="#ef4444" opacity="1"/>
  <circle cx="100" cy="29" r="1.5" fill="#ef4444" opacity="1"/>
  <!-- Core energizing -->
  <circle cx="64" cy="68" r="14" fill="url(#coreGlow)"/>
  <circle cx="64" cy="68" r="7" fill="#3b82f6" opacity="0.8"/>
  <circle cx="64" cy="68" r="3.5" fill="#bfdbfe" opacity="1"/>
</svg>
