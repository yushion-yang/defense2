<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#163050"/>
      <stop offset="100%" stop-color="#0c2240"/>
    </linearGradient>
    <radialGradient id="hubMetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="70%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0a3655"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="1"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleFlash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="1"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Hydra: attack-1 — ALL HEADS FIRING! Blue energy beams -->
  <circle cx="64" cy="68" r="58" fill="url(#ambientGlow)"/>
  <polygon points="64,40 93,54 93,82 64,96 35,82 35,54" fill="url(#basePlate)" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="64,44 89,56 89,80 64,92 39,80 39,56" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.4"/>
  <line x1="39" y1="56" x2="52" y2="62" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <line x1="89" y1="56" x2="76" y2="62" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <line x1="64" y1="92" x2="64" y2="80" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <!-- Central hub -->
  <circle cx="64" cy="68" r="16" fill="url(#hubMetal)" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="64" cy="68" r="12" fill="none" stroke="#3b82f6" stroke-width="0.6" opacity="0.4"/>
  <circle cx="64" cy="68" r="8" fill="#0c2240" stroke="#3b82f6" stroke-width="0.8"/>
  <!-- Arm 1 firing -->
  <line x1="56" y1="60" x2="30" y2="30" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="60" x2="30" y2="30" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="43" cy="45" r="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <circle cx="30" cy="30" r="7" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Muzzle flash head 1 -->
  <circle cx="24" cy="24" r="8" fill="url(#muzzleFlash)"/>
  <line x1="30" y1="30" x2="18" y2="18" stroke="#bfdbfe" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="22" y2="26" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <circle cx="30" cy="30" r="3" fill="#3b82f6" opacity="1"/>
  <circle cx="30" cy="30" r="1.5" fill="#bfdbfe" opacity="1"/>
  <!-- Arm 2 firing -->
  <line x1="64" y1="56" x2="64" y2="22" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="56" x2="64" y2="22" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="39" r="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <circle cx="64" cy="22" r="8" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Muzzle flash head 2 -->
  <circle cx="64" cy="14" r="10" fill="url(#muzzleFlash)"/>
  <line x1="64" y1="22" x2="64" y2="6" stroke="#bfdbfe" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="64" y1="22" x2="58" y2="14" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="64" y1="22" x2="70" y2="14" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <circle cx="64" cy="22" r="3.5" fill="#3b82f6" opacity="1"/>
  <circle cx="64" cy="22" r="2" fill="#bfdbfe" opacity="1"/>
  <!-- Arm 3 firing -->
  <line x1="72" y1="60" x2="98" y2="30" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="98" y2="30" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="85" cy="45" r="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <circle cx="98" cy="30" r="7" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Muzzle flash head 3 -->
  <circle cx="104" cy="24" r="8" fill="url(#muzzleFlash)"/>
  <line x1="98" y1="30" x2="110" y2="18" stroke="#bfdbfe" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <line x1="98" y1="30" x2="106" y2="26" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <circle cx="98" cy="30" r="3" fill="#3b82f6" opacity="1"/>
  <circle cx="98" cy="30" r="1.5" fill="#bfdbfe" opacity="1"/>
  <!-- All targeting LEDs white-hot -->
  <circle cx="26" cy="27" r="1.5" fill="#fef3c7" opacity="1"/>
  <circle cx="59" cy="18" r="1.5" fill="#fef3c7" opacity="1"/>
  <circle cx="102" cy="27" r="1.5" fill="#fef3c7" opacity="1"/>
  <!-- Core maximum output -->
  <circle cx="64" cy="68" r="18" fill="url(#coreGlow)"/>
  <circle cx="64" cy="68" r="8" fill="#3b82f6" opacity="1"/>
  <circle cx="64" cy="68" r="4" fill="#bfdbfe" opacity="1"/>
</svg>
