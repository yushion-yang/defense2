<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#4a1572"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </linearGradient>
    <radialGradient id="domeMetal" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#faf5ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="novaRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nova: attack-1 — NOVA BURST! Expanding energy ring, max brightness -->
  <!-- Massive ambient glow -->
  <circle cx="64" cy="68" r="62" fill="url(#ambientGlow)"/>
  <!-- Octagonal base (illuminated) -->
  <polygon points="64,38 86,44 96,62 96,82 86,96 64,100 42,96 32,82 32,62 42,44" fill="url(#basePlate)" stroke="#faf5ff" stroke-width="1.5"/>
  <polygon points="64,42 83,47 92,63 92,80 83,93 64,97 45,93 36,80 36,63 45,47" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.5"/>
  <!-- 8 radial channels BLAZING -->
  <line x1="64" y1="68" x2="64" y2="28" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="92" y2="40" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="104" y2="68" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="92" y2="96" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="64" y2="108" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="36" y2="96" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="24" y2="68" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <line x1="64" y1="68" x2="36" y2="40" stroke="#faf5ff" stroke-width="3" opacity="0.8"/>
  <!-- Outer channel glow lines -->
  <line x1="64" y1="68" x2="64" y2="28" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="92" y2="40" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="104" y2="68" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="92" y2="96" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="64" y2="108" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="36" y2="96" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="24" y2="68" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <line x1="64" y1="68" x2="36" y2="40" stroke="#c084fc" stroke-width="5" opacity="0.3"/>
  <!-- Channel end flares -->
  <circle cx="64" cy="28" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="92" cy="40" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="104" cy="68" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="92" cy="96" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="64" cy="108" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="36" cy="96" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="24" cy="68" r="4" fill="#faf5ff" opacity="0.8"/>
  <circle cx="36" cy="40" r="4" fill="#faf5ff" opacity="0.8"/>
  <!-- Expanding energy ring (the nova burst) -->
  <circle cx="64" cy="68" r="38" fill="url(#novaRing)"/>
  <circle cx="64" cy="68" r="36" fill="none" stroke="#faf5ff" stroke-width="2" opacity="0.6"/>
  <circle cx="64" cy="68" r="30" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>
  <!-- Dome -->
  <circle cx="64" cy="64" r="18" fill="url(#domeMetal)" stroke="#faf5ff" stroke-width="2"/>
  <circle cx="64" cy="64" r="14" fill="none" stroke="#c084fc" stroke-width="0.6" opacity="0.4"/>
  <circle cx="64" cy="64" r="10" fill="#3b0e5e" stroke="#faf5ff" stroke-width="1"/>
  <!-- Core nova blast (max) -->
  <circle cx="64" cy="64" r="16" fill="url(#coreGlow)"/>
  <circle cx="64" cy="64" r="9" fill="#c084fc" opacity="1"/>
  <circle cx="64" cy="64" r="5" fill="#faf5ff" opacity="1"/>
  <circle cx="64" cy="64" r="2.5" fill="#ffffff" opacity="1"/>
</svg>
