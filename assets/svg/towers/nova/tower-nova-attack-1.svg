<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#4a1572"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </linearGradient>
    <linearGradient id="barrelMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <radialGradient id="drumGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleFlash" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="drumPeak" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nova: attack-1 — FIRING! All 6 barrels flash, projectile muzzle flares -->
  <!-- Massive ambient glow -->
  <circle cx="64" cy="72" r="60" fill="url(#ambientGlow)"/>
  <!-- Hexagonal base platform (illuminated) -->
  <polygon points="64,38 95,53 95,83 64,98 33,83 33,53" fill="url(#basePlate)" stroke="#faf5ff" stroke-width="1.5"/>
  <polygon points="64,42 91,55 91,81 64,94 37,81 37,55" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.5"/>
  <!-- Base circuit lines (max energy) -->
  <line x1="37" y1="55" x2="50" y2="63" stroke="#c084fc" stroke-width="0.8" opacity="0.7"/>
  <line x1="91" y1="55" x2="78" y2="63" stroke="#c084fc" stroke-width="0.8" opacity="0.7"/>
  <line x1="64" y1="94" x2="64" y2="82" stroke="#c084fc" stroke-width="0.8" opacity="0.7"/>
  <!-- Turret ring (max brightness) -->
  <circle cx="64" cy="66" r="26" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <circle cx="64" cy="66" r="24" fill="none" stroke="#faf5ff" stroke-width="0.8" opacity="0.4"/>
  <circle cx="64" cy="66" r="28" fill="none" stroke="#c084fc" stroke-width="0.7" opacity="0.4"/>
  <!-- All 6 barrels — slightly retracted (recoil: barrel shorter, shifted +1 toward center) -->
  <!-- Barrel 1 (0 deg) — FIRING -->
  <g transform="rotate(0, 64, 66)">
    <!-- Barrel body (retracted: y+1, height-1) -->
    <rect x="61" y="38" width="6" height="15" rx="1.5" fill="url(#barrelMetal)" stroke="#faf5ff" stroke-width="0.7"/>
    <rect x="62.5" y="38" width="3" height="4" rx="1" fill="#4a1572" opacity="0.6"/>
    <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#3b0e5e" stroke="#faf5ff" stroke-width="0.5"/>
    <!-- Coil at MAX -->
    <rect x="59.5" y="46" width="9" height="3" rx="1" fill="#faf5ff" opacity="0.8"/>
    <!-- MUZZLE FLASH — projectile-shaped (elongated outward) -->
    <ellipse cx="64" cy="32" rx="3.5" ry="6" fill="url(#muzzleFlash)"/>
    <ellipse cx="64" cy="30" rx="2" ry="4" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="28" rx="1" ry="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Barrel 2 (60 deg) — FIRING -->
  <g transform="rotate(60, 64, 66)">
    <rect x="61" y="38" width="6" height="15" rx="1.5" fill="url(#barrelMetal)" stroke="#faf5ff" stroke-width="0.7"/>
    <rect x="62.5" y="38" width="3" height="4" rx="1" fill="#4a1572" opacity="0.6"/>
    <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#3b0e5e" stroke="#faf5ff" stroke-width="0.5"/>
    <rect x="59.5" y="46" width="9" height="3" rx="1" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="32" rx="3.5" ry="6" fill="url(#muzzleFlash)"/>
    <ellipse cx="64" cy="30" rx="2" ry="4" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="28" rx="1" ry="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Barrel 3 (120 deg) — FIRING -->
  <g transform="rotate(120, 64, 66)">
    <rect x="61" y="38" width="6" height="15" rx="1.5" fill="url(#barrelMetal)" stroke="#faf5ff" stroke-width="0.7"/>
    <rect x="62.5" y="38" width="3" height="4" rx="1" fill="#4a1572" opacity="0.6"/>
    <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#3b0e5e" stroke="#faf5ff" stroke-width="0.5"/>
    <rect x="59.5" y="46" width="9" height="3" rx="1" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="32" rx="3.5" ry="6" fill="url(#muzzleFlash)"/>
    <ellipse cx="64" cy="30" rx="2" ry="4" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="28" rx="1" ry="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Barrel 4 (180 deg) — FIRING -->
  <g transform="rotate(180, 64, 66)">
    <rect x="61" y="38" width="6" height="15" rx="1.5" fill="url(#barrelMetal)" stroke="#faf5ff" stroke-width="0.7"/>
    <rect x="62.5" y="38" width="3" height="4" rx="1" fill="#4a1572" opacity="0.6"/>
    <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#3b0e5e" stroke="#faf5ff" stroke-width="0.5"/>
    <rect x="59.5" y="46" width="9" height="3" rx="1" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="32" rx="3.5" ry="6" fill="url(#muzzleFlash)"/>
    <ellipse cx="64" cy="30" rx="2" ry="4" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="28" rx="1" ry="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Barrel 5 (240 deg) — FIRING -->
  <g transform="rotate(240, 64, 66)">
    <rect x="61" y="38" width="6" height="15" rx="1.5" fill="url(#barrelMetal)" stroke="#faf5ff" stroke-width="0.7"/>
    <rect x="62.5" y="38" width="3" height="4" rx="1" fill="#4a1572" opacity="0.6"/>
    <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#3b0e5e" stroke="#faf5ff" stroke-width="0.5"/>
    <rect x="59.5" y="46" width="9" height="3" rx="1" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="32" rx="3.5" ry="6" fill="url(#muzzleFlash)"/>
    <ellipse cx="64" cy="30" rx="2" ry="4" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="28" rx="1" ry="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Barrel 6 (300 deg) — FIRING -->
  <g transform="rotate(300, 64, 66)">
    <rect x="61" y="38" width="6" height="15" rx="1.5" fill="url(#barrelMetal)" stroke="#faf5ff" stroke-width="0.7"/>
    <rect x="62.5" y="38" width="3" height="4" rx="1" fill="#4a1572" opacity="0.6"/>
    <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#3b0e5e" stroke="#faf5ff" stroke-width="0.5"/>
    <rect x="59.5" y="46" width="9" height="3" rx="1" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="32" rx="3.5" ry="6" fill="url(#muzzleFlash)"/>
    <ellipse cx="64" cy="30" rx="2" ry="4" fill="#faf5ff" opacity="0.8"/>
    <ellipse cx="64" cy="28" rx="1" ry="2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Targeting sensor LEDs (all MAX) -->
  <circle cx="64" cy="41" r="1.8" fill="#faf5ff" opacity="1"/>
  <circle cx="85" cy="54" r="1.8" fill="#faf5ff" opacity="1"/>
  <circle cx="85" cy="78" r="1.8" fill="#faf5ff" opacity="1"/>
  <circle cx="64" cy="91" r="1.8" fill="#faf5ff" opacity="1"/>
  <circle cx="43" cy="78" r="1.8" fill="#faf5ff" opacity="1"/>
  <circle cx="43" cy="54" r="1.8" fill="#faf5ff" opacity="1"/>
  <!-- Central ammo drum (peak rotation) -->
  <circle cx="64" cy="66" r="15" fill="url(#drumPeak)"/>
  <circle cx="64" cy="66" r="12" fill="url(#drumGrad)" stroke="#faf5ff" stroke-width="1.5"/>
  <circle cx="64" cy="66" r="9" fill="none" stroke="#faf5ff" stroke-width="0.5" opacity="0.4"/>
  <!-- Rapid spin arcs -->
  <path d="M 64 54 A 12 12 0 0 1 74 60" fill="none" stroke="#faf5ff" stroke-width="1.2" opacity="0.6"/>
  <path d="M 74 72 A 12 12 0 0 1 64 78" fill="none" stroke="#faf5ff" stroke-width="1.2" opacity="0.6"/>
  <path d="M 54 60 A 12 12 0 0 1 64 54" fill="none" stroke="#faf5ff" stroke-width="1.2" opacity="0.6"/>
  <!-- Drum center (peak) -->
  <circle cx="64" cy="66" r="4" fill="#3b0e5e" stroke="#faf5ff" stroke-width="1"/>
  <circle cx="64" cy="66" r="2.5" fill="#faf5ff" opacity="0.9"/>
  <circle cx="64" cy="66" r="1" fill="#ffffff" opacity="1"/>
</svg>
