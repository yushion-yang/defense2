<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#4a1572"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </linearGradient>
    <linearGradient id="barrelMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <radialGradient id="drumGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleCharge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="drumSpin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nova: attack-0 — pre-fire, coils glow, drum spinning, muzzle energy -->
  <!-- Ambient glow (intensifying) -->
  <circle cx="64" cy="72" r="52" fill="url(#ambientGlow)"/>
  <!-- Hexagonal base platform -->
  <polygon points="64,38 95,53 95,83 64,98 33,83 33,53" fill="url(#basePlate)" stroke="#c084fc" stroke-width="1.5"/>
  <polygon points="64,42 91,55 91,81 64,94 37,81 37,55" fill="none" stroke="#7c3aed" stroke-width="0.7" opacity="0.6"/>
  <!-- Base circuit lines (energized) -->
  <line x1="37" y1="55" x2="50" y2="63" stroke="#c084fc" stroke-width="0.6" opacity="0.5"/>
  <line x1="91" y1="55" x2="78" y2="63" stroke="#c084fc" stroke-width="0.6" opacity="0.5"/>
  <line x1="64" y1="94" x2="64" y2="82" stroke="#c084fc" stroke-width="0.6" opacity="0.5"/>
  <!-- Turret ring (energized) -->
  <circle cx="64" cy="66" r="26" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <circle cx="64" cy="66" r="24" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
  <circle cx="64" cy="66" r="28" fill="none" stroke="#c084fc" stroke-width="0.7" opacity="0.3"/>
  <!-- All 6 barrels with glowing coils and muzzle charge -->
  <!-- Barrel 1 (0 deg) -->
  <g transform="rotate(0, 64, 66)">
    <rect x="61" y="37" width="6" height="16" rx="1.5" fill="url(#barrelMetal)" stroke="#c084fc" stroke-width="0.7"/>
    <rect x="62.5" y="37" width="3" height="4" rx="1" fill="#4a1572" opacity="0.7"/>
    <ellipse cx="64" cy="37" rx="3" ry="1.5" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.5"/>
    <!-- Accelerator coil GLOWING -->
    <rect x="59.5" y="45" width="9" height="3" rx="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="64" cy="46.5" r="5" fill="url(#coilGlow)"/>
    <!-- Muzzle energy building -->
    <circle cx="64" cy="35" r="3" fill="url(#muzzleCharge)"/>
    <circle cx="64" cy="35" r="1.5" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Barrel 2 (60 deg) -->
  <g transform="rotate(60, 64, 66)">
    <rect x="61" y="37" width="6" height="16" rx="1.5" fill="url(#barrelMetal)" stroke="#c084fc" stroke-width="0.7"/>
    <rect x="62.5" y="37" width="3" height="4" rx="1" fill="#4a1572" opacity="0.7"/>
    <ellipse cx="64" cy="37" rx="3" ry="1.5" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="59.5" y="45" width="9" height="3" rx="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="64" cy="46.5" r="5" fill="url(#coilGlow)"/>
    <circle cx="64" cy="35" r="3" fill="url(#muzzleCharge)"/>
    <circle cx="64" cy="35" r="1.5" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Barrel 3 (120 deg) -->
  <g transform="rotate(120, 64, 66)">
    <rect x="61" y="37" width="6" height="16" rx="1.5" fill="url(#barrelMetal)" stroke="#c084fc" stroke-width="0.7"/>
    <rect x="62.5" y="37" width="3" height="4" rx="1" fill="#4a1572" opacity="0.7"/>
    <ellipse cx="64" cy="37" rx="3" ry="1.5" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="59.5" y="45" width="9" height="3" rx="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="64" cy="46.5" r="5" fill="url(#coilGlow)"/>
    <circle cx="64" cy="35" r="3" fill="url(#muzzleCharge)"/>
    <circle cx="64" cy="35" r="1.5" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Barrel 4 (180 deg) -->
  <g transform="rotate(180, 64, 66)">
    <rect x="61" y="37" width="6" height="16" rx="1.5" fill="url(#barrelMetal)" stroke="#c084fc" stroke-width="0.7"/>
    <rect x="62.5" y="37" width="3" height="4" rx="1" fill="#4a1572" opacity="0.7"/>
    <ellipse cx="64" cy="37" rx="3" ry="1.5" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="59.5" y="45" width="9" height="3" rx="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="64" cy="46.5" r="5" fill="url(#coilGlow)"/>
    <circle cx="64" cy="35" r="3" fill="url(#muzzleCharge)"/>
    <circle cx="64" cy="35" r="1.5" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Barrel 5 (240 deg) -->
  <g transform="rotate(240, 64, 66)">
    <rect x="61" y="37" width="6" height="16" rx="1.5" fill="url(#barrelMetal)" stroke="#c084fc" stroke-width="0.7"/>
    <rect x="62.5" y="37" width="3" height="4" rx="1" fill="#4a1572" opacity="0.7"/>
    <ellipse cx="64" cy="37" rx="3" ry="1.5" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="59.5" y="45" width="9" height="3" rx="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="64" cy="46.5" r="5" fill="url(#coilGlow)"/>
    <circle cx="64" cy="35" r="3" fill="url(#muzzleCharge)"/>
    <circle cx="64" cy="35" r="1.5" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Barrel 6 (300 deg) -->
  <g transform="rotate(300, 64, 66)">
    <rect x="61" y="37" width="6" height="16" rx="1.5" fill="url(#barrelMetal)" stroke="#c084fc" stroke-width="0.7"/>
    <rect x="62.5" y="37" width="3" height="4" rx="1" fill="#4a1572" opacity="0.7"/>
    <ellipse cx="64" cy="37" rx="3" ry="1.5" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.5"/>
    <rect x="59.5" y="45" width="9" height="3" rx="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="64" cy="46.5" r="5" fill="url(#coilGlow)"/>
    <circle cx="64" cy="35" r="3" fill="url(#muzzleCharge)"/>
    <circle cx="64" cy="35" r="1.5" fill="#c084fc" opacity="0.6"/>
  </g>
  <!-- Targeting sensor LEDs (all locked on, bright) -->
  <circle cx="64" cy="41" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="85" cy="54" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="85" cy="78" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="64" cy="91" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="43" cy="78" r="1.5" fill="#a855f7" opacity="0.9"/>
  <circle cx="43" cy="54" r="1.5" fill="#a855f7" opacity="0.9"/>
  <!-- Central ammo drum (spinning — blur ring) -->
  <circle cx="64" cy="66" r="14" fill="url(#drumSpin)"/>
  <circle cx="64" cy="66" r="12" fill="url(#drumGrad)" stroke="#c084fc" stroke-width="1.2"/>
  <circle cx="64" cy="66" r="9" fill="none" stroke="#c084fc" stroke-width="0.6" opacity="0.5"/>
  <!-- Spinning indicator arcs -->
  <path d="M 64 54 A 12 12 0 0 1 74 60" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
  <path d="M 64 78 A 12 12 0 0 1 54 72" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
  <!-- Drum center (energized) -->
  <circle cx="64" cy="66" r="4" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.8"/>
  <circle cx="64" cy="66" r="2.5" fill="#c084fc" opacity="0.8"/>
  <circle cx="64" cy="66" r="1" fill="#faf5ff" opacity="0.7"/>
</svg>
