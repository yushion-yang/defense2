<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#4a1572"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </linearGradient>
    <radialGradient id="domeMetal" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chargeField" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nova: attack-0 — energy charging, channels brighten, core intensifies -->
  <circle cx="64" cy="68" r="56" fill="url(#ambientGlow)"/>
  <!-- Octagonal base -->
  <polygon points="64,38 86,44 96,62 96,82 86,96 64,100 42,96 32,82 32,62 42,44" fill="url(#basePlate)" stroke="#c084fc" stroke-width="1.2"/>
  <polygon points="64,42 83,47 92,63 92,80 83,93 64,97 45,93 36,80 36,63 45,47" fill="none" stroke="#7c3aed" stroke-width="0.7" opacity="0.6"/>
  <!-- 8 radial channels (energizing, bright) -->
  <line x1="64" y1="68" x2="64" y2="38" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="86" y2="46" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="96" y2="68" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="86" y2="90" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="64" y2="100" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="42" y2="90" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="32" y2="68" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="68" x2="42" y2="46" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <!-- Channel end nodes (charging, growing) -->
  <circle cx="64" cy="38" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="86" cy="46" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="96" cy="68" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="86" cy="90" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="64" cy="100" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="42" cy="90" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="32" cy="68" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="42" cy="46" r="3" fill="#c084fc" opacity="0.7"/>
  <!-- Charge field around dome -->
  <circle cx="64" cy="64" r="24" fill="url(#chargeField)"/>
  <!-- Dome -->
  <circle cx="64" cy="64" r="18" fill="url(#domeMetal)" stroke="#c084fc" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="14" fill="none" stroke="#c084fc" stroke-width="0.6" opacity="0.4"/>
  <ellipse cx="60" cy="58" rx="6" ry="4" fill="#c084fc" opacity="0.15"/>
  <circle cx="64" cy="64" r="10" fill="#3b0e5e" stroke="#c084fc" stroke-width="0.8"/>
  <!-- Core charging -->
  <circle cx="64" cy="64" r="12" fill="url(#coreGlow)"/>
  <circle cx="64" cy="64" r="7" fill="#c084fc" opacity="0.8"/>
  <circle cx="64" cy="64" r="4" fill="#faf5ff" opacity="0.9"/>
  <circle cx="64" cy="64" r="2" fill="#ffffff" opacity="1"/>
</svg>
