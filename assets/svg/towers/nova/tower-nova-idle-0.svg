<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#4a1572"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </linearGradient>
    <radialGradient id="domeMetal" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0e5e"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="singularity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nova: idle-0 — singularity core steady, channels dim -->
  <circle cx="64" cy="68" r="52" fill="url(#ambientGlow)"/>
  <!-- Octagonal base platform -->
  <polygon points="64,38 86,44 96,62 96,82 86,96 64,100 42,96 32,82 32,62 42,44" fill="url(#basePlate)" stroke="#7c3aed" stroke-width="1"/>
  <polygon points="64,42 83,47 92,63 92,80 83,93 64,97 45,93 36,80 36,63 45,47" fill="none" stroke="#581c87" stroke-width="0.6" opacity="0.5"/>
  <!-- 8 radial energy channels (from center outward) -->
  <line x1="64" y1="68" x2="64" y2="40" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="84" y2="48" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="94" y2="68" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="84" y2="88" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="64" y2="98" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="44" y2="88" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="34" y2="68" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <line x1="64" y1="68" x2="44" y2="48" stroke="#c084fc" stroke-width="1.5" opacity="0.3"/>
  <!-- Channel end nodes -->
  <circle cx="64" cy="40" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="84" cy="48" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="94" cy="68" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="84" cy="88" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="64" cy="98" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="44" cy="88" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="34" cy="68" r="2" fill="#c084fc" opacity="0.4"/>
  <circle cx="44" cy="48" r="2" fill="#c084fc" opacity="0.4"/>
  <!-- Dome/sphere emitter -->
  <circle cx="64" cy="64" r="18" fill="url(#domeMetal)" stroke="#7c3aed" stroke-width="1"/>
  <circle cx="64" cy="64" r="14" fill="none" stroke="#581c87" stroke-width="0.6" opacity="0.6"/>
  <!-- Dome highlight -->
  <ellipse cx="60" cy="58" rx="6" ry="4" fill="#c084fc" opacity="0.1"/>
  <!-- Inner ring -->
  <circle cx="64" cy="64" r="10" fill="#3b0e5e" stroke="#7c3aed" stroke-width="0.5"/>
  <!-- Singularity core -->
  <circle cx="64" cy="64" r="8" fill="url(#coreGlow)"/>
  <circle cx="64" cy="64" r="5" fill="url(#singularity)"/>
  <circle cx="64" cy="64" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="64" cy="64" r="1.5" fill="#faf5ff" opacity="0.85"/>
</svg>
