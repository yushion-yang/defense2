<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="baseFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="coreCharge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleCharge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sentinel: attack-0 — pre-fire charge, energy buildup -->
  <!-- Shadow -->
  <ellipse cx="64" cy="96" rx="36" ry="10" fill="#0f172a" opacity="0.35"/>
  <!-- Hex base platform -->
  <polygon points="64,34 96,51 96,85 64,102 32,85 32,51" fill="url(#baseFill)" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Circuit traces (all bright during charge) -->
  <line x1="64" y1="34" x2="64" y2="50" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="51" x2="48" y2="59" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <line x1="96" y1="51" x2="80" y2="59" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="85" x2="48" y2="73" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
  <line x1="96" y1="85" x2="80" y2="73" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
  <!-- Energy flow lines toward barrel -->
  <line x1="48" y1="59" x2="60" y2="50" stroke="#22d3ee" stroke-width="0.6" opacity="0.5"/>
  <line x1="80" y1="59" x2="68" y2="50" stroke="#22d3ee" stroke-width="0.6" opacity="0.5"/>
  <!-- Inner hex ring (charged) -->
  <polygon points="64,46 80,55 80,73 64,82 48,73 48,55" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
  <!-- Turret housing -->
  <circle cx="64" cy="64" r="16" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8" opacity="0.6"/>
  <!-- Barrel -->
  <rect x="60" y="22" width="8" height="34" rx="2" fill="url(#barrelGrad)" stroke="#64748b" stroke-width="0.5"/>
  <rect x="62" y="24" width="3" height="30" rx="1" fill="#94a3b8" opacity="0.15"/>
  <!-- Muzzle tip (charging glow) -->
  <rect x="59" y="20" width="10" height="5" rx="1.5" fill="#64748b" stroke="#22d3ee" stroke-width="0.8"/>
  <!-- Muzzle charge glow -->
  <circle cx="64" cy="20" r="6" fill="url(#muzzleCharge)" opacity="0.6"/>
  <!-- Energy core (intense charge) -->
  <circle cx="64" cy="64" r="12" fill="url(#coreCharge)" opacity="0.85"/>
  <circle cx="64" cy="64" r="6" fill="#0ea5e9" opacity="0.95"/>
  <circle cx="64" cy="64" r="3" fill="#e0f2fe"/>
  <!-- All LEDs bright -->
  <circle cx="48" cy="55" r="1.8" fill="#22d3ee" opacity="0.95"/>
  <circle cx="80" cy="55" r="1.8" fill="#22d3ee" opacity="0.95"/>
  <circle cx="48" cy="73" r="1.8" fill="#22d3ee" opacity="0.95"/>
  <circle cx="80" cy="73" r="1.8" fill="#22d3ee" opacity="0.95"/>
  <!-- Targeting sensor (locked) -->
  <circle cx="64" cy="22" r="3" fill="#22d3ee" stroke="#e0f2fe" stroke-width="0.6"/>
  <circle cx="64" cy="22" r="1.5" fill="#e0f2fe"/>
</svg>
