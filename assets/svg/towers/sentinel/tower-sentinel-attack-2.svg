<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="baseFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="coreFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="residualGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sentinel: attack-2 — post-fire cooldown, fading glow -->
  <!-- Shadow -->
  <ellipse cx="64" cy="96" rx="36" ry="10" fill="#0f172a" opacity="0.35"/>
  <!-- Hex base platform -->
  <polygon points="64,34 96,51 96,85 64,102 32,85 32,51" fill="url(#baseFill)" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Circuit traces (fading) -->
  <line x1="64" y1="34" x2="64" y2="50" stroke="#22d3ee" stroke-width="0.6" opacity="0.25"/>
  <line x1="32" y1="51" x2="48" y2="59" stroke="#22d3ee" stroke-width="0.6" opacity="0.25"/>
  <line x1="96" y1="51" x2="80" y2="59" stroke="#22d3ee" stroke-width="0.6" opacity="0.25"/>
  <!-- Inner hex ring (dim) -->
  <polygon points="64,46 80,55 80,73 64,82 48,73 48,55" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.35"/>
  <!-- Turret housing -->
  <circle cx="64" cy="64" r="16" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="12" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <!-- Barrel (retracted 2px from fire position) -->
  <rect x="60" y="24" width="8" height="34" rx="2" fill="url(#barrelGrad)" stroke="#64748b" stroke-width="0.5"/>
  <rect x="62" y="26" width="3" height="30" rx="1" fill="#94a3b8" opacity="0.12"/>
  <!-- Muzzle tip (cooling) -->
  <rect x="59" y="22" width="10" height="5" rx="1.5" fill="#64748b" stroke="#94a3b8" stroke-width="0.5"/>
  <!-- Residual muzzle heat -->
  <circle cx="64" cy="20" r="4" fill="url(#residualGlow)" opacity="0.4"/>
  <!-- Energy core (depleted, recharging) -->
  <circle cx="64" cy="64" r="8" fill="url(#coreFade)" opacity="0.5"/>
  <circle cx="64" cy="64" r="3.5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="64" cy="64" r="1.5" fill="#bae6fd" opacity="0.6"/>
  <!-- LEDs dim -->
  <circle cx="48" cy="55" r="1.8" fill="#22d3ee" opacity="0.3"/>
  <circle cx="80" cy="55" r="1.8" fill="#22d3ee" opacity="0.3"/>
  <circle cx="48" cy="73" r="1.8" fill="#22d3ee" opacity="0.3"/>
  <circle cx="80" cy="73" r="1.8" fill="#22d3ee" opacity="0.3"/>
  <!-- Targeting sensor (cooling) -->
  <circle cx="64" cy="24" r="3" fill="#1e293b" stroke="#22d3ee" stroke-width="0.5" opacity="0.5"/>
  <circle cx="64" cy="24" r="1.2" fill="#22d3ee" opacity="0.4"/>
</svg>
