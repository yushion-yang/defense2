<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <radialGradient id="core-charge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="40%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </radialGradient>
    <radialGradient id="spin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Cyclone: attack-0 — Pre-spin charge, blades starting to move, energy buildup -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#475569" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="#14b8a6" stroke-width="0.6" opacity="0.4"/>
  <line x1="78" y1="70" x2="78" y2="90" stroke="#14b8a6" stroke-width="0.6" opacity="0.4"/>
  <line x1="64" y1="66" x2="64" y2="96" stroke="#14b8a6" stroke-width="0.6" opacity="0.3"/>

  <!-- Magnetic levitation ring (energized) -->
  <ellipse cx="64" cy="62" rx="30" ry="8" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="64" cy="62" rx="22" ry="6" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.4"/>

  <!-- Central hub -->
  <circle cx="64" cy="50" r="18" fill="url(#hub-g)" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="50" r="14" fill="none" stroke="#64748b" stroke-width="0.8"/>

  <!-- Blade arms (beginning rotation, slightly angled) -->
  <!-- Blade 1 -->
  <polygon points="80,46 104,30 100,35 80,46" fill="url(#blade-g)" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="80" y1="46" x2="102" y2="32" stroke="#2dd4bf" stroke-width="0.8" opacity="0.6"/>

  <!-- Blade 2 -->
  <polygon points="74,56 94,74 90,70 74,56" fill="url(#blade-g)" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="74" y1="56" x2="92" y2="72" stroke="#2dd4bf" stroke-width="0.8" opacity="0.6"/>

  <!-- Blade 3 -->
  <polygon points="48,54 24,70 28,66 48,54" fill="url(#blade-g)" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="48" y1="54" x2="26" y2="68" stroke="#2dd4bf" stroke-width="0.8" opacity="0.6"/>

  <!-- Blade 4 -->
  <polygon points="54,44 34,26 38,30 54,44" fill="url(#blade-g)" stroke="#cbd5e1" stroke-width="0.6"/>
  <line x1="54" y1="44" x2="36" y2="28" stroke="#2dd4bf" stroke-width="0.8" opacity="0.6"/>

  <!-- Motion arcs (beginning) -->
  <path d="M88,38 A30,30 0 0,1 86,46" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <path d="M82,66 A30,30 0 0,1 74,72" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3" stroke-linecap="round"/>

  <!-- Core energy (charging) -->
  <circle cx="64" cy="50" r="14" fill="url(#spin-glow)" opacity="0.6"/>
  <circle cx="64" cy="50" r="6" fill="url(#core-charge)"/>
  <circle cx="64" cy="50" r="4" fill="#5eead4" opacity="0.85"/>

  <!-- LED indicators (all bright) -->
  <circle cx="48" cy="82" r="2" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="80" cy="82" r="2" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="64" cy="94" r="2" fill="#2dd4bf" opacity="0.9"/>
</svg>
