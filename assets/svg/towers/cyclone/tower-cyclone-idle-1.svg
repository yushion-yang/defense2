<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <radialGradient id="core-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Cyclone: idle-1 — Core pulse brighter, slight blade position shift, LEDs alternate -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#475569" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="#0d9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="78" y1="70" x2="78" y2="90" stroke="#0d9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="64" y1="66" x2="64" y2="96" stroke="#0d9488" stroke-width="0.5" opacity="0.2"/>

  <!-- Magnetic levitation ring (outer, brighter) -->
  <ellipse cx="64" cy="62" rx="30" ry="8" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <ellipse cx="64" cy="62" rx="22" ry="6" fill="none" stroke="#5eead4" stroke-width="0.8" opacity="0.3"/>

  <!-- Central hub -->
  <circle cx="64" cy="50" r="18" fill="url(#hub-g)" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="64" cy="50" r="14" fill="none" stroke="#475569" stroke-width="0.8"/>

  <!-- Blade arm 1 (slightly rotated clockwise from idle-0) -->
  <polygon points="79,47 103,38 99,42 79,47" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="79" y1="47" x2="101" y2="40" stroke="#2dd4bf" stroke-width="0.6" opacity="0.5"/>

  <!-- Blade arm 2 -->
  <polygon points="76,53 98,68 94,64 76,55" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="76" y1="54" x2="96" y2="66" stroke="#2dd4bf" stroke-width="0.6" opacity="0.5"/>

  <!-- Blade arm 3 -->
  <polygon points="49,53 25,62 29,58 49,51" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="49" y1="52" x2="27" y2="60" stroke="#2dd4bf" stroke-width="0.6" opacity="0.5"/>

  <!-- Blade arm 4 -->
  <polygon points="52,47 30,32 34,36 52,45" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="52" y1="46" x2="32" y2="34" stroke="#2dd4bf" stroke-width="0.6" opacity="0.5"/>

  <!-- Core energy (brighter pulse) -->
  <circle cx="64" cy="50" r="12" fill="url(#core-glow)" opacity="0.6"/>
  <circle cx="64" cy="50" r="6" fill="url(#core-g)"/>
  <circle cx="64" cy="50" r="3.5" fill="#5eead4" opacity="0.9"/>

  <!-- LED indicators (alternated) -->
  <circle cx="48" cy="82" r="1.5" fill="#14b8a6" opacity="0.3"/>
  <circle cx="80" cy="82" r="1.5" fill="#2dd4bf" opacity="0.9"/>
  <circle cx="64" cy="94" r="1.5" fill="#14b8a6" opacity="0.3"/>
</svg>
