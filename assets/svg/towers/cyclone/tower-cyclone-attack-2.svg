<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <radialGradient id="core-cool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </radialGradient>
    <radialGradient id="fade-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Cyclone: attack-2 — Post-spin cooldown, blades decelerating, fading energy -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#475569" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="#0d9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="78" y1="70" x2="78" y2="90" stroke="#0d9488" stroke-width="0.5" opacity="0.3"/>
  <line x1="64" y1="66" x2="64" y2="96" stroke="#0d9488" stroke-width="0.5" opacity="0.2"/>

  <!-- Magnetic levitation ring (fading) -->
  <ellipse cx="64" cy="62" rx="30" ry="8" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.25"/>
  <ellipse cx="64" cy="62" rx="22" ry="6" fill="none" stroke="#2dd4bf" stroke-width="0.8" opacity="0.2"/>

  <!-- Central hub -->
  <circle cx="64" cy="50" r="18" fill="url(#hub-g)" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="64" cy="50" r="14" fill="none" stroke="#475569" stroke-width="0.8"/>

  <!-- Blade arms (decelerating, intermediate position) -->
  <polygon points="80,48 104,38 100,42 80,50" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="80" y1="49" x2="102" y2="40" stroke="#14b8a6" stroke-width="0.5" opacity="0.3"/>

  <polygon points="76,56 96,72 92,68 76,54" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="76" y1="55" x2="94" y2="70" stroke="#14b8a6" stroke-width="0.5" opacity="0.3"/>

  <polygon points="48,52 26,66 30,62 48,54" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="48" y1="53" x2="28" y2="64" stroke="#14b8a6" stroke-width="0.5" opacity="0.3"/>

  <polygon points="52,44 32,28 36,32 52,46" fill="url(#blade-g)" stroke="#94a3b8" stroke-width="0.5"/>
  <line x1="52" y1="45" x2="34" y2="30" stroke="#14b8a6" stroke-width="0.5" opacity="0.3"/>

  <!-- Fading motion trails -->
  <path d="M90,42 A28,28 0 0,1 88,52" fill="none" stroke="#14b8a6" stroke-width="0.8" opacity="0.2" stroke-linecap="round"/>
  <path d="M40,58 A28,28 0 0,1 38,48" fill="none" stroke="#14b8a6" stroke-width="0.8" opacity="0.2" stroke-linecap="round"/>

  <!-- Core energy (cooling) -->
  <circle cx="64" cy="50" r="12" fill="url(#fade-glow)" opacity="0.5"/>
  <circle cx="64" cy="50" r="6" fill="url(#core-cool)"/>
  <circle cx="64" cy="50" r="3" fill="#2dd4bf" opacity="0.7"/>

  <!-- LED indicators (dimming) -->
  <circle cx="48" cy="82" r="1.5" fill="#14b8a6" opacity="0.4"/>
  <circle cx="80" cy="82" r="1.5" fill="#14b8a6" opacity="0.4"/>
  <circle cx="64" cy="94" r="1.5" fill="#14b8a6" opacity="0.4"/>
</svg>
