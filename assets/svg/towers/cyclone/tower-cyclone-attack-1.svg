<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <radialGradient id="core-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="40%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </radialGradient>
    <radialGradient id="spin-blast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade-blur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Cyclone: attack-1 — FULL SPIN, motion blur blades, maximum energy -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#475569" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="#2dd4bf" stroke-width="0.7" opacity="0.5"/>
  <line x1="78" y1="70" x2="78" y2="90" stroke="#2dd4bf" stroke-width="0.7" opacity="0.5"/>
  <line x1="64" y1="66" x2="64" y2="96" stroke="#2dd4bf" stroke-width="0.7" opacity="0.4"/>

  <!-- Magnetic levitation ring (blazing) -->
  <ellipse cx="64" cy="62" rx="30" ry="8" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.6"/>
  <ellipse cx="64" cy="62" rx="22" ry="6" fill="none" stroke="#99f6e4" stroke-width="1.2" opacity="0.5"/>

  <!-- Central hub -->
  <circle cx="64" cy="50" r="18" fill="url(#hub-g)" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="50" r="14" fill="none" stroke="#64748b" stroke-width="0.8"/>

  <!-- Spinning blade blur (motion trails as arcs) -->
  <!-- Blade blur 1 -->
  <path d="M78,44 Q100,28 102,34 Q100,40 78,48 Z" fill="url(#blade-blur)" stroke="#cbd5e1" stroke-width="0.5" opacity="0.7"/>
  <!-- Blade blur 2 -->
  <path d="M76,56 Q98,68 96,74 Q92,72 70,58 Z" fill="url(#blade-blur)" stroke="#cbd5e1" stroke-width="0.5" opacity="0.7"/>
  <!-- Blade blur 3 -->
  <path d="M50,56 Q28,72 26,66 Q28,60 50,52 Z" fill="url(#blade-blur)" stroke="#cbd5e1" stroke-width="0.5" opacity="0.7"/>
  <!-- Blade blur 4 -->
  <path d="M52,44 Q30,28 32,22 Q36,24 58,42 Z" fill="url(#blade-blur)" stroke="#cbd5e1" stroke-width="0.5" opacity="0.7"/>

  <!-- Motion trail arcs (teal streaks) -->
  <path d="M96,34 A36,36 0 0,1 96,66" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>
  <path d="M76,78 A36,36 0 0,1 52,78" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>
  <path d="M32,66 A36,36 0 0,1 32,34" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>
  <path d="M52,22 A36,36 0 0,1 76,22" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>

  <!-- Outer spin ring -->
  <circle cx="64" cy="50" r="34" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>

  <!-- Core energy (maximum) -->
  <circle cx="64" cy="50" r="18" fill="url(#spin-blast)" opacity="0.7"/>
  <circle cx="64" cy="50" r="6" fill="url(#core-fire)"/>
  <circle cx="64" cy="50" r="4" fill="#99f6e4" opacity="0.95"/>
  <circle cx="64" cy="50" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- LED indicators (max brightness) -->
  <circle cx="48" cy="82" r="2.5" fill="#5eead4" opacity="1"/>
  <circle cx="80" cy="82" r="2.5" fill="#5eead4" opacity="1"/>
  <circle cx="64" cy="94" r="2.5" fill="#5eead4" opacity="1"/>
</svg>
