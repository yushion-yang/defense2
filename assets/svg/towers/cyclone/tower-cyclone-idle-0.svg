<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Core glow gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <!-- Blade body gradient -->
    <linearGradient id="bladeFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Blade edge glow -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Base gradient -->
    <linearGradient id="baseFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Hex highlight -->
    <linearGradient id="hexHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal base platform -->
  <polygon points="64,30 93,47 93,81 64,98 35,81 35,47"
    fill="url(#baseFill)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Hex inner bevel -->
  <polygon points="64,34 89,49 89,79 64,94 39,79 39,49"
    fill="none" stroke="url(#hexHighlight)" stroke-width="0.8"/>
  <!-- Surface panel lines -->
  <line x1="64" y1="34" x2="64" y2="94" stroke="#1e293b" stroke-width="0.4" opacity="0.3"/>
  <line x1="39" y1="64" x2="89" y2="64" stroke="#1e293b" stroke-width="0.4" opacity="0.3"/>

  <!-- LED indicators (dim) — between blade positions on the base -->
  <circle cx="78" cy="42" r="2" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="78" cy="86" r="2" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="42" cy="86" r="2" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="42" cy="42" r="2" fill="#2dd4bf" opacity="0.25"/>
  <circle cx="52" cy="36" r="1.5" fill="#2dd4bf" opacity="0.2"/>
  <circle cx="76" cy="36" r="1.5" fill="#2dd4bf" opacity="0.2"/>

  <!-- Levitation ring (faint) -->
  <circle cx="64" cy="64" r="18" fill="none" stroke="#2dd4bf" stroke-width="0.8" opacity="0.2"/>
  <circle cx="64" cy="64" r="17" fill="none" stroke="#14b8a6" stroke-width="0.3" opacity="0.15"/>

  <!-- Blade group — 3 blades at 0, 120, 240 degrees (12, 4, 8 o'clock) -->
  <!-- Blade 1: pointing up (0 degrees / 12 o'clock) -->
  <g transform="rotate(0, 64, 64)">
    <!-- Blade body: curved scimitar shape -->
    <path d="M61,58 Q58,46 55,34 Q53,28 57,23 Q61,19 64,20 Q67,19 71,23 Q75,28 73,34 Q70,46 67,58 Z"
      fill="url(#bladeFill)" stroke="#0f766e" stroke-width="0.5"/>
    <!-- Bright edge highlight (leading edge curve) -->
    <path d="M57,23 Q53,28 55,34 Q58,46 61,58"
      fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.8"/>
    <!-- Tip accent -->
    <circle cx="64" cy="21" r="1.5" fill="#2dd4bf" opacity="0.7"/>
  </g>

  <!-- Blade 2: lower-right (120 degrees / 4 o'clock) -->
  <g transform="rotate(120, 64, 64)">
    <path d="M61,58 Q58,46 55,34 Q53,28 57,23 Q61,19 64,20 Q67,19 71,23 Q75,28 73,34 Q70,46 67,58 Z"
      fill="url(#bladeFill)" stroke="#0f766e" stroke-width="0.5"/>
    <path d="M57,23 Q53,28 55,34 Q58,46 61,58"
      fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.8"/>
    <circle cx="64" cy="21" r="1.5" fill="#2dd4bf" opacity="0.7"/>
  </g>

  <!-- Blade 3: lower-left (240 degrees / 8 o'clock) -->
  <g transform="rotate(240, 64, 64)">
    <path d="M61,58 Q58,46 55,34 Q53,28 57,23 Q61,19 64,20 Q67,19 71,23 Q75,28 73,34 Q70,46 67,58 Z"
      fill="url(#bladeFill)" stroke="#0f766e" stroke-width="0.5"/>
    <path d="M57,23 Q53,28 55,34 Q58,46 61,58"
      fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.8"/>
    <circle cx="64" cy="21" r="1.5" fill="#2dd4bf" opacity="0.7"/>
  </g>

  <!-- Central hub -->
  <circle cx="64" cy="64" r="10" fill="#334155" stroke="#475569" stroke-width="1"/>
  <circle cx="64" cy="64" r="8" fill="#1e293b" stroke="#0f766e" stroke-width="0.8"/>
  <!-- Core energy (dim steady glow) -->
  <circle cx="64" cy="64" r="12" fill="url(#coreGlow)" opacity="0.5"/>
  <circle cx="64" cy="64" r="5" fill="#14b8a6" opacity="0.4"/>
  <circle cx="64" cy="64" r="2.5" fill="#ffffff" opacity="0.3"/>
  <!-- Hub ring detail -->
  <circle cx="64" cy="64" r="9" fill="none" stroke="#2dd4bf" stroke-width="0.4" opacity="0.3"/>
</svg>