<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="barrel-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="muzzle-flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#bbf7d0" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#4ade80" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-fire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Ricochet: attack-1 — FIRING, muzzle flash, max energy, projectile leaving -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#451a03" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="88" stroke="#713f12" stroke-width="0.6" opacity="0.5"/>
  <line x1="78" y1="70" x2="78" y2="88" stroke="#713f12" stroke-width="0.6" opacity="0.5"/>

  <!-- Turret body -->
  <circle cx="64" cy="60" r="18" fill="url(#hub-g)" stroke="#d97706" stroke-width="2"/>
  <circle cx="64" cy="60" r="13" fill="none" stroke="#b45309" stroke-width="1"/>

  <!-- Magnetic accelerator rings (max power) -->
  <ellipse cx="64" cy="42" rx="10" ry="3.5" fill="none" stroke="url(#ring-fire)" stroke-width="3" opacity="0.9"/>
  <ellipse cx="64" cy="34" rx="8" ry="3" fill="none" stroke="url(#ring-fire)" stroke-width="2.5" opacity="0.85"/>
  <ellipse cx="64" cy="27" rx="6" ry="2.5" fill="none" stroke="url(#ring-fire)" stroke-width="2" opacity="0.8"/>

  <!-- Barrel (illuminated) -->
  <rect x="60" y="20" width="8" height="40" rx="1.5" fill="url(#barrel-g)" stroke="#d97706" stroke-width="1"/>
  <rect x="62" y="22" width="4" height="36" rx="0.5" fill="#4ade80" opacity="0.3"/>
  <rect x="59" y="18" width="10" height="4" rx="1" fill="#d97706" stroke="#fbbf24" stroke-width="0.8"/>

  <!-- Muzzle flash -->
  <circle cx="64" cy="14" r="14" fill="url(#muzzle-flash)"/>
  <circle cx="64" cy="14" r="7" fill="#bbf7d0" opacity="0.5"/>
  <circle cx="64" cy="14" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Trajectory display (blazing, showing full bounce path) -->
  <line x1="64" y1="14" x2="46" y2="4" stroke="#4ade80" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <line x1="46" y1="4" x2="32" y2="12" stroke="#4ade80" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <line x1="32" y1="12" x2="22" y2="4" stroke="#4ade80" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <circle cx="46" cy="4" r="2.5" fill="#4ade80" opacity="0.7"/>
  <circle cx="32" cy="12" r="2" fill="#4ade80" opacity="0.55"/>
  <circle cx="22" cy="4" r="1.5" fill="#4ade80" opacity="0.4"/>

  <!-- Core energy (maximum) -->
  <circle cx="64" cy="60" r="14" fill="url(#fire-glow)" opacity="0.7"/>
  <circle cx="64" cy="60" r="5.5" fill="#22c55e" opacity="0.85"/>
  <circle cx="64" cy="60" r="3" fill="#4ade80" opacity="0.95"/>
  <circle cx="64" cy="60" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- LED indicators (max) -->
  <circle cx="48" cy="82" r="2.5" fill="#4ade80" opacity="1"/>
  <circle cx="80" cy="82" r="2.5" fill="#4ade80" opacity="1"/>
  <circle cx="64" cy="94" r="2.5" fill="#4ade80" opacity="1"/>
</svg>
