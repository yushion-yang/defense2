<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="barrel-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="charge-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-charge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Ricochet: attack-0 — Pre-fire charge, accelerator rings energized, trajectory locked -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#451a03" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="88" stroke="#713f12" stroke-width="0.6" opacity="0.5"/>
  <line x1="78" y1="70" x2="78" y2="88" stroke="#713f12" stroke-width="0.6" opacity="0.5"/>

  <!-- Turret body -->
  <circle cx="64" cy="60" r="18" fill="url(#hub-g)" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="64" cy="60" r="13" fill="none" stroke="#b45309" stroke-width="0.8"/>

  <!-- Magnetic accelerator rings (charging - brighter, thicker) -->
  <ellipse cx="64" cy="42" rx="10" ry="3.5" fill="none" stroke="url(#ring-charge)" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="64" cy="34" rx="8" ry="3" fill="none" stroke="url(#ring-charge)" stroke-width="2" opacity="0.7"/>
  <ellipse cx="64" cy="27" rx="6" ry="2.5" fill="none" stroke="url(#ring-charge)" stroke-width="1.8" opacity="0.6"/>

  <!-- Energy flowing up barrel -->
  <line x1="62" y1="58" x2="62" y2="20" stroke="#4ade80" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="66" y1="58" x2="66" y2="20" stroke="#4ade80" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>

  <!-- Barrel -->
  <rect x="60" y="20" width="8" height="40" rx="1.5" fill="url(#barrel-g)" stroke="#b45309" stroke-width="1"/>
  <rect x="62" y="22" width="4" height="36" rx="0.5" fill="#22c55e" opacity="0.2"/>
  <rect x="59" y="18" width="10" height="4" rx="1" fill="#b45309" stroke="#d97706" stroke-width="0.8"/>

  <!-- Trajectory locked (solid lines, bright) -->
  <line x1="64" y1="18" x2="48" y2="6" stroke="#4ade80" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <line x1="48" y1="6" x2="36" y2="14" stroke="#4ade80" stroke-width="0.8" opacity="0.45" stroke-linecap="round"/>
  <line x1="36" y1="14" x2="28" y2="8" stroke="#4ade80" stroke-width="0.6" opacity="0.3" stroke-linecap="round"/>
  <circle cx="48" cy="6" r="2" fill="#4ade80" opacity="0.5"/>
  <circle cx="36" cy="14" r="1.5" fill="#4ade80" opacity="0.4"/>

  <!-- Charge glow -->
  <circle cx="64" cy="60" r="12" fill="url(#charge-glow)" opacity="0.6"/>
  <circle cx="64" cy="60" r="5" fill="#22c55e" opacity="0.7"/>
  <circle cx="64" cy="60" r="3" fill="#4ade80" opacity="0.85"/>

  <!-- Barrel tip glow -->
  <circle cx="64" cy="18" r="6" fill="#22c55e" opacity="0.15"/>

  <!-- LED indicators (all bright) -->
  <circle cx="48" cy="82" r="2" fill="#4ade80" opacity="0.9"/>
  <circle cx="80" cy="82" r="2" fill="#4ade80" opacity="0.9"/>
  <circle cx="64" cy="94" r="2" fill="#4ade80" opacity="0.9"/>
</svg>
