<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="barrel-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="hub-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="fade-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <!-- Ricochet: attack-2 — Post-fire cooldown, barrel cooling, rings dimming -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#451a03" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#92400e" stroke="#451a03" stroke-width="0.8"/>
  <line x1="50" y1="70" x2="50" y2="88" stroke="#713f12" stroke-width="0.6" opacity="0.5"/>
  <line x1="78" y1="70" x2="78" y2="88" stroke="#713f12" stroke-width="0.6" opacity="0.5"/>

  <!-- Turret body -->
  <circle cx="64" cy="60" r="18" fill="url(#hub-g)" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="64" cy="60" r="13" fill="none" stroke="#78350f" stroke-width="0.8"/>

  <!-- Magnetic accelerator rings (cooling down) -->
  <ellipse cx="64" cy="42" rx="10" ry="3.5" fill="none" stroke="url(#ring-g)" stroke-width="1.8" opacity="0.4"/>
  <ellipse cx="64" cy="34" rx="8" ry="3" fill="none" stroke="url(#ring-g)" stroke-width="1.3" opacity="0.35"/>
  <ellipse cx="64" cy="27" rx="6" ry="2.5" fill="none" stroke="url(#ring-g)" stroke-width="1" opacity="0.3"/>

  <!-- Barrel (slightly retracted / cooling) -->
  <rect x="60" y="22" width="8" height="38" rx="1.5" fill="url(#barrel-g)" stroke="#92400e" stroke-width="0.8"/>
  <rect x="62" y="24" width="4" height="34" rx="0.5" fill="#d97706" opacity="0.2"/>
  <rect x="59" y="20" width="10" height="4" rx="1" fill="#b45309" stroke="#92400e" stroke-width="0.5"/>

  <!-- Residual barrel heat -->
  <circle cx="64" cy="20" r="5" fill="#22c55e" opacity="0.1"/>

  <!-- Fading trajectory -->
  <line x1="64" y1="20" x2="50" y2="10" stroke="#4ade80" stroke-width="0.5" opacity="0.15" stroke-dasharray="2,2" stroke-linecap="round"/>
  <circle cx="50" cy="10" r="1" fill="#22c55e" opacity="0.15"/>

  <!-- Core energy (cooling) -->
  <circle cx="64" cy="60" r="10" fill="url(#fade-glow)" opacity="0.45"/>
  <circle cx="64" cy="60" r="4" fill="#22c55e" opacity="0.45"/>
  <circle cx="64" cy="60" r="2" fill="#4ade80" opacity="0.6"/>

  <!-- LED indicators (dimming) -->
  <circle cx="48" cy="82" r="1.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="80" cy="82" r="1.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="64" cy="94" r="1.5" fill="#22c55e" opacity="0.4"/>

  <!-- Circuit traces -->
  <path d="M48,82 L44,78" stroke="#22c55e" stroke-width="0.4" opacity="0.2"/>
  <path d="M80,82 L84,78" stroke="#22c55e" stroke-width="0.4" opacity="0.2"/>
</svg>
