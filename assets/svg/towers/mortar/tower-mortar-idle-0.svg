<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="basePlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#365314"/>
      <stop offset="50%" stop-color="#2d4a10"/>
      <stop offset="100%" stop-color="#1a2e09"/>
    </linearGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="40%" stop-color="#3f6212"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="30%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d7c0f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4d7c0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ammoPanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>
  <!-- Mortar: idle-0 — ambient energy, core steady -->
  <!-- Ambient ground glow -->
  <circle cx="64" cy="72" r="48" fill="url(#ambientGlow)"/>
  <!-- Hexagonal base platform -->
  <polygon points="64,38 95,53 95,83 64,98 33,83 33,53" fill="url(#basePlate)" stroke="#4d7c0f" stroke-width="1.5"/>
  <polygon points="64,42 91,55 91,81 64,94 37,81 37,55" fill="none" stroke="#365314" stroke-width="0.8" opacity="0.5"/>
  <!-- Circuit lines on base -->
  <line x1="37" y1="55" x2="50" y2="62" stroke="#4d7c0f" stroke-width="0.6" opacity="0.4"/>
  <line x1="91" y1="55" x2="78" y2="62" stroke="#4d7c0f" stroke-width="0.6" opacity="0.4"/>
  <line x1="64" y1="94" x2="64" y2="82" stroke="#4d7c0f" stroke-width="0.6" opacity="0.4"/>
  <!-- Blast shield (armored plates around base) -->
  <rect x="40" y="56" width="48" height="30" rx="4" fill="url(#metalBody)" stroke="#4d7c0f" stroke-width="1"/>
  <rect x="42" y="58" width="44" height="26" rx="3" fill="none" stroke="#365314" stroke-width="0.5" opacity="0.6"/>
  <!-- Panel lines -->
  <line x1="64" y1="56" x2="64" y2="86" stroke="#2d4a10" stroke-width="0.7" opacity="0.5"/>
  <line x1="40" y1="71" x2="88" y2="71" stroke="#2d4a10" stroke-width="0.7" opacity="0.5"/>
  <!-- Ammo storage compartment (left side) -->
  <rect x="42" y="72" width="18" height="12" rx="2" fill="url(#ammoPanel)" stroke="#4b5563" stroke-width="0.5"/>
  <rect x="44" y="74" width="4" height="3" rx="1" fill="#f97316" opacity="0.5"/>
  <rect x="49" y="74" width="4" height="3" rx="1" fill="#f97316" opacity="0.5"/>
  <rect x="54" y="74" width="4" height="3" rx="1" fill="#f97316" opacity="0.4"/>
  <!-- Targeting computer (right side) -->
  <rect x="68" y="72" width="18" height="12" rx="2" fill="url(#ammoPanel)" stroke="#4b5563" stroke-width="0.5"/>
  <rect x="70" y="74" width="14" height="4" rx="1" fill="#1a2e09"/>
  <rect x="71" y="75" width="5" height="2" rx="0.5" fill="#4d7c0f" opacity="0.8"/>
  <circle cx="80" cy="76" r="1" fill="#eab308" opacity="0.7"/>
  <!-- LED status indicators -->
  <circle cx="70" y="80" r="1" fill="#4d7c0f" opacity="0.8"/>
  <circle cx="74" cy="80" r="1" fill="#4d7c0f" opacity="0.8"/>
  <circle cx="78" cy="80" r="1" fill="#eab308" opacity="0.6"/>
  <!-- Mortar tube — elevated, angled upward -->
  <rect x="57" y="34" width="14" height="30" rx="3" fill="url(#barrel)" stroke="#6b7280" stroke-width="1"/>
  <rect x="59" y="34" width="10" height="30" rx="2" fill="none" stroke="#9ca3af" stroke-width="0.4" opacity="0.3"/>
  <!-- Barrel opening -->
  <ellipse cx="64" cy="34" rx="7" ry="4" fill="#1f2937" stroke="#6b7280" stroke-width="1"/>
  <ellipse cx="64" cy="34" rx="4" ry="2.5" fill="#111827"/>
  <!-- Barrel rivets -->
  <circle cx="58" cy="42" r="1" fill="#9ca3af" opacity="0.5"/>
  <circle cx="70" cy="42" r="1" fill="#9ca3af" opacity="0.5"/>
  <circle cx="58" cy="52" r="1" fill="#9ca3af" opacity="0.5"/>
  <circle cx="70" cy="52" r="1" fill="#9ca3af" opacity="0.5"/>
  <!-- Energy core (steady glow) -->
  <circle cx="64" cy="66" r="10" fill="url(#coreGlow)"/>
  <circle cx="64" cy="66" r="5" fill="#eab308" opacity="0.7"/>
  <circle cx="64" cy="66" r="2.5" fill="#fef3c7" opacity="0.9"/>
</svg>
