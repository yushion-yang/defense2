<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="prm-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="prm-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="prm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prm-refract1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#prm-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === PRISM TURRET: Triangular crystal + light refraction === -->
  <!-- Turret platform -->
  <circle cx="64" cy="58" r="13" fill="#334155" stroke="#06b6d4" stroke-width="0.8"/>
  <!-- Light refraction beams (behind crystal) -->
  <line x1="64" y1="36" x2="44" y2="24" stroke="#f87171" stroke-width="1" opacity="0.35"/>
  <line x1="64" y1="36" x2="56" y2="18" stroke="#fbbf24" stroke-width="1" opacity="0.35"/>
  <line x1="64" y1="36" x2="72" y2="18" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="64" y1="36" x2="84" y2="24" stroke="#818cf8" stroke-width="1" opacity="0.35"/>
  <!-- Rainbow refraction arc -->
  <path d="M44,24 Q64,14 84,24" fill="none" stroke="url(#prm-refract1)" stroke-width="1.5"/>
  <!-- Main triangular prism crystal -->
  <polygon points="64,24 48,56 80,56" fill="url(#prm-crystal)" stroke="#06b6d4" stroke-width="1.2" opacity="0.9"/>
  <!-- Crystal face highlight -->
  <polygon points="64,28 52,52 64,52" fill="#67e8f9" opacity="0.25"/>
  <!-- Crystal internal refraction line -->
  <line x1="64" y1="30" x2="56" y2="52" stroke="#a5f3fc" stroke-width="0.6" opacity="0.5"/>
  <line x1="64" y1="30" x2="72" y2="52" stroke="#a5f3fc" stroke-width="0.6" opacity="0.5"/>
  <!-- Crystal tip glow -->
  <circle cx="64" cy="24" r="3" fill="#06b6d4" opacity="0.4"/>
  <!-- Center glow -->
  <circle cx="64" cy="58" r="5" fill="#083344"/>
  <circle cx="64" cy="58" r="3" fill="#06b6d4" opacity="0.6"/>
  <circle cx="64" cy="58" r="8" fill="url(#prm-glow)"/>
</svg>
