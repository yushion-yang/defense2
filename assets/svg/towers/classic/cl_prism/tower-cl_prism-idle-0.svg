<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tri-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tri-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="tri-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#tri-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="58" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === TRIDENT TURRET: 3 barrels in Y-shape at 120 deg === -->
  <!-- Turret housing -->
  <circle cx="64" cy="58" r="13" fill="#334155" stroke="#06b6d4" stroke-width="0.8"/>
  <!-- Tracking ring (faint dashed) -->
  <circle cx="64" cy="58" r="18" fill="none" stroke="#06b6d4" stroke-width="0.4" opacity="0.15" stroke-dasharray="3,3"/>
  <!-- Barrel 1 (up) -->
  <rect x="61" y="18" width="6" height="32" rx="2" fill="url(#tri-barrel)" stroke="#64748b" stroke-width="0.6"/>
  <!-- Barrel 2 (down-left, rotated 120 deg) -->
  <rect x="61" y="18" width="6" height="32" rx="2" fill="url(#tri-barrel)" stroke="#64748b" stroke-width="0.6" transform="rotate(120, 64, 58)"/>
  <!-- Barrel 3 (down-right, rotated 240 deg) -->
  <rect x="61" y="18" width="6" height="32" rx="2" fill="url(#tri-barrel)" stroke="#64748b" stroke-width="0.6" transform="rotate(240, 64, 58)"/>
  <!-- Barrel tip circles -->
  <circle cx="64" cy="20" r="3" fill="#06b6d4" opacity="0.4"/>
  <circle cx="31" cy="77" r="3" fill="#06b6d4" opacity="0.4"/>
  <circle cx="97" cy="77" r="3" fill="#06b6d4" opacity="0.4"/>
  <!-- Center hub -->
  <circle cx="64" cy="58" r="6" fill="#1e293b" stroke="#06b6d4" stroke-width="0.8"/>
  <!-- Center glow (dim, idle) -->
  <circle cx="64" cy="58" r="4" fill="#083344"/>
  <circle cx="64" cy="58" r="2.5" fill="#06b6d4" opacity="0.5"/>
  <circle cx="64" cy="58" r="7" fill="url(#tri-glow)"/>
</svg>
