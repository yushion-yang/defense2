<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="prm-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="prm-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="prm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#prm-hull)" stroke="#475569" stroke-width="1"/>
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <circle cx="64" cy="62" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="64" cy="58" r="13" fill="#334155" stroke="#a5f3fc" stroke-width="1.2"/>
  <!-- Refraction beams (SOLID BRIGHT) -->
  <line x1="64" y1="34" x2="40" y2="20" stroke="#f87171" stroke-width="2.5" opacity="0.85"/>
  <line x1="64" y1="34" x2="54" y2="14" stroke="#fbbf24" stroke-width="2.5" opacity="0.85"/>
  <line x1="64" y1="34" x2="74" y2="14" stroke="#4ade80" stroke-width="2.5" opacity="0.85"/>
  <line x1="64" y1="34" x2="88" y2="20" stroke="#818cf8" stroke-width="2.5" opacity="0.85"/>
  <!-- Beam tip glow dots -->
  <circle cx="40" cy="20" r="3" fill="#f87171" opacity="0.7"/>
  <circle cx="54" cy="14" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="74" cy="14" r="3" fill="#4ade80" opacity="0.7"/>
  <circle cx="88" cy="20" r="3" fill="#818cf8" opacity="0.7"/>
  <!-- Crystal (MAX GLOW, shifted lighter) -->
  <polygon points="64,24 48,56 80,56" fill="url(#prm-crystal)" stroke="#cffafe" stroke-width="2"/>
  <polygon points="64,28 52,52 64,52" fill="#cffafe" opacity="0.4"/>
  <line x1="64" y1="28" x2="56" y2="52" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="64" y1="28" x2="72" y2="52" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <!-- Crystal tip flash -->
  <circle cx="64" cy="24" r="6" fill="#a5f3fc" opacity="0.6"/>
  <circle cx="64" cy="24" r="3" fill="#ffffff" opacity="0.8"/>
  <!-- Center glow (max) -->
  <circle cx="64" cy="58" r="5" fill="#083344"/>
  <circle cx="64" cy="58" r="3" fill="#a5f3fc" opacity="1"/>
  <circle cx="64" cy="58" r="8" fill="url(#prm-glow)"/>
</svg>
