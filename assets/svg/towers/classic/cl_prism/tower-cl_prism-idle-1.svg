  <line x1="64" y1="36" x2="56" y2="18" stroke="#fbbf24" stroke-width="1" opacity="0.45"/>
  <line x1="64" y1="36" x2="72" y2="18" stroke="#4ade80" stroke-width="1" opacity="0.45"/>
