  <line x1="64" y1="30" x2="56" y2="52" stroke="#a5f3fc" stroke-width="0.7" opacity="0.6"/>
  <line x1="64" y1="30" x2="72" y2="52" stroke="#a5f3fc" stroke-width="0.7" opacity="0.6"/>
  <!-- Crystal tip glow (brighter) -->
  <circle cx="64" cy="24" r="3.5" fill="#22d3ee" opacity="0.5"/>
  <!-- Pulse ring -->
  <circle cx="64" cy="40" r="18" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
  <!-- Center glow -->
  <circle cx="64" cy="58" r="5" fill="#083344"/>
  <circle cx="64" cy="58" r="3" fill="#06b6d4" opacity="0.9"/>
  <circle cx="64" cy="58" r="8" fill="url(#prm-glow)"/>
