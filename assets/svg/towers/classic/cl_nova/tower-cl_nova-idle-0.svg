<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="nov-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <radialGradient id="nov-flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nov-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="nov-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="30%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="64" cy="112" rx="36" ry="8" fill="#000" opacity="0.3"/>
  <!-- Hex base -->
  <polygon points="64,78 94,93 94,107 64,114 34,107 34,93" fill="url(#nov-base)" stroke="#a16207" stroke-width="1.5"/>
  <!-- Circuit traces -->
  <path d="M42,98 L52,94 L64,98 L76,94 L86,98" stroke="#eab308" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Pedestal -->
  <rect x="52" y="56" width="24" height="26" rx="3" fill="#292524" stroke="#57534e" stroke-width="1"/>
  <!-- Stun rings emanating -->
  <circle cx="64" cy="38" r="32" fill="none" stroke="#eab308" stroke-width="0.8" opacity="0.2"/>
  <circle cx="64" cy="38" r="26" fill="none" stroke="#eab308" stroke-width="1" opacity="0.3"/>
  <circle cx="64" cy="38" r="20" fill="none" stroke="#fde047" stroke-width="1.2" opacity="0.4"/>
  <!-- Star burst points (8 pointed) -->
  <polygon points="64,10 67,30 82,18 70,34 90,38 70,42 82,58 67,46 64,66 61,46 46,58 58,42 38,38 58,34 46,18 61,30" fill="url(#nov-flash)" opacity="0.5"/>
  <!-- Central orb -->
  <circle cx="64" cy="38" r="12" fill="url(#nov-orb)"/>
  <circle cx="64" cy="38" r="8" fill="url(#nov-core)"/>
  <!-- Lightning bolt accents -->
  <path d="M48,28 L54,34 L50,36 L56,44" stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M80,28 L74,34 L78,36 L72,44" stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Flash core bright dot -->
  <circle cx="64" cy="38" r="4" fill="#fef9c3" opacity="0.9"/>
  <!-- Energy core on base -->
  <circle cx="64" cy="72" r="7" fill="url(#nov-core)"/>
  <!-- LED dots -->
  <circle cx="54" cy="60" r="2" fill="#eab308" opacity="0.9"/>
  <circle cx="74" cy="60" r="2" fill="#eab308" opacity="0.9"/>
  <circle cx="64" cy="80" r="1.5" fill="#fde047" opacity="0.7"/>
</svg>
