<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="nov-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="nov-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#facc15"/>
    </radialGradient>
    <radialGradient id="nov-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nov-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fef9c3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#nov-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- BURST glow -->
  <circle cx="64" cy="55" r="32" fill="url(#nov-burst)"/>
  <circle cx="64" cy="55" r="26" fill="url(#nov-glow)"/>
  <!-- Star burst points (EXTENDED, max brightness) -->
  <line x1="64" y1="55" x2="64" y2="16" stroke="#fef9c3" stroke-width="3" opacity="0.9"/>
  <line x1="64" y1="55" x2="64" y2="90" stroke="#fef9c3" stroke-width="2.5" opacity="0.8"/>
  <line x1="64" y1="55" x2="28" y2="55" stroke="#fef9c3" stroke-width="2.5" opacity="0.8"/>
  <line x1="64" y1="55" x2="100" y2="55" stroke="#fef9c3" stroke-width="2.5" opacity="0.8"/>
  <line x1="64" y1="55" x2="38" y2="29" stroke="#fef9c3" stroke-width="2" opacity="0.7"/>
  <line x1="64" y1="55" x2="90" y2="29" stroke="#fef9c3" stroke-width="2" opacity="0.7"/>
  <line x1="64" y1="55" x2="38" y2="81" stroke="#fef9c3" stroke-width="1.5" opacity="0.6"/>
  <line x1="64" y1="55" x2="90" y2="81" stroke="#fef9c3" stroke-width="1.5" opacity="0.6"/>
  <!-- Star tips (large, bright) -->
  <circle cx="64" cy="16" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="28" cy="55" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="100" cy="55" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="38" cy="29" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="90" cy="29" r="2.5" fill="#ffffff" opacity="0.6"/>
  <!-- Turret platform -->
  <circle cx="64" cy="55" r="12" fill="#334155" stroke="#fef9c3" stroke-width="1.5"/>
  <!-- Central orb (WHITE FLASH) -->
  <circle cx="64" cy="55" r="8" fill="url(#nov-orb)"/>
  <circle cx="64" cy="55" r="6" fill="#ffffff" opacity="0.95"/>
  <!-- Inner highlight -->
  <circle cx="62" cy="53" r="2.5" fill="#fff" opacity="0.7"/>
</svg>
