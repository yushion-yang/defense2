<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="nov-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="nov-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="nov-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#nov-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Outer glow ring (dimmed) -->
  <circle cx="64" cy="55" r="24" fill="url(#nov-glow)"/>
  <!-- Star burst points (dimmed, retracted) -->
  <line x1="64" y1="55" x2="64" y2="30" stroke="#eab308" stroke-width="1.5" opacity="0.4"/>
  <line x1="64" y1="55" x2="64" y2="76" stroke="#eab308" stroke-width="1" opacity="0.2"/>
  <line x1="64" y1="55" x2="42" y2="55" stroke="#eab308" stroke-width="1" opacity="0.2"/>
  <line x1="64" y1="55" x2="86" y2="55" stroke="#eab308" stroke-width="1" opacity="0.2"/>
  <line x1="64" y1="55" x2="49" y2="40" stroke="#eab308" stroke-width="0.8" opacity="0.15"/>
  <line x1="64" y1="55" x2="79" y2="40" stroke="#eab308" stroke-width="0.8" opacity="0.15"/>
  <line x1="64" y1="55" x2="49" y2="70" stroke="#eab308" stroke-width="0.6" opacity="0.1"/>
  <line x1="64" y1="55" x2="79" y2="70" stroke="#eab308" stroke-width="0.6" opacity="0.1"/>
  <!-- Star tips (dimmed) -->
  <circle cx="64" cy="30" r="1.5" fill="#fde68a" opacity="0.4"/>
  <!-- Turret platform -->
  <circle cx="64" cy="55" r="12" fill="#334155" stroke="#eab308" stroke-width="0.8"/>
  <!-- Central orb (dimmed) -->
  <circle cx="64" cy="55" r="8" fill="url(#nov-orb)"/>
  <circle cx="64" cy="55" r="4" fill="#fde68a" opacity="0.5"/>
  <!-- Faint heat shimmer -->
  <circle cx="62" cy="53" r="2" fill="#fff" opacity="0.15"/>
</svg>
