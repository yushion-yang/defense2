<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rl-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rl-rail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="rl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#rl-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <rect x="52" y="52" width="24" height="20" rx="4" fill="#334155" stroke="#a78bfa" stroke-width="1"/>
  <!-- Left rail -->
  <rect x="57" y="8" width="3" height="52" rx="1" fill="url(#rl-rail)" stroke="#5b21b6" stroke-width="0.5"/>
  <!-- Right rail -->
  <rect x="68" y="8" width="3" height="52" rx="1" fill="url(#rl-rail)" stroke="#5b21b6" stroke-width="0.5"/>
  <!-- Coil rings (all glowing bright) -->
  <rect x="55" y="18" width="18" height="3" rx="1" fill="#5b21b6" stroke="#a78bfa" stroke-width="0.7"/>
  <rect x="55" y="26" width="18" height="3" rx="1" fill="#5b21b6" stroke="#a78bfa" stroke-width="0.7"/>
  <rect x="55" y="34" width="18" height="3" rx="1" fill="#5b21b6" stroke="#a78bfa" stroke-width="0.7"/>
  <rect x="55" y="42" width="18" height="3" rx="1" fill="#5b21b6" stroke="#a78bfa" stroke-width="0.7"/>
  <!-- Rail tip energy (charge buildup) -->
  <line x1="58" y1="8" x2="69" y2="8" stroke="#c4b5fd" stroke-width="2" opacity="0.9"/>
  <circle cx="64" cy="8" r="5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="64" cy="8" r="3" fill="#c4b5fd" opacity="0.3"/>
  <!-- Scope -->
  <rect x="72" y="46" width="4" height="12" rx="1.5" fill="#475569" stroke="#7c3aed" stroke-width="0.5"/>
  <circle cx="74" cy="44" r="2.5" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
  <circle cx="74" cy="44" r="1" fill="#c4b5fd" opacity="0.8"/>
  <!-- Turret center glow (very bright) -->
  <circle cx="64" cy="62" r="6" fill="#2e1065"/>
  <circle cx="64" cy="62" r="3.5" fill="#a78bfa" opacity="0.9"/>
  <circle cx="64" cy="62" r="8" fill="url(#rl-glow)"/>
  <!-- Energy conduits (bright) -->
  <line x1="58" y1="12" x2="69" y2="12" stroke="#c4b5fd" stroke-width="0.8" opacity="0.7"/>
  <line x1="58" y1="22" x2="69" y2="22" stroke="#c4b5fd" stroke-width="0.8" opacity="0.7"/>
</svg>
