<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rl-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rl-rail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="rl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rl-muzzle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#rl-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <rect x="52" y="52" width="24" height="20" rx="4" fill="#334155" stroke="#c4b5fd" stroke-width="1.2"/>
  <!-- Left rail (recoil +2) -->
  <rect x="57" y="10" width="3" height="52" rx="1" fill="url(#rl-rail)" stroke="#5b21b6" stroke-width="0.5"/>
  <!-- Right rail (recoil +2) -->
  <rect x="68" y="10" width="3" height="52" rx="1" fill="url(#rl-rail)" stroke="#5b21b6" stroke-width="0.5"/>
  <!-- Coil rings (max glow) -->
  <rect x="55" y="20" width="18" height="3" rx="1" fill="#7c3aed" stroke="#c4b5fd" stroke-width="0.8"/>
  <rect x="55" y="28" width="18" height="3" rx="1" fill="#7c3aed" stroke="#c4b5fd" stroke-width="0.8"/>
  <rect x="55" y="36" width="18" height="3" rx="1" fill="#7c3aed" stroke="#c4b5fd" stroke-width="0.8"/>
  <rect x="55" y="44" width="18" height="3" rx="1" fill="#7c3aed" stroke="#c4b5fd" stroke-width="0.8"/>
  <!-- MUZZLE FLASH -->
  <circle cx="64" cy="8" r="9" fill="url(#rl-muzzle)"/>
  <circle cx="64" cy="8" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- Energy discharge lines -->
  <line x1="64" y1="8" x2="52" y2="0" stroke="#c4b5fd" stroke-width="1.2" opacity="0.7"/>
  <line x1="64" y1="8" x2="76" y2="0" stroke="#c4b5fd" stroke-width="1.2" opacity="0.7"/>
  <line x1="64" y1="8" x2="58" y2="2" stroke="#c4b5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="64" y1="8" x2="70" y2="2" stroke="#c4b5fd" stroke-width="0.8" opacity="0.5"/>
  <!-- Scope -->
  <rect x="72" y="48" width="4" height="12" rx="1.5" fill="#475569" stroke="#7c3aed" stroke-width="0.5"/>
  <circle cx="74" cy="46" r="2.5" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
  <circle cx="74" cy="46" r="1" fill="#ffffff" opacity="0.9"/>
  <!-- Turret center glow (max) -->
  <circle cx="64" cy="62" r="6" fill="#2e1065"/>
  <circle cx="64" cy="62" r="3.5" fill="#c4b5fd" opacity="1"/>
  <circle cx="64" cy="62" r="8" fill="url(#rl-glow)"/>
  <!-- Energy conduits (max) -->
  <line x1="58" y1="14" x2="69" y2="14" stroke="#c4b5fd" stroke-width="1" opacity="0.9"/>
  <line x1="58" y1="24" x2="69" y2="24" stroke="#c4b5fd" stroke-width="1" opacity="0.9"/>
</svg>
