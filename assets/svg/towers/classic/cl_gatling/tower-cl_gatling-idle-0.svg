<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gat-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gat-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="gat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#gat-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === GATLING TURRET: 6-barrel rotating cluster === -->
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#f97316" stroke-width="0.8"/>
  <!-- 6 barrels arranged in circle, pointing up -->
  <!-- Barrel 1 (top center) -->
  <rect x="62" y="16" width="4" height="38" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5"/>
  <!-- Barrel 2 (upper right) -->
  <rect x="70" y="20" width="4" height="34" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(12, 72, 54)"/>
  <!-- Barrel 3 (lower right) -->
  <rect x="74" y="26" width="4" height="28" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(24, 76, 54)"/>
  <!-- Barrel 4 (bottom center) -->
  <rect x="62" y="22" width="4" height="32" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-6, 64, 54)"/>
  <!-- Barrel 5 (upper left) -->
  <rect x="54" y="20" width="4" height="34" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-12, 56, 54)"/>
  <!-- Barrel 6 (lower left) -->
  <rect x="50" y="26" width="4" height="28" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-24, 52, 54)"/>
  <!-- Barrel clamp ring -->
  <circle cx="64" cy="42" r="12" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>
  <circle cx="64" cy="30" r="10" fill="none" stroke="#f97316" stroke-width="1" opacity="0.4"/>
  <!-- Center spindle -->
  <circle cx="64" cy="62" r="5" fill="#1c1917"/>
  <circle cx="64" cy="62" r="3" fill="#f97316" opacity="0.7"/>
  <circle cx="64" cy="62" r="8" fill="url(#gat-glow)"/>
  <!-- Ammo belt hints -->
  <rect x="76" y="58" width="8" height="4" rx="1" fill="#78350f" stroke="#f97316" stroke-width="0.4" opacity="0.6"/>
  <rect x="44" y="58" width="8" height="4" rx="1" fill="#78350f" stroke="#f97316" stroke-width="0.4" opacity="0.6"/>
</svg>
