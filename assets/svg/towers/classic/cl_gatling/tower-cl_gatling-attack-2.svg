<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gat-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gat-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="gat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#gat-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#f97316" stroke-width="0.8"/>
  <!-- 6 barrels (back to normal) -->
  <rect x="62" y="16" width="4" height="38" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5"/>
  <rect x="70" y="20" width="4" height="34" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(12, 72, 54)"/>
  <rect x="74" y="26" width="4" height="28" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(24, 76, 54)"/>
  <rect x="62" y="22" width="4" height="32" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-6, 64, 54)"/>
  <rect x="54" y="20" width="4" height="34" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-12, 56, 54)"/>
  <rect x="50" y="26" width="4" height="28" rx="1.5" fill="url(#gat-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-24, 52, 54)"/>
  <!-- Barrel clamp ring -->
  <circle cx="64" cy="42" r="12" fill="none" stroke="#f97316" stroke-width="1.2" opacity="0.5"/>
  <circle cx="64" cy="30" r="10" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.3"/>
  <!-- Smoke wisps at barrel tips -->
  <circle cx="62" cy="14" r="2" fill="#94a3b8" opacity="0.12"/>
  <circle cx="66" cy="12" r="1.5" fill="#94a3b8" opacity="0.1"/>
  <circle cx="64" cy="10" r="1.8" fill="#94a3b8" opacity="0.08"/>
  <!-- Center spindle (dimmed) -->
  <circle cx="64" cy="62" r="5" fill="#1c1917"/>
  <circle cx="64" cy="62" r="3" fill="#f97316" opacity="0.4"/>
  <circle cx="64" cy="62" r="8" fill="url(#gat-glow)"/>
  <!-- Ammo belts (dimmed) -->
  <rect x="76" y="58" width="8" height="4" rx="1" fill="#78350f" stroke="#f97316" stroke-width="0.4" opacity="0.35"/>
  <rect x="44" y="58" width="8" height="4" rx="1" fill="#78350f" stroke="#f97316" stroke-width="0.4" opacity="0.35"/>
</svg>
