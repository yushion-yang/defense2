<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ec-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ec-reflector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ec-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ec-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#ec-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#fbbf24" stroke-width="0.8"/>
  <!-- Diamond reflector dish -->
  <polygon points="64,22 80,48 64,58 48,48" fill="url(#ec-reflector)" stroke="#fbbf24" stroke-width="1"/>
  <!-- Reflector facets -->
  <line x1="64" y1="22" x2="56" y2="48" stroke="#475569" stroke-width="0.6" opacity="0.7"/>
  <line x1="64" y1="22" x2="72" y2="48" stroke="#475569" stroke-width="0.6" opacity="0.7"/>
  <line x1="56" y1="48" x2="64" y2="58" stroke="#475569" stroke-width="0.4" opacity="0.5"/>
  <line x1="72" y1="48" x2="64" y2="58" stroke="#475569" stroke-width="0.4" opacity="0.5"/>
  <!-- Bounce trajectory indicators (slightly brighter pulse) -->
  <polyline points="64,22 52,10 58,4" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.35"/>
  <polyline points="64,22 76,10 70,4" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.35"/>
  <!-- Faint bounce arrowheads -->
  <polygon points="58,4 56,8 60,7" fill="#fbbf24" opacity="0.2"/>
  <polygon points="70,4 68,8 72,7" fill="#fbbf24" opacity="0.2"/>
  <!-- Energy core at diamond center (pulse brighter) -->
  <circle cx="64" cy="42" r="5" fill="url(#ec-core)"/>
  <circle cx="64" cy="42" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="64" cy="42" r="1" fill="#ffffff" opacity="0.4"/>
  <!-- Side deflector fins -->
  <rect x="42" y="50" width="8" height="3" rx="1" fill="#475569" stroke="#64748b" stroke-width="0.4" transform="rotate(-15,46,51.5)"/>
  <rect x="78" y="50" width="8" height="3" rx="1" fill="#475569" stroke="#64748b" stroke-width="0.4" transform="rotate(15,82,51.5)"/>
  <!-- Center glow -->
  <circle cx="64" cy="62" r="5" fill="#1c1917"/>
  <circle cx="64" cy="62" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="64" cy="62" r="8" fill="url(#ec-glow)"/>
  <!-- LED indicators (brighter pulse) -->
  <circle cx="50" cy="62" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="78" cy="62" r="1.5" fill="#fbbf24" opacity="0.8"/>
</svg>
