<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="frt-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="frt-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="frt-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="frt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="64" cy="112" rx="38" ry="9" fill="#000" opacity="0.3"/>
  <!-- Hex base -->
  <polygon points="64,78 94,93 94,107 64,114 34,107 34,93" fill="url(#frt-base)" stroke="#64748b" stroke-width="1.5"/>
  <!-- Circuit traces -->
  <path d="M42,100 L56,96 M72,96 L86,100" stroke="#fbbf24" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Thick armored walls -->
  <rect x="38" y="36" width="52" height="44" rx="3" fill="url(#frt-wall)" stroke="#64748b" stroke-width="1.5"/>
  <!-- Wall armor panels -->
  <line x1="38" y1="52" x2="90" y2="52" stroke="#475569" stroke-width="0.8"/>
  <line x1="38" y1="64" x2="90" y2="64" stroke="#475569" stroke-width="0.8"/>
  <!-- Battlements on top -->
  <rect x="38" y="28" width="10" height="12" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
  <rect x="54" y="28" width="10" height="12" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
  <rect x="70" y="28" width="10" height="12" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
  <rect x="86" y="28" width="4" height="12" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
  <!-- Battlement gaps -->
  <rect x="48" y="28" width="6" height="8" fill="#334155"/>
  <rect x="64" y="28" width="6" height="8" fill="#334155"/>
  <rect x="80" y="28" width="6" height="8" fill="#334155"/>
  <!-- Shield emblem on front -->
  <path d="M56,46 L64,42 L72,46 L72,58 Q64,64 56,58 Z" fill="#475569" stroke="#fbbf24" stroke-width="1.2"/>
  <path d="M60,48 L64,46 L68,48 L68,55 Q64,58 60,55 Z" fill="#fbbf24" opacity="0.6"/>
  <!-- Radar dish on top -->
  <ellipse cx="64" cy="22" rx="10" ry="4" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/>
  <line x1="64" y1="22" x2="64" y2="28" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="64" cy="20" r="2" fill="#fbbf24" opacity="0.7"/>
  <!-- Range aura indicator -->
  <circle cx="64" cy="22" r="16" fill="none" stroke="#fbbf24" stroke-width="0.6" opacity="0.3" stroke-dasharray="3,3"/>
  <!-- Energy core -->
  <circle cx="64" cy="72" r="7" fill="url(#frt-core)"/>
  <circle cx="64" cy="72" r="11" fill="url(#frt-glow)"/>
  <!-- LED dots -->
  <circle cx="42" cy="40" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="86" cy="40" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="64" cy="80" r="1.5" fill="#fde68a" opacity="0.7"/>
</svg>
