<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="frt-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frt-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="frt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#frt-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === FORTRESS TURRET: Wide beam emitter + battlements + radar === -->
  <!-- Armored turret box -->
  <rect x="44" y="42" width="40" height="30" rx="3" fill="url(#frt-wall)" stroke="#64748b" stroke-width="1"/>
  <!-- Armor panel lines -->
  <line x1="44" y1="52" x2="84" y2="52" stroke="#475569" stroke-width="0.6"/>
  <line x1="44" y1="62" x2="84" y2="62" stroke="#475569" stroke-width="0.6"/>
  <!-- Battlements on top -->
  <rect x="44" y="36" width="8" height="8" fill="#94a3b8" stroke="#64748b" stroke-width="0.6"/>
  <rect x="56" y="36" width="8" height="8" fill="#94a3b8" stroke="#64748b" stroke-width="0.6"/>
  <rect x="68" y="36" width="8" height="8" fill="#94a3b8" stroke="#64748b" stroke-width="0.6"/>
  <rect x="80" y="36" width="4" height="8" fill="#94a3b8" stroke="#64748b" stroke-width="0.6"/>
  <!-- Battlement gaps -->
  <rect x="52" y="36" width="4" height="5" fill="#334155"/>
  <rect x="64" y="36" width="4" height="5" fill="#334155"/>
  <rect x="76" y="36" width="4" height="5" fill="#334155"/>
  <!-- Wide beam emitter (front) -->
  <rect x="50" y="24" width="28" height="14" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="53" y="26" width="22" height="3" rx="1" fill="#fbbf24" opacity="0.6"/>
  <rect x="53" y="31" width="22" height="3" rx="1" fill="#fbbf24" opacity="0.4"/>
  <!-- Shield emblem -->
  <path d="M59,48 L64,45 L69,48 L69,55 Q64,58 59,55 Z" fill="#475569" stroke="#fbbf24" stroke-width="0.8"/>
  <path d="M61,49 L64,47 L67,49 L67,53 Q64,55 61,53 Z" fill="#fbbf24" opacity="0.5"/>
  <!-- Radar dish on top -->
  <ellipse cx="64" cy="20" rx="8" ry="3" fill="#94a3b8" stroke="#64748b" stroke-width="0.6"/>
  <line x1="64" y1="20" x2="64" y2="24" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="64" cy="18" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <!-- Radar range circle -->
  <circle cx="64" cy="20" r="14" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3"/>
  <!-- Center glow -->
  <circle cx="64" cy="62" r="5" fill="#1c1917"/>
  <circle cx="64" cy="62" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="64" cy="62" r="8" fill="url(#frt-glow)"/>
  <!-- LED indicators -->
  <circle cx="48" cy="46" r="1.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="80" cy="46" r="1.5" fill="#fbbf24" opacity="0.7"/>
</svg>
