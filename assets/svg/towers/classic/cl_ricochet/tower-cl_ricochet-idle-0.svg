<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ric-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ric-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="ric-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#ric-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === RICOCHET TURRET: Angled deflector barrel + bounce lines === -->
  <!-- Turret housing -->
  <rect x="50" y="50" width="28" height="22" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="0.8"/>
  <!-- Main barrel (angled deflector shape) -->
  <rect x="59" y="18" width="10" height="38" rx="2" fill="url(#ric-barrel)" stroke="#b45309" stroke-width="0.8"/>
  <!-- Deflector plate at muzzle (angled wedge) -->
  <polygon points="56,16 72,16 72,22 56,20" fill="#f59e0b" stroke="#b45309" stroke-width="0.8"/>
  <line x1="58" y1="17" x2="70" y2="17" stroke="#fde68a" stroke-width="0.5" opacity="0.6"/>
  <!-- Bounce indicator lines (zigzag paths) -->
  <polyline points="64,14 52,6 58,2" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <polyline points="64,14 76,6 70,2" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <!-- Bounce dots at deflection points -->
  <circle cx="52" cy="6" r="1.5" fill="#fde68a" opacity="0.6"/>
  <circle cx="76" cy="6" r="1.5" fill="#fde68a" opacity="0.6"/>
  <!-- Barrel reinforcement rings -->
  <rect x="57" y="28" width="14" height="2.5" rx="1" fill="#78350f" stroke="#f59e0b" stroke-width="0.4"/>
  <rect x="57" y="38" width="14" height="2.5" rx="1" fill="#78350f" stroke="#f59e0b" stroke-width="0.4"/>
  <!-- Angular side plates -->
  <polygon points="48,54 50,50 50,60" fill="#475569" stroke="#f59e0b" stroke-width="0.5"/>
  <polygon points="80,54 78,50 78,60" fill="#475569" stroke="#f59e0b" stroke-width="0.5"/>
  <!-- Center glow -->
  <circle cx="64" cy="62" r="5" fill="#451a03"/>
  <circle cx="64" cy="62" r="3" fill="#f59e0b" opacity="0.6"/>
  <circle cx="64" cy="62" r="8" fill="url(#ric-glow)"/>
</svg>
