<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="mrt-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </radialGradient>
    <linearGradient id="mrt-tube" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="50%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="mrt-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="mrt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mrt-puddle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#166534" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#166534" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="64" cy="112" rx="36" ry="8" fill="#000" opacity="0.3"/>
  <!-- Toxic puddle at base -->
  <ellipse cx="64" cy="108" rx="28" ry="6" fill="url(#mrt-puddle)"/>
  <!-- Hex base -->
  <polygon points="64,78 94,93 94,107 64,114 34,107 34,93" fill="url(#mrt-base)" stroke="#166534" stroke-width="1.5"/>
  <!-- Circuit traces -->
  <path d="M44,98 L56,94 M72,94 L84,98 M58,106 L70,106" stroke="#22c55e" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Turret body -->
  <rect x="48" y="52" width="32" height="30" rx="4" fill="#1e293b" stroke="#57534e" stroke-width="1"/>
  <!-- Angled mortar tube -->
  <rect x="56" y="14" width="14" height="42" rx="5" fill="url(#mrt-tube)" stroke="#78716c" stroke-width="1" transform="rotate(-12 63 35)"/>
  <!-- Tube muzzle -->
  <ellipse cx="60" cy="14" rx="7" ry="4" fill="#44403c" stroke="#78716c" stroke-width="0.8" transform="rotate(-12 60 14)"/>
  <!-- Poison drip marks on tube -->
  <path d="M54,22 Q52,28 54,30" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M56,30 Q54,36 56,38" stroke="#22c55e" stroke-width="1.2" fill="none" opacity="0.5"/>
  <!-- Poison vial left -->
  <rect x="36" y="56" width="8" height="14" rx="3" fill="#166534" stroke="#22c55e" stroke-width="0.8" opacity="0.8"/>
  <ellipse cx="40" cy="56" rx="4" ry="2" fill="#22c55e" opacity="0.5"/>
  <!-- Bubbles in left vial -->
  <circle cx="39" cy="62" r="1.5" fill="#86efac" opacity="0.5"/>
  <circle cx="41" cy="65" r="1" fill="#86efac" opacity="0.4"/>
  <!-- Poison vial right -->
  <rect x="84" y="58" width="8" height="12" rx="3" fill="#166534" stroke="#22c55e" stroke-width="0.8" opacity="0.8"/>
  <ellipse cx="88" cy="58" rx="4" ry="2" fill="#22c55e" opacity="0.5"/>
  <!-- Bubbles in right vial -->
  <circle cx="87" cy="63" r="1.2" fill="#86efac" opacity="0.5"/>
  <circle cx="89" cy="66" r="1" fill="#86efac" opacity="0.4"/>
  <!-- Energy core -->
  <circle cx="64" cy="72" r="8" fill="url(#mrt-core)"/>
  <circle cx="64" cy="72" r="12" fill="url(#mrt-glow)"/>
  <!-- LED dots -->
  <circle cx="52" cy="56" r="2" fill="#22c55e" opacity="0.9"/>
  <circle cx="76" cy="56" r="2" fill="#22c55e" opacity="0.9"/>
  <circle cx="64" cy="48" r="1.5" fill="#86efac" opacity="0.7"/>
</svg>
