<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mrt-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mrt-tube" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="mrt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="1"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mrt-muzzle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#bbf7d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#mrt-hull)" stroke="#475569" stroke-width="1"/>
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="50" y="52" width="28" height="20" rx="4" fill="#334155" stroke="#86efac" stroke-width="1.2"/>
  <!-- Mortar tube (recoil y+2) -->
  <rect x="56" y="22" width="16" height="36" rx="6" fill="url(#mrt-tube)" stroke="#166534" stroke-width="1"/>
  <ellipse cx="64" cy="22" rx="7" ry="3" fill="#052e16" stroke="#86efac" stroke-width="1"/>
  <!-- MUZZLE FLASH from tube opening -->
  <circle cx="64" cy="16" r="9" fill="url(#mrt-muzzle)"/>
  <circle cx="64" cy="16" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- Energy discharge -->
  <line x1="64" y1="16" x2="54" y2="6" stroke="#bbf7d0" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="16" x2="74" y2="6" stroke="#bbf7d0" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="16" x2="58" y2="10" stroke="#bbf7d0" stroke-width="0.8" opacity="0.5"/>
  <line x1="64" y1="16" x2="70" y2="10" stroke="#bbf7d0" stroke-width="0.8" opacity="0.5"/>
  <!-- Tube rings -->
  <rect x="55" y="34" width="18" height="3" rx="1" fill="#14532d" stroke="#86efac" stroke-width="0.8"/>
  <rect x="55" y="44" width="18" height="3" rx="1" fill="#14532d" stroke="#86efac" stroke-width="0.8"/>
  <!-- Ammo storage -->
  <circle cx="78" cy="60" r="4" fill="#14532d" stroke="#22c55e" stroke-width="0.5"/>
  <circle cx="78" cy="60" r="2" fill="#052e16"/>
  <!-- Center glow (max) -->
  <circle cx="64" cy="62" r="5" fill="#052e16"/>
  <circle cx="64" cy="62" r="3" fill="#86efac" opacity="1"/>
  <circle cx="64" cy="62" r="8" fill="url(#mrt-glow)"/>
</svg>
