<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fal-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fal-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="fal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#fal-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#3b82f6" stroke-width="0.8"/>
  <!-- Left wide barrel (normal) -->
  <rect x="52" y="24" width="8" height="30" rx="3" fill="url(#fal-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Right wide barrel (normal) -->
  <rect x="68" y="24" width="8" height="30" rx="3" fill="url(#fal-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Barrel band (connecting) -->
  <rect x="50" y="36" width="28" height="3" rx="1" fill="#475569" stroke="#3b82f6" stroke-width="0.4"/>
  <!-- Barrel openings -->
  <ellipse cx="56" cy="24" rx="3.5" ry="1.5" fill="#0f172a"/>
  <ellipse cx="72" cy="24" rx="3.5" ry="1.5" fill="#0f172a"/>
  <!-- Smoke wisps at barrel tips -->
  <circle cx="54" cy="20" r="2" fill="#94a3b8" opacity="0.15"/>
  <circle cx="58" cy="18" r="1.5" fill="#94a3b8" opacity="0.1"/>
  <circle cx="70" cy="20" r="2" fill="#94a3b8" opacity="0.15"/>
  <circle cx="74" cy="18" r="1.5" fill="#94a3b8" opacity="0.1"/>
  <!-- Spread indicator lines (dim) -->
  <line x1="53" y1="24" x2="46" y2="14" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
  <line x1="75" y1="24" x2="82" y2="14" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
  <!-- Side ammo drums (dimmed) -->
  <rect x="44" y="56" width="6" height="8" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.3" opacity="0.4"/>
  <rect x="78" y="56" width="6" height="8" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.3" opacity="0.4"/>
  <!-- Center glow (dimmed) -->
  <circle cx="64" cy="62" r="5" fill="#1e3a5f"/>
  <circle cx="64" cy="62" r="3" fill="#3b82f6" opacity="0.4"/>
  <circle cx="64" cy="62" r="8" fill="url(#fal-glow)"/>
</svg>
