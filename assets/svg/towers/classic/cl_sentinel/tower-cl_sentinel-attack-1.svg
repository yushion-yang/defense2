<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sen-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sen-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="sen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sen-muzzle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#sen-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#93c5fd" stroke-width="1"/>
  <!-- Cannon barrel (recoil: y+2) -->
  <rect x="60" y="18" width="8" height="46" rx="2" fill="url(#sen-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Barrel tip / muzzle brake (recoil: y+2) -->
  <rect x="58" y="14" width="12" height="7" rx="2" fill="#475569" stroke="#64748b" stroke-width="0.8"/>
  <line x1="59" y1="17" x2="69" y2="17" stroke="#93c5fd" stroke-width="0.8" opacity="1"/>
  <!-- MUZZLE FLASH -->
  <circle cx="64" cy="10" r="8" fill="url(#sen-muzzle)"/>
  <circle cx="64" cy="10" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- Energy discharge lines from muzzle -->
  <line x1="64" y1="10" x2="54" y2="2" stroke="#93c5fd" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="10" x2="74" y2="2" stroke="#93c5fd" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="10" x2="56" y2="8" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <line x1="64" y1="10" x2="72" y2="8" stroke="#93c5fd" stroke-width="0.8" opacity="0.5"/>
  <!-- Turret center glow (max brightness) -->
  <circle cx="64" cy="62" r="6" fill="#1e3a5f"/>
  <circle cx="64" cy="62" r="4" fill="#93c5fd" opacity="1"/>
  <circle cx="64" cy="62" r="8" fill="url(#sen-glow)"/>
  <!-- Side detail bolts -->
  <circle cx="52" cy="62" r="1.5" fill="#93c5fd" opacity="1"/>
  <circle cx="76" cy="62" r="1.5" fill="#93c5fd" opacity="1"/>
</svg>
