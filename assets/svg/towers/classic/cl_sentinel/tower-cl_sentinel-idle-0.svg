<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sen-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sen-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="sen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#sen-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === SENTINEL TURRET: Single cannon + crosshair === -->
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#3b82f6" stroke-width="0.8"/>
  <!-- Cannon barrel -->
  <rect x="60" y="16" width="8" height="46" rx="2" fill="url(#sen-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Barrel tip / muzzle brake -->
  <rect x="58" y="12" width="12" height="7" rx="2" fill="#475569" stroke="#64748b" stroke-width="0.8"/>
  <line x1="59" y1="15" x2="69" y2="15" stroke="#3b82f6" stroke-width="0.5" opacity="0.6"/>
  <!-- Crosshair reticle -->
  <circle cx="64" cy="8" r="7" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="1" x2="64" y2="5" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <line x1="64" y1="11" x2="64" y2="15" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <line x1="57" y1="8" x2="61" y2="8" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <line x1="67" y1="8" x2="71" y2="8" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <circle cx="64" cy="8" r="1.5" fill="#3b82f6" opacity="0.5"/>
  <!-- Turret center glow -->
  <circle cx="64" cy="62" r="6" fill="#1e3a5f"/>
  <circle cx="64" cy="62" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="64" cy="62" r="8" fill="url(#sen-glow)"/>
  <!-- Side detail bolts -->
  <circle cx="52" cy="62" r="1.5" fill="#3b82f6" opacity="0.7"/>
  <circle cx="76" cy="62" r="1.5" fill="#3b82f6" opacity="0.7"/>
</svg>
