<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hyd-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hyd-neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <radialGradient id="hyd-head" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </radialGradient>
    <radialGradient id="hyd-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#hyd-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === HYDRA TURRET: 3 small turret heads on necks === -->
  <!-- Central body hub -->
  <ellipse cx="64" cy="58" rx="12" ry="14" fill="#3b0764" stroke="#581c87" stroke-width="1"/>
  <!-- Neck 1 (left, curving upper-left) -->
  <path d="M56,50 Q42,38 36,28" stroke="url(#hyd-neck)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Head 1 -->
  <circle cx="34" cy="26" r="7" fill="url(#hyd-head)" stroke="#a855f7" stroke-width="0.8"/>
  <circle cx="32" cy="24" r="1.8" fill="#d8b4fe" opacity="0.8"/>
  <!-- Barrel 1 -->
  <rect x="31" y="16" width="3" height="9" rx="1.2" fill="#581c87" stroke="#7e22ce" stroke-width="0.5"/>
  <!-- Neck 2 (center, straight up) -->
  <path d="M64,46 Q64,34 64,22" stroke="url(#hyd-neck)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Head 2 -->
  <circle cx="64" cy="18" r="7" fill="url(#hyd-head)" stroke="#a855f7" stroke-width="0.8"/>
  <circle cx="62" cy="16" r="1.8" fill="#d8b4fe" opacity="0.8"/>
  <!-- Barrel 2 -->
  <rect x="62" y="6" width="3" height="9" rx="1.2" fill="#581c87" stroke="#7e22ce" stroke-width="0.5"/>
  <!-- Neck 3 (right, curving upper-right) -->
  <path d="M72,50 Q86,38 92,28" stroke="url(#hyd-neck)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Head 3 -->
  <circle cx="94" cy="26" r="7" fill="url(#hyd-head)" stroke="#a855f7" stroke-width="0.8"/>
  <circle cx="96" cy="24" r="1.8" fill="#d8b4fe" opacity="0.8"/>
  <!-- Barrel 3 -->
  <rect x="93" y="16" width="3" height="9" rx="1.2" fill="#581c87" stroke="#7e22ce" stroke-width="0.5"/>
  <!-- Energy sparkles -->
  <circle cx="46" cy="42" r="1.2" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="82" cy="42" r="1.2" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="50" cy="22" r="1" fill="#e9d5ff" opacity="0.4"/>
  <circle cx="78" cy="22" r="1" fill="#e9d5ff" opacity="0.4"/>
  <!-- Center glow -->
  <circle cx="64" cy="58" r="5" fill="#2e1065"/>
  <circle cx="64" cy="58" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="64" cy="58" r="8" fill="url(#hyd-glow)"/>
</svg>
