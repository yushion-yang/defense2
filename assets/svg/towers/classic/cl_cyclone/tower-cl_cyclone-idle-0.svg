<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cyc-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="cyc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyc-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#cyc-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === CYCLONE TURRET: 3 rotating blades (melee, no barrel) === -->
  <!-- Spin track circle -->
  <circle cx="64" cy="55" r="26" fill="none" stroke="#14b8a6" stroke-width="0.6" opacity="0.3" stroke-dasharray="3,3"/>
  <!-- Blade 1 (pointing up) -->
  <path d="M64,55 L60,30 Q64,24 68,30 Z" fill="url(#cyc-blade)" stroke="#14b8a6" stroke-width="0.8"/>
  <!-- Blade 2 (pointing lower-left) -->
  <path d="M64,55 L42,68 Q38,62 44,60 Z" fill="url(#cyc-blade)" stroke="#14b8a6" stroke-width="0.8"/>
  <!-- Blade 3 (pointing lower-right) -->
  <path d="M64,55 L86,68 Q90,62 84,60 Z" fill="url(#cyc-blade)" stroke="#14b8a6" stroke-width="0.8"/>
  <!-- Blade edge highlights -->
  <line x1="62" y1="34" x2="64" y2="55" stroke="#5eead4" stroke-width="0.5" opacity="0.5"/>
  <line x1="46" y1="65" x2="64" y2="55" stroke="#5eead4" stroke-width="0.5" opacity="0.5"/>
  <line x1="82" y1="65" x2="64" y2="55" stroke="#5eead4" stroke-width="0.5" opacity="0.5"/>
  <!-- Center hub -->
  <circle cx="64" cy="55" r="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
  <circle cx="64" cy="55" r="4" fill="#14b8a6" opacity="0.7"/>
  <circle cx="64" cy="55" r="12" fill="url(#cyc-glow)"/>
  <!-- Wind motion arcs -->
  <path d="M40,42 Q50,38 56,44" fill="none" stroke="#5eead4" stroke-width="0.8" opacity="0.3"/>
  <path d="M88,42 Q78,38 72,44" fill="none" stroke="#5eead4" stroke-width="0.8" opacity="0.3"/>
  <path d="M64,80 Q58,76 58,70" fill="none" stroke="#5eead4" stroke-width="0.8" opacity="0.3"/>
</svg>
