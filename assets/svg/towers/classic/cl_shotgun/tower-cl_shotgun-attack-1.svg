<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="iw-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iw-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="iw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iw-muzzle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fca5a5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#iw-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <circle cx="64" cy="62" r="14" fill="#334155" stroke="#fca5a5" stroke-width="1"/>
  <!-- 6 barrels (recoil y+2) -->
  <rect x="62" y="18" width="4" height="38" rx="1.5" fill="url(#iw-barrel)" stroke="#64748b" stroke-width="0.5"/>
  <rect x="70" y="22" width="4" height="34" rx="1.5" fill="url(#iw-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(12, 72, 56)"/>
  <rect x="74" y="28" width="4" height="28" rx="1.5" fill="url(#iw-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(24, 76, 56)"/>
  <rect x="62" y="24" width="4" height="32" rx="1.5" fill="url(#iw-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-6, 64, 56)"/>
  <rect x="54" y="22" width="4" height="34" rx="1.5" fill="url(#iw-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-12, 56, 56)"/>
  <rect x="50" y="28" width="4" height="28" rx="1.5" fill="url(#iw-barrel)" stroke="#64748b" stroke-width="0.5" transform="rotate(-24, 52, 56)"/>
  <!-- Barrel clamp ring -->
  <circle cx="64" cy="44" r="12" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.9"/>
  <circle cx="64" cy="32" r="10" fill="none" stroke="#fca5a5" stroke-width="1.2" opacity="0.6"/>
  <!-- MUZZLE FLASH -->
  <circle cx="64" cy="14" r="9" fill="url(#iw-muzzle)"/>
  <circle cx="64" cy="14" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- Energy discharge lines -->
  <line x1="64" y1="14" x2="54" y2="6" stroke="#fca5a5" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="14" x2="74" y2="6" stroke="#fca5a5" stroke-width="1" opacity="0.7"/>
  <line x1="64" y1="14" x2="58" y2="10" stroke="#fca5a5" stroke-width="0.8" opacity="0.5"/>
  <line x1="64" y1="14" x2="70" y2="10" stroke="#fca5a5" stroke-width="0.8" opacity="0.5"/>
  <!-- Center spindle (max) -->
  <circle cx="64" cy="62" r="5" fill="#1c1917"/>
  <circle cx="64" cy="62" r="3" fill="#fca5a5" opacity="1"/>
  <circle cx="64" cy="62" r="8" fill="url(#iw-glow)"/>
  <!-- Ammo belts -->
  <rect x="76" y="58" width="8" height="4" rx="1" fill="#7f1d1d" stroke="#fca5a5" stroke-width="0.5" opacity="1"/>
  <rect x="44" y="58" width="8" height="4" rx="1" fill="#7f1d1d" stroke="#fca5a5" stroke-width="0.5" opacity="1"/>
</svg>
