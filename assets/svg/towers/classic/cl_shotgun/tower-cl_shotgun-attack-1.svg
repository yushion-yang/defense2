<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sg-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sg-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="sg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-muzzle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fca5a5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Left track -->
  <rect x="36" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="38" y1="50" x2="48" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="55" x2="48" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="65" x2="48" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="70" x2="48" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="38" y1="75" x2="48" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="78" y="44" width="14" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="80" y1="50" x2="90" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="55" x2="90" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="65" x2="90" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="70" x2="90" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="80" y1="75" x2="90" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull base plate -->
  <circle cx="64" cy="64" r="22" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.4"/>
  <!-- Hull body -->
  <rect x="49" y="49" width="30" height="30" rx="4" fill="url(#sg-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="57,49 64,43 71,49" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate -->
  <line x1="52" y1="73" x2="76" y2="73" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="76" x2="76" y2="76" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="79" x2="76" y2="79" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Turret housing -->
  <rect x="48" y="52" width="32" height="20" rx="5" fill="#334155" stroke="#fca5a5" stroke-width="1.2"/>
  <!-- Left barrel (recoil y+2) -->
  <rect x="52" y="20" width="8" height="38" rx="3" fill="url(#sg-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Right barrel (recoil y+2) -->
  <rect x="68" y="20" width="8" height="38" rx="3" fill="url(#sg-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Barrel openings -->
  <ellipse cx="56" cy="20" rx="3.5" ry="1.5" fill="#0f172a"/>
  <ellipse cx="72" cy="20" rx="3.5" ry="1.5" fill="#0f172a"/>
  <!-- MUZZLE FLASH on left barrel -->
  <circle cx="56" cy="16" r="7" fill="url(#sg-muzzle)"/>
  <circle cx="56" cy="16" r="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- MUZZLE FLASH on right barrel -->
  <circle cx="72" cy="16" r="7" fill="url(#sg-muzzle)"/>
  <circle cx="72" cy="16" r="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Energy discharge lines (spread pattern) -->
  <line x1="56" y1="16" x2="44" y2="6" stroke="#fca5a5" stroke-width="1" opacity="0.7"/>
  <line x1="56" y1="16" x2="50" y2="4" stroke="#fca5a5" stroke-width="0.8" opacity="0.5"/>
  <line x1="72" y1="16" x2="84" y2="6" stroke="#fca5a5" stroke-width="1" opacity="0.7"/>
  <line x1="72" y1="16" x2="78" y2="4" stroke="#fca5a5" stroke-width="0.8" opacity="0.5"/>
  <!-- Barrel band -->
  <rect x="50" y="32" width="28" height="3" rx="1" fill="#475569" stroke="#fca5a5" stroke-width="0.8"/>
  <!-- Shell ejection ports -->
  <rect x="78" y="54" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <rect x="78" y="60" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <rect x="45" y="54" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <rect x="45" y="60" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <!-- Spread indicator lines -->
  <line x1="52" y1="20" x2="42" y2="8" stroke="#fca5a5" stroke-width="0.8" opacity="0.7"/>
  <line x1="76" y1="20" x2="86" y2="8" stroke="#fca5a5" stroke-width="0.8" opacity="0.7"/>
  <!-- Center glow (max) -->
  <circle cx="64" cy="62" r="5" fill="#450a0a"/>
  <circle cx="64" cy="62" r="3" fill="#fca5a5" opacity="1"/>
  <circle cx="64" cy="62" r="8" fill="url(#sg-glow)"/>
</svg>
