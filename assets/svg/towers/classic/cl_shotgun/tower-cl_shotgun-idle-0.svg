<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sg-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sg-barrel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="sg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tank shadow -->
  <ellipse cx="64" cy="100" rx="38" ry="8" fill="#000" opacity="0.25"/>
  <!-- Left track -->
  <rect x="22" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="24" y1="48" x2="32" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="54" x2="32" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="60" x2="32" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="66" x2="32" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="72" x2="32" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="78" x2="32" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="84" x2="32" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="90" x2="32" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Right track -->
  <rect x="94" y="42" width="12" height="56" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="96" y1="48" x2="104" y2="48" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="54" x2="104" y2="54" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="60" x2="104" y2="60" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="66" x2="104" y2="66" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="72" x2="104" y2="72" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="78" x2="104" y2="78" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="84" x2="104" y2="84" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
  <!-- Hull body -->
  <rect x="34" y="40" width="60" height="58" rx="5" fill="url(#sg-hull)" stroke="#475569" stroke-width="1"/>
  <!-- Front direction indicator -->
  <polygon points="58,40 64,34 70,40" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- Engine grate (rear) -->
  <line x1="42" y1="88" x2="86" y2="88" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="91" x2="86" y2="91" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="94" x2="86" y2="94" stroke="#0f172a" stroke-width="1" opacity="0.6"/>
  <!-- Turret ring -->
  <circle cx="64" cy="62" r="20" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- === SHOTGUN TURRET: Wide double barrel + shell ports === -->
  <!-- Turret housing (wider) -->
  <rect x="48" y="52" width="32" height="20" rx="5" fill="#334155" stroke="#ef4444" stroke-width="0.8"/>
  <!-- Left barrel (wide) -->
  <rect x="52" y="18" width="8" height="38" rx="3" fill="url(#sg-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Right barrel (wide) -->
  <rect x="68" y="18" width="8" height="38" rx="3" fill="url(#sg-barrel)" stroke="#64748b" stroke-width="0.8"/>
  <!-- Barrel openings -->
  <ellipse cx="56" cy="18" rx="3.5" ry="1.5" fill="#0f172a"/>
  <ellipse cx="72" cy="18" rx="3.5" ry="1.5" fill="#0f172a"/>
  <!-- Barrel band -->
  <rect x="50" y="30" width="28" height="3" rx="1" fill="#475569" stroke="#ef4444" stroke-width="0.5"/>
  <!-- Shell ejection ports (side) -->
  <rect x="78" y="54" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <rect x="78" y="60" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <rect x="45" y="54" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <rect x="45" y="60" width="5" height="3" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.4"/>
  <!-- Spread indicator lines -->
  <line x1="52" y1="18" x2="46" y2="10" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
  <line x1="76" y1="18" x2="82" y2="10" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
  <!-- Center glow -->
  <circle cx="64" cy="62" r="5" fill="#450a0a"/>
  <circle cx="64" cy="62" r="3" fill="#ef4444" opacity="0.6"/>
  <circle cx="64" cy="62" r="8" fill="url(#sg-glow)"/>
</svg>
