<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="baseFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="coreFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleFlash" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flashBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fortress: attack-1 — FIRING, twin muzzle flash -->
  <!-- Shadow -->
  <ellipse cx="64" cy="100" rx="40" ry="11" fill="#0f172a" opacity="0.4"/>
  <!-- Outer hex base (lit up) -->
  <polygon points="64,30 100,49 100,87 64,106 28,87 28,49" fill="url(#baseFill)" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
  <!-- Armor plating -->
  <line x1="28" y1="49" x2="64" y2="68" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="49" x2="64" y2="68" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <line x1="28" y1="87" x2="64" y2="68" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="87" x2="64" y2="68" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <!-- Inner hex (fire glow) -->
  <polygon points="64,42 84,53 84,83 64,94 44,83 44,53" fill="url(#armorGrad)" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
  <!-- Corner bolts (lit) -->
  <circle cx="64" cy="30" r="2.5" fill="#fbbf24" stroke="#fef3c7" stroke-width="0.5" opacity="0.6"/>
  <circle cx="100" cy="49" r="2.5" fill="#fbbf24" stroke="#fef3c7" stroke-width="0.5" opacity="0.6"/>
  <circle cx="100" cy="87" r="2.5" fill="#fbbf24" stroke="#fef3c7" stroke-width="0.5" opacity="0.6"/>
  <circle cx="64" cy="106" r="2.5" fill="#fbbf24" stroke="#fef3c7" stroke-width="0.5" opacity="0.6"/>
  <circle cx="28" cy="87" r="2.5" fill="#fbbf24" stroke="#fef3c7" stroke-width="0.5" opacity="0.6"/>
  <circle cx="28" cy="49" r="2.5" fill="#fbbf24" stroke="#fef3c7" stroke-width="0.5" opacity="0.6"/>
  <!-- Shield generators (max) -->
  <rect x="30" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="34" cy="68" r="5" fill="url(#shieldGlow)"/>
  <circle cx="34" cy="68" r="2" fill="#fef3c7"/>
  <rect x="90" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="94" cy="68" r="5" fill="url(#shieldGlow)"/>
  <circle cx="94" cy="68" r="2" fill="#fef3c7"/>
  <!-- Turret housing -->
  <rect x="48" y="52" width="32" height="32" rx="4" fill="#1f2937" stroke="#fbbf24" stroke-width="1.2" opacity="0.7"/>
  <rect x="52" y="56" width="24" height="24" rx="2" fill="#111827" stroke="#f59e0b" stroke-width="0.8"/>
  <!-- Twin barrels (recoil: +3px down) -->
  <rect x="52" y="21" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="69" y="21" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <!-- Muzzle tips -->
  <rect x="50" y="17" width="11" height="6" rx="2" fill="#6b7280" stroke="#fbbf24" stroke-width="1"/>
  <rect x="67" y="17" width="11" height="6" rx="2" fill="#6b7280" stroke="#fbbf24" stroke-width="1"/>
  <!-- TWIN MUZZLE FLASHES -->
  <ellipse cx="55.5" cy="10" rx="8" ry="12" fill="url(#muzzleFlash)" opacity="0.9"/>
  <circle cx="55.5" cy="8" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="55.5" cy="8" r="2" fill="#fef3c7"/>
  <ellipse cx="72.5" cy="10" rx="8" ry="12" fill="url(#muzzleFlash)" opacity="0.9"/>
  <circle cx="72.5" cy="8" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="72.5" cy="8" r="2" fill="#fef3c7"/>
  <!-- Flash rays -->
  <line x1="55.5" y1="8" x2="55.5" y2="0" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="72.5" y1="8" x2="72.5" y2="0" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="55.5" y1="8" x2="47" y2="2" stroke="#fbbf24" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  <line x1="72.5" y1="8" x2="81" y2="2" stroke="#fbbf24" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  <!-- Energy core (max fire) -->
  <circle cx="64" cy="68" r="10" fill="url(#coreFire)" opacity="0.95"/>
  <circle cx="64" cy="68" r="5" fill="#fbbf24"/>
  <circle cx="64" cy="68" r="2.5" fill="#ffffff"/>
  <!-- All LEDs max -->
  <circle cx="50" cy="55" r="2" fill="#fbbf24"/>
  <circle cx="78" cy="55" r="2" fill="#fbbf24"/>
  <circle cx="50" cy="81" r="2" fill="#fbbf24"/>
  <circle cx="78" cy="81" r="2" fill="#fbbf24"/>
  <!-- Overall flash halo -->
  <circle cx="64" cy="36" r="34" fill="url(#flashBurst)" opacity="0.2"/>
</svg>
