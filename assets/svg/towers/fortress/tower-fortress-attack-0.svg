<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="baseFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="coreCharge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="muzzleCharge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fortress: attack-0 — pre-fire charge -->
  <!-- Shadow -->
  <ellipse cx="64" cy="100" rx="40" ry="11" fill="#0f172a" opacity="0.4"/>
  <!-- Outer hex base -->
  <polygon points="64,30 100,49 100,87 64,106 28,87 28,49" fill="url(#baseFill)" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  <!-- Armor plating -->
  <line x1="28" y1="49" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="49" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="87" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="87" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner hex (charging glow) -->
  <polygon points="64,42 84,53 84,83 64,94 44,83 44,53" fill="url(#armorGrad)" stroke="#fbbf24" stroke-width="1.2" opacity="0.7"/>
  <!-- Corner bolts -->
  <circle cx="64" cy="30" r="2.5" fill="#4b5563" stroke="#fbbf24" stroke-width="0.6"/>
  <circle cx="100" cy="49" r="2.5" fill="#4b5563" stroke="#fbbf24" stroke-width="0.6"/>
  <circle cx="100" cy="87" r="2.5" fill="#4b5563" stroke="#fbbf24" stroke-width="0.6"/>
  <circle cx="64" cy="106" r="2.5" fill="#4b5563" stroke="#fbbf24" stroke-width="0.6"/>
  <circle cx="28" cy="87" r="2.5" fill="#4b5563" stroke="#fbbf24" stroke-width="0.6"/>
  <circle cx="28" cy="49" r="2.5" fill="#4b5563" stroke="#fbbf24" stroke-width="0.6"/>
  <!-- Shield generators (charging) -->
  <rect x="30" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="34" cy="68" r="4" fill="url(#shieldGlow)"/>
  <circle cx="34" cy="68" r="2" fill="#fbbf24"/>
  <rect x="90" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="94" cy="68" r="4" fill="url(#shieldGlow)"/>
  <circle cx="94" cy="68" r="2" fill="#fbbf24"/>
  <!-- Turret housing -->
  <rect x="48" y="52" width="32" height="32" rx="4" fill="#1f2937" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <rect x="52" y="56" width="24" height="24" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8"/>
  <!-- Twin barrels -->
  <rect x="52" y="18" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="69" y="18" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <!-- Muzzle tips (charging) -->
  <rect x="50" y="14" width="11" height="6" rx="2" fill="#4b5563" stroke="#fbbf24" stroke-width="0.8"/>
  <rect x="67" y="14" width="11" height="6" rx="2" fill="#4b5563" stroke="#fbbf24" stroke-width="0.8"/>
  <!-- Muzzle charge glow -->
  <circle cx="55.5" cy="14" r="5" fill="url(#muzzleCharge)" opacity="0.5"/>
  <circle cx="72.5" cy="14" r="5" fill="url(#muzzleCharge)" opacity="0.5"/>
  <!-- Energy core (intense charge) -->
  <circle cx="64" cy="68" r="12" fill="url(#coreCharge)" opacity="0.85"/>
  <circle cx="64" cy="68" r="6" fill="#f59e0b" opacity="0.95"/>
  <circle cx="64" cy="68" r="3" fill="#fef3c7"/>
  <!-- All LEDs bright -->
  <circle cx="50" cy="55" r="1.8" fill="#fbbf24" opacity="0.95"/>
  <circle cx="78" cy="55" r="1.8" fill="#fbbf24" opacity="0.95"/>
  <circle cx="50" cy="81" r="1.8" fill="#fbbf24" opacity="0.95"/>
  <circle cx="78" cy="81" r="1.8" fill="#fbbf24" opacity="0.95"/>
  <!-- Energy flow lines -->
  <line x1="64" y1="42" x2="64" y2="52" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
  <line x1="44" y1="68" x2="48" y2="68" stroke="#fbbf24" stroke-width="0.8" opacity="0.6"/>
  <line x1="84" y1="68" x2="80" y2="68" stroke="#fbbf24" stroke-width="0.8" opacity="0.6"/>
</svg>
