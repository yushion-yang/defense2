<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="baseFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fortress: idle-1 — shield pulse, core brighter -->
  <!-- Shadow -->
  <ellipse cx="64" cy="100" rx="40" ry="11" fill="#0f172a" opacity="0.4"/>
  <!-- Outer hex base -->
  <polygon points="64,30 100,49 100,87 64,106 28,87 28,49" fill="url(#baseFill)" stroke="#6b7280" stroke-width="2"/>
  <!-- Armor plating lines -->
  <line x1="28" y1="49" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="49" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="87" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="87" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner reinforced hex -->
  <polygon points="64,42 84,53 84,83 64,94 44,83 44,53" fill="url(#armorGrad)" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
  <!-- Corner bolts -->
  <circle cx="64" cy="30" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="100" cy="49" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="100" cy="87" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="64" cy="106" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="28" cy="87" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="28" cy="49" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <!-- Shield generators (pulsed brighter) -->
  <rect x="30" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="0.8" opacity="0.8"/>
  <circle cx="34" cy="68" r="3.5" fill="url(#shieldGlow)"/>
  <circle cx="34" cy="68" r="1.5" fill="#fbbf24" opacity="0.95"/>
  <rect x="90" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="0.8" opacity="0.8"/>
  <circle cx="94" cy="68" r="3.5" fill="url(#shieldGlow)"/>
  <circle cx="94" cy="68" r="1.5" fill="#fbbf24" opacity="0.95"/>
  <!-- Turret housing -->
  <rect x="48" y="52" width="32" height="32" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="52" y="56" width="24" height="24" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8"/>
  <!-- Twin heavy barrels -->
  <rect x="52" y="18" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="54" y="20" width="2.5" height="34" rx="1" fill="#6b7280" opacity="0.15"/>
  <rect x="69" y="18" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="71" y="20" width="2.5" height="34" rx="1" fill="#6b7280" opacity="0.15"/>
  <!-- Muzzle tips -->
  <rect x="50" y="14" width="11" height="6" rx="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="67" y="14" width="11" height="6" rx="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <!-- Energy core (brighter pulse) -->
  <circle cx="64" cy="68" r="10" fill="url(#coreGlow)" opacity="0.85"/>
  <circle cx="64" cy="68" r="5" fill="#f59e0b" opacity="0.95"/>
  <circle cx="64" cy="68" r="2.5" fill="#fef3c7"/>
  <!-- LED indicators (alternate blink) -->
  <circle cx="50" cy="55" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="78" cy="55" r="1.5" fill="#fbbf24" opacity="0.4"/>
  <circle cx="50" cy="81" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="78" cy="81" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <!-- Circuit traces (pulsed) -->
  <line x1="64" y1="42" x2="64" y2="52" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <line x1="44" y1="53" x2="48" y2="57" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <line x1="84" y1="53" x2="80" y2="57" stroke="#fbbf24" stroke-width="0.6" opacity="0.5"/>
  <line x1="44" y1="83" x2="48" y2="79" stroke="#fbbf24" stroke-width="0.5" opacity="0.35"/>
  <line x1="84" y1="83" x2="80" y2="79" stroke="#fbbf24" stroke-width="0.5" opacity="0.35"/>
</svg>
