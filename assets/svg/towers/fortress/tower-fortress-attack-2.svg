<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="baseFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="60%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="coreFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="residualGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fortress: attack-2 — cooldown, barrels retracted -->
  <!-- Shadow -->
  <ellipse cx="64" cy="100" rx="40" ry="11" fill="#0f172a" opacity="0.4"/>
  <!-- Outer hex base -->
  <polygon points="64,30 100,49 100,87 64,106 28,87 28,49" fill="url(#baseFill)" stroke="#6b7280" stroke-width="2"/>
  <!-- Armor plating -->
  <line x1="28" y1="49" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="49" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="87" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="87" x2="64" y2="68" stroke="#4b5563" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner hex -->
  <polygon points="64,42 84,53 84,83 64,94 44,83 44,53" fill="url(#armorGrad)" stroke="#fbbf24" stroke-width="0.6" opacity="0.35"/>
  <!-- Corner bolts -->
  <circle cx="64" cy="30" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="100" cy="49" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="100" cy="87" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="64" cy="106" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="28" cy="87" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="28" cy="49" r="2.5" fill="#4b5563" stroke="#6b7280" stroke-width="0.8"/>
  <!-- Shield generators (dim) -->
  <rect x="30" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="0.5" opacity="0.5"/>
  <circle cx="34" cy="68" r="2" fill="url(#shieldGlow)"/>
  <circle cx="34" cy="68" r="1" fill="#fbbf24" opacity="0.4"/>
  <rect x="90" y="58" width="8" height="20" rx="2" fill="#374151" stroke="#fbbf24" stroke-width="0.5" opacity="0.5"/>
  <circle cx="94" cy="68" r="2" fill="url(#shieldGlow)"/>
  <circle cx="94" cy="68" r="1" fill="#fbbf24" opacity="0.4"/>
  <!-- Turret housing -->
  <rect x="48" y="52" width="32" height="32" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="52" y="56" width="24" height="24" rx="2" fill="#111827" stroke="#374151" stroke-width="0.8"/>
  <!-- Twin barrels (retracted +2px from fire) -->
  <rect x="52" y="22" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="69" y="22" width="7" height="38" rx="2" fill="url(#barrelGrad)" stroke="#6b7280" stroke-width="0.5"/>
  <!-- Muzzle tips (cooling) -->
  <rect x="50" y="18" width="11" height="6" rx="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <rect x="67" y="18" width="11" height="6" rx="2" fill="#4b5563" stroke="#6b7280" stroke-width="0.5"/>
  <!-- Residual heat -->
  <circle cx="55.5" cy="16" r="3" fill="url(#residualGlow)" opacity="0.4"/>
  <circle cx="72.5" cy="16" r="3" fill="url(#residualGlow)" opacity="0.4"/>
  <!-- Energy core (depleted) -->
  <circle cx="64" cy="68" r="7" fill="url(#coreFade)" opacity="0.5"/>
  <circle cx="64" cy="68" r="3.5" fill="#f59e0b" opacity="0.4"/>
  <circle cx="64" cy="68" r="1.5" fill="#fde68a" opacity="0.5"/>
  <!-- LEDs dim -->
  <circle cx="50" cy="55" r="1.5" fill="#fbbf24" opacity="0.25"/>
  <circle cx="78" cy="55" r="1.5" fill="#fbbf24" opacity="0.25"/>
  <circle cx="50" cy="81" r="1.5" fill="#fbbf24" opacity="0.25"/>
  <circle cx="78" cy="81" r="1.5" fill="#fbbf24" opacity="0.25"/>
</svg>
