<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="steel-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="crystal-fire" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </radialGradient>
    <radialGradient id="beam-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam-out" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prism-face-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="prism-face-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- Prism: attack-1 — FIRING, max beam emission, blinding crystal -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#334155" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#64748b" stroke="#334155" stroke-width="0.8"/>
  <line x1="50" y1="68" x2="50" y2="88" stroke="#475569" stroke-width="0.6" opacity="0.5"/>
  <line x1="78" y1="68" x2="78" y2="88" stroke="#475569" stroke-width="0.6" opacity="0.5"/>

  <!-- Mounting ring (glowing) -->
  <ellipse cx="64" cy="68" rx="20" ry="6" fill="none" stroke="#ddd6fe" stroke-width="2"/>
  <ellipse cx="64" cy="68" rx="14" ry="4" fill="#8b5cf6" opacity="0.3" stroke="#c4b5fd" stroke-width="1"/>

  <!-- Central pillar (illuminated) -->
  <rect x="60" y="40" width="8" height="28" rx="1" fill="url(#steel-g)"/>
  <rect x="62" y="42" width="4" height="24" rx="0.5" fill="#c4b5fd" opacity="0.6"/>

  <!-- Triangular emitter arms (blazing) -->
  <polygon points="64,26 48,50 54,50" fill="url(#prism-face-l)" stroke="#c4b5fd" stroke-width="1.2"/>
  <polygon points="64,26 80,50 74,50" fill="url(#prism-face-r)" stroke="#c4b5fd" stroke-width="1.2"/>
  <polygon points="48,50 80,50 64,56" fill="#c4b5fd" opacity="0.5" stroke="#a78bfa" stroke-width="1"/>

  <!-- Beam emission upward (wide) -->
  <polygon points="54,18 74,18 80,2 48,2" fill="url(#beam-out)" opacity="0.7"/>
  <rect x="58" y="2" width="12" height="16" rx="2" fill="#f5f3ff" opacity="0.3"/>

  <!-- Beam side refractions -->
  <line x1="54" y1="18" x2="36" y2="6" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="74" y1="18" x2="92" y2="6" stroke="#c4b5fd" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="30" y2="14" stroke="#a78bfa" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <line x1="78" y1="20" x2="98" y2="14" stroke="#a78bfa" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>

  <!-- Crystal (blazing white) -->
  <polygon points="64,18 57,30 64,36 71,30" fill="url(#crystal-fire)" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="64" y1="18" x2="64" y2="36" stroke="#ffffff" stroke-width="1" opacity="1"/>

  <!-- Massive glow -->
  <circle cx="64" cy="28" r="24" fill="url(#beam-glow)" opacity="0.8"/>
  <circle cx="64" cy="28" r="12" fill="#f5f3ff" opacity="0.35"/>
  <circle cx="64" cy="28" r="6" fill="#ffffff" opacity="0.5"/>

  <!-- LED indicators (max) -->
  <circle cx="48" cy="80" r="3" fill="#ddd6fe" opacity="1"/>
  <circle cx="80" cy="80" r="3" fill="#ddd6fe" opacity="1"/>
  <circle cx="64" cy="94" r="3" fill="#ddd6fe" opacity="1"/>
</svg>
