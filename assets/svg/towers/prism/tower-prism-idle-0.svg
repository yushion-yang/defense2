<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="steel-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="crystal-g" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="40%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prism-face-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="prism-face-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Prism: idle-0 — Resting state, soft crystal glow -->

  <!-- Hex base platform -->
  <polygon points="64,100 89,92 89,72 64,64 39,72 39,92" fill="url(#base-g)" stroke="#334155" stroke-width="1.5"/>
  <polygon points="64,64 89,72 89,68 64,60 39,68 39,72" fill="#64748b" stroke="#334155" stroke-width="0.8"/>
  <!-- Base detail lines -->
  <line x1="50" y1="68" x2="50" y2="88" stroke="#475569" stroke-width="0.6" opacity="0.5"/>
  <line x1="78" y1="68" x2="78" y2="88" stroke="#475569" stroke-width="0.6" opacity="0.5"/>

  <!-- Mounting ring -->
  <ellipse cx="64" cy="68" rx="20" ry="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="64" cy="68" rx="14" ry="4" fill="#475569" stroke="#64748b" stroke-width="0.8"/>

  <!-- Central pillar -->
  <rect x="60" y="40" width="8" height="28" rx="1" fill="url(#steel-g)"/>
  <rect x="62" y="42" width="4" height="24" rx="0.5" fill="#e2e8f0" opacity="0.3"/>

  <!-- Triangular emitter arms -->
  <polygon points="64,26 48,50 54,50" fill="url(#prism-face-l)" stroke="#7c3aed" stroke-width="0.8"/>
  <polygon points="64,26 80,50 74,50" fill="url(#prism-face-r)" stroke="#7c3aed" stroke-width="0.8"/>
  <polygon points="48,50 80,50 64,56" fill="#8b5cf6" opacity="0.4" stroke="#7c3aed" stroke-width="0.5"/>

  <!-- Prismatic crystal -->
  <polygon points="64,18 57,30 64,36 71,30" fill="url(#crystal-g)" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="64" y1="18" x2="64" y2="36" stroke="#f5f3ff" stroke-width="0.5" opacity="0.6"/>

  <!-- Core glow (subtle) -->
  <circle cx="64" cy="28" r="14" fill="url(#core-glow)" opacity="0.4"/>

  <!-- LED indicators on base -->
  <circle cx="48" cy="80" r="2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="80" cy="80" r="2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="64" cy="94" r="2" fill="#a78bfa" opacity="0.7"/>

  <!-- Circuit lines on base -->
  <path d="M48,80 L44,76" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>
  <path d="M80,80 L84,76" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>

  <!-- Light refraction lines (faint) -->
  <line x1="57" y1="30" x2="44" y2="24" stroke="#c4b5fd" stroke-width="0.6" opacity="0.25" stroke-linecap="round"/>
  <line x1="71" y1="30" x2="84" y2="24" stroke="#c4b5fd" stroke-width="0.6" opacity="0.25" stroke-linecap="round"/>
</svg>
