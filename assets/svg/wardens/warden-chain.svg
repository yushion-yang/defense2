<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Body gradient: dark slate, fully opaque -->
    <linearGradient id="chBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Pylon metal gradient -->
    <linearGradient id="chPylon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Thruster exhaust gradient -->
    <linearGradient id="chExhaust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Subtle ambient halo -->
    <radialGradient id="chHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Filters -->
    <filter id="chGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="chGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="chGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Subtle ambient halo (decoration only) === -->
  <circle cx="64" cy="64" r="60" fill="url(#chHalo)"/>

  <!-- === Layer 1: Thruster exhaust flares (behind body) === -->
  <ellipse cx="50" cy="106" rx="7" ry="14" fill="#10b981" opacity="0.3" filter="url(#chGl)"/>
  <ellipse cx="78" cy="106" rx="7" ry="14" fill="#10b981" opacity="0.3" filter="url(#chGl)"/>

  <!-- === Layer 2: Four thick pylon arms extending from body === -->
  <!-- Top-right pylon -->
  <rect x="78" y="26" width="6" height="28" rx="3" fill="url(#chPylon)" stroke="#22c55e" stroke-width="1.5" transform="rotate(35,81,40)"/>
  <!-- Bottom-right pylon -->
  <rect x="78" y="64" width="6" height="28" rx="3" fill="url(#chPylon)" stroke="#22c55e" stroke-width="1.5" transform="rotate(-35,81,78)"/>
  <!-- Bottom-left pylon -->
  <rect x="44" y="64" width="6" height="28" rx="3" fill="url(#chPylon)" stroke="#22c55e" stroke-width="1.5" transform="rotate(35,47,78)"/>
  <!-- Top-left pylon -->
  <rect x="44" y="26" width="6" height="28" rx="3" fill="url(#chPylon)" stroke="#22c55e" stroke-width="1.5" transform="rotate(-35,47,40)"/>

  <!-- Pylon energy conduit lines (green accents along each arm) -->
  <line x1="76" y1="50" x2="96" y2="30" stroke="#4ade80" stroke-width="0.8" opacity="0.5"/>
  <line x1="76" y1="78" x2="96" y2="98" stroke="#4ade80" stroke-width="0.8" opacity="0.5"/>
  <line x1="52" y1="78" x2="32" y2="98" stroke="#4ade80" stroke-width="0.8" opacity="0.5"/>
  <line x1="52" y1="50" x2="32" y2="30" stroke="#4ade80" stroke-width="0.8" opacity="0.5"/>

  <!-- === Layer 3: Energy nodes at pylon tips (SOLID circles, not fade-to-nothing) === -->
  <!-- Top-right node -->
  <circle cx="98" cy="28" r="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="98" cy="28" r="3.5" fill="#22c55e"/>
  <circle cx="98" cy="28" r="1.8" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom-right node -->
  <circle cx="98" cy="100" r="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="98" cy="100" r="3.5" fill="#22c55e"/>
  <circle cx="98" cy="100" r="1.8" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom-left node -->
  <circle cx="30" cy="100" r="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="30" cy="100" r="3.5" fill="#22c55e"/>
  <circle cx="30" cy="100" r="1.8" fill="#ffffff" opacity="0.9"/>
  <!-- Top-left node -->
  <circle cx="30" cy="28" r="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="30" cy="28" r="3.5" fill="#22c55e"/>
  <circle cx="30" cy="28" r="1.8" fill="#ffffff" opacity="0.9"/>

  <!-- Small signal arcs at node tips (subtle decoration) -->
  <path d="M104,22 A8,8 0 0,1 104,34" fill="none" stroke="#86efac" stroke-width="0.7" opacity="0.35"/>
  <path d="M104,94 A8,8 0 0,1 104,106" fill="none" stroke="#86efac" stroke-width="0.7" opacity="0.35"/>
  <path d="M24,94 A8,8 0 0,0 24,106" fill="none" stroke="#86efac" stroke-width="0.7" opacity="0.35"/>
  <path d="M24,22 A8,8 0 0,0 24,34" fill="none" stroke="#86efac" stroke-width="0.7" opacity="0.35"/>

  <!-- === Layer 4: Main hexagonal fuselage (SOLID opaque fill) === -->
  <polygon points="64,30 84,44 84,84 64,98 44,84 44,44"
           fill="url(#chBody)" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Inner hex structural line -->
  <polygon points="64,38 78,48 78,80 64,90 50,80 50,48"
           fill="none" stroke="#10b981" stroke-width="0.6" opacity="0.3"/>

  <!-- === Layer 5: Panel seam lines on body === -->
  <line x1="64" y1="30" x2="64" y2="98" stroke="#22c55e" stroke-width="0.5" opacity="0.2"/>
  <line x1="44" y1="64" x2="84" y2="64" stroke="#22c55e" stroke-width="0.5" opacity="0.2"/>
  <line x1="44" y1="44" x2="84" y2="84" stroke="#22c55e" stroke-width="0.3" opacity="0.12"/>
  <line x1="84" y1="44" x2="44" y2="84" stroke="#22c55e" stroke-width="0.3" opacity="0.12"/>

  <!-- === Layer 6: Armor plates on fuselage === -->
  <!-- Upper left plate -->
  <polygon points="50,40 64,34 64,50 50,50" fill="#1e293b" stroke="#22c55e" stroke-width="0.6" opacity="0.5"/>
  <!-- Upper right plate -->
  <polygon points="78,40 64,34 64,50 78,50" fill="#1e293b" stroke="#22c55e" stroke-width="0.6" opacity="0.5"/>
  <!-- Lower left plate -->
  <polygon points="50,78 64,94 64,78 50,78" fill="#0f172a" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>
  <!-- Lower right plate -->
  <polygon points="78,78 64,94 64,78 78,78" fill="#0f172a" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>

  <!-- === Layer 7: Central viewport (dark circle with bright core inside) === -->
  <circle cx="64" cy="64" r="14" fill="#020617" stroke="#14b8a6" stroke-width="1"/>
  <!-- Inner containment ring -->
  <circle cx="64" cy="64" r="11" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.5"/>
  <!-- Energy core (SOLID fills, not radial-fade) -->
  <circle cx="64" cy="64" r="8" fill="#0f172a" stroke="#4ade80" stroke-width="0.6"/>
  <circle cx="64" cy="64" r="5.5" fill="#22c55e" opacity="0.8" filter="url(#chGls)"/>
  <circle cx="64" cy="64" r="3" fill="#4ade80"/>
  <circle cx="64" cy="64" r="1.5" fill="#ffffff" opacity="0.9"/>
  <!-- Viewport reflection highlight -->
  <ellipse cx="60" cy="59" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.12"/>

  <!-- === Layer 8: Twin rear thruster units === -->
  <rect x="44" y="88" width="12" height="16" rx="4" fill="#020617" stroke="#22c55e" stroke-width="1"/>
  <rect x="72" y="88" width="12" height="16" rx="4" fill="#020617" stroke="#22c55e" stroke-width="1"/>
  <!-- Thruster nozzle glow -->
  <ellipse cx="50" cy="104" rx="4.5" ry="3" fill="#4ade80" filter="url(#chGls)"/>
  <ellipse cx="50" cy="104" rx="2" ry="1.5" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="78" cy="104" rx="4.5" ry="3" fill="#4ade80" filter="url(#chGls)"/>
  <ellipse cx="78" cy="104" rx="2" ry="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- === Layer 9: Front nose sensor === -->
  <polygon points="58,34 64,24 70,34" fill="#1e293b" stroke="#22c55e" stroke-width="0.8"/>
  <!-- Front nav light -->
  <circle cx="64" cy="28" r="2" fill="#22c55e" filter="url(#chGls)"/>

  <!-- === Layer 10: Status indicator lights on body edges === -->
  <circle cx="44" cy="44" r="1.5" fill="#22c55e" opacity="0.8" filter="url(#chGlt)"/>
  <circle cx="84" cy="44" r="1.5" fill="#22c55e" opacity="0.8" filter="url(#chGlt)"/>
  <circle cx="84" cy="84" r="1.5" fill="#ef4444" opacity="0.7" filter="url(#chGlt)"/>
  <circle cx="44" cy="84" r="1.5" fill="#ef4444" opacity="0.7" filter="url(#chGlt)"/>
</svg>
