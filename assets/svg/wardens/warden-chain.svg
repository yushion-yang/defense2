<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Body gradient: dark slate -->
    <linearGradient id="chBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Energy core gradient: teal center -->
    <radialGradient id="chCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#a7f3d0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient halo -->
    <radialGradient id="chHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Relay node glow -->
    <radialGradient id="chNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#4ade80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <!-- Dome gradient for core viewport -->
    <radialGradient id="chDome" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </radialGradient>
    <!-- Thruster glow -->
    <radialGradient id="chThruster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- Filters -->
    <filter id="chGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="chGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="chGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Ambient energy halo === -->
  <circle cx="64" cy="64" r="60" fill="url(#chHalo)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#22c55e" stroke-width="0.4" opacity="0.12" stroke-dasharray="2 5"/>

  <!-- === Layer 1: Signal wave arcs from relay nodes === -->
  <!-- Top-right node arcs -->
  <path d="M94,28 A8,8 0 0,1 100,36" fill="none" stroke="#86efac" stroke-width="0.8" opacity="0.3"/>
  <path d="M96,24 A12,12 0 0,1 104,36" fill="none" stroke="#86efac" stroke-width="0.5" opacity="0.2"/>
  <!-- Bottom-right node arcs -->
  <path d="M100,92 A8,8 0 0,1 94,100" fill="none" stroke="#86efac" stroke-width="0.8" opacity="0.3"/>
  <path d="M104,92 A12,12 0 0,1 96,104" fill="none" stroke="#86efac" stroke-width="0.5" opacity="0.2"/>
  <!-- Bottom-left node arcs -->
  <path d="M34,100 A8,8 0 0,1 28,92" fill="none" stroke="#86efac" stroke-width="0.8" opacity="0.3"/>
  <path d="M32,104 A12,12 0 0,1 24,92" fill="none" stroke="#86efac" stroke-width="0.5" opacity="0.2"/>
  <!-- Top-left node arcs -->
  <path d="M28,36 A8,8 0 0,1 34,28" fill="none" stroke="#86efac" stroke-width="0.8" opacity="0.3"/>
  <path d="M24,36 A12,12 0 0,1 32,24" fill="none" stroke="#86efac" stroke-width="0.5" opacity="0.2"/>

  <!-- === Layer 2: Relay arms (4 diagonal beams) === -->
  <!-- Top-right arm -->
  <line x1="76" y1="52" x2="92" y2="36" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="52" x2="92" y2="36" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <!-- Bottom-right arm -->
  <line x1="76" y1="76" x2="92" y2="92" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="76" y1="76" x2="92" y2="92" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <!-- Bottom-left arm -->
  <line x1="52" y1="76" x2="36" y2="92" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="76" x2="36" y2="92" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <!-- Top-left arm -->
  <line x1="52" y1="52" x2="36" y2="36" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="52" x2="36" y2="36" stroke="#22c55e" stroke-width="1" opacity="0.4"/>

  <!-- === Layer 3: Energy conduit lines along arms (pulsing effect) === -->
  <line x1="74" y1="54" x2="90" y2="38" stroke="#4ade80" stroke-width="0.6" opacity="0.35" stroke-dasharray="3 2"/>
  <line x1="74" y1="74" x2="90" y2="90" stroke="#4ade80" stroke-width="0.6" opacity="0.35" stroke-dasharray="3 2"/>
  <line x1="54" y1="74" x2="38" y2="90" stroke="#4ade80" stroke-width="0.6" opacity="0.35" stroke-dasharray="3 2"/>
  <line x1="54" y1="54" x2="38" y2="38" stroke="#4ade80" stroke-width="0.6" opacity="0.35" stroke-dasharray="3 2"/>

  <!-- === Layer 4: Relay receptor nodes at arm tips === -->
  <!-- Top-right node -->
  <circle cx="94" cy="34" r="6" fill="url(#chNode)" filter="url(#chGls)"/>
  <circle cx="94" cy="34" r="3.5" fill="#4ade80" opacity="0.6"/>
  <circle cx="94" cy="34" r="1.8" fill="#ffffff" opacity="0.7"/>
  <!-- Bottom-right node -->
  <circle cx="94" cy="94" r="6" fill="url(#chNode)" filter="url(#chGls)"/>
  <circle cx="94" cy="94" r="3.5" fill="#4ade80" opacity="0.6"/>
  <circle cx="94" cy="94" r="1.8" fill="#ffffff" opacity="0.7"/>
  <!-- Bottom-left node -->
  <circle cx="34" cy="94" r="6" fill="url(#chNode)" filter="url(#chGls)"/>
  <circle cx="34" cy="94" r="3.5" fill="#4ade80" opacity="0.6"/>
  <circle cx="34" cy="94" r="1.8" fill="#ffffff" opacity="0.7"/>
  <!-- Top-left node -->
  <circle cx="34" cy="34" r="6" fill="url(#chNode)" filter="url(#chGls)"/>
  <circle cx="34" cy="34" r="3.5" fill="#4ade80" opacity="0.6"/>
  <circle cx="34" cy="34" r="1.8" fill="#ffffff" opacity="0.7"/>

  <!-- === Layer 5: Central octagonal body === -->
  <polygon points="64,42 80,48 86,64 80,80 64,86 48,80 42,64 48,48"
           fill="url(#chBody)" stroke="#22c55e" stroke-width="1.2"/>
  <!-- Inner structural panels -->
  <polygon points="64,46 76,51 81,64 76,77 64,82 52,77 47,64 52,51"
           fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.25"/>
  <!-- Panel seam lines -->
  <line x1="64" y1="42" x2="64" y2="86" stroke="#22c55e" stroke-width="0.4" opacity="0.15"/>
  <line x1="42" y1="64" x2="86" y2="64" stroke="#22c55e" stroke-width="0.4" opacity="0.15"/>

  <!-- === Layer 6: Stabilizer fins / thrusters at 4 cardinal points === -->
  <!-- Top stabilizer fin -->
  <polygon points="58,44 64,34 70,44" fill="#1e293b" stroke="#10b981" stroke-width="0.6"/>
  <circle cx="64" cy="38" r="1.5" fill="url(#chThruster)" filter="url(#chGlt)"/>
  <!-- Right stabilizer fin -->
  <polygon points="84,58 94,64 84,70" fill="#1e293b" stroke="#10b981" stroke-width="0.6"/>
  <circle cx="90" cy="64" r="1.5" fill="url(#chThruster)" filter="url(#chGlt)"/>
  <!-- Bottom stabilizer fin -->
  <polygon points="58,84 64,94 70,84" fill="#1e293b" stroke="#10b981" stroke-width="0.6"/>
  <circle cx="64" cy="90" r="1.5" fill="url(#chThruster)" filter="url(#chGlt)"/>
  <!-- Left stabilizer fin -->
  <polygon points="44,58 34,64 44,70" fill="#1e293b" stroke="#10b981" stroke-width="0.6"/>
  <circle cx="38" cy="64" r="1.5" fill="url(#chThruster)" filter="url(#chGlt)"/>

  <!-- === Layer 7: Core dome (transparent viewport) === -->
  <circle cx="64" cy="64" r="14" fill="url(#chDome)" stroke="#14b8a6" stroke-width="0.8" opacity="0.7"/>
  <!-- Dome reflection -->
  <ellipse cx="60" cy="58" rx="4" ry="3" fill="#14b8a6" opacity="0.12"/>

  <!-- === Layer 8: Energy core (teal-green glow) === -->
  <circle cx="64" cy="64" r="10" fill="url(#chCore)" filter="url(#chGl)"/>
  <circle cx="64" cy="64" r="6.5" fill="#a7f3d0" opacity="0.6"/>
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" opacity="0.85"/>
  <!-- Containment rings -->
  <circle cx="64" cy="64" r="12" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.4"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#14b8a6" stroke-width="0.4" opacity="0.18" stroke-dasharray="2 3"/>

  <!-- === Layer 9: Energy conduit lines from core to arm bases === -->
  <line x1="72" y1="56" x2="76" y2="52" stroke="#4ade80" stroke-width="0.8" opacity="0.35"/>
  <line x1="72" y1="72" x2="76" y2="76" stroke="#4ade80" stroke-width="0.8" opacity="0.35"/>
  <line x1="56" y1="72" x2="52" y2="76" stroke="#4ade80" stroke-width="0.8" opacity="0.35"/>
  <line x1="56" y1="56" x2="52" y2="52" stroke="#4ade80" stroke-width="0.8" opacity="0.35"/>

  <!-- === Layer 10: Status indicator lights on body === -->
  <!-- Top-right body edge -->
  <circle cx="78" cy="50" r="1.2" fill="#22c55e" opacity="0.6" filter="url(#chGlt)"/>
  <!-- Bottom-right body edge -->
  <circle cx="84" cy="76" r="1.2" fill="#22c55e" opacity="0.6" filter="url(#chGlt)"/>
  <!-- Bottom-left body edge -->
  <circle cx="50" cy="78" r="1.2" fill="#22c55e" opacity="0.6" filter="url(#chGlt)"/>
  <!-- Top-left body edge -->
  <circle cx="44" cy="50" r="1.2" fill="#22c55e" opacity="0.6" filter="url(#chGlt)"/>

  <!-- === Layer 11: Ambient energy particles === -->
  <circle cx="104" cy="50" r="0.8" fill="#86efac" opacity="0.3" filter="url(#chGlt)"/>
  <circle cx="24" cy="50" r="0.8" fill="#86efac" opacity="0.3" filter="url(#chGlt)"/>
  <circle cx="104" cy="78" r="0.8" fill="#86efac" opacity="0.3" filter="url(#chGlt)"/>
  <circle cx="24" cy="78" r="0.8" fill="#86efac" opacity="0.3" filter="url(#chGlt)"/>
  <circle cx="64" cy="20" r="0.6" fill="#4ade80" opacity="0.25" filter="url(#chGlt)"/>
  <circle cx="64" cy="108" r="0.6" fill="#4ade80" opacity="0.25" filter="url(#chGlt)"/>
</svg>
