<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Body gradient: dark gunmetal top to near-black bottom -->
    <linearGradient id="prBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <!-- Engine exhaust gradient: white-hot center to orange-red fade -->
    <radialGradient id="prExhaust" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <!-- Fire core gradient: furnace white-hot center -->
    <radialGradient id="prCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <!-- Heat distortion halo -->
    <radialGradient id="prHalo" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Cockpit HUD glow -->
    <radialGradient id="prHUD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Engine nacelle interior -->
    <radialGradient id="prNacelle" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Filters -->
    <filter id="prGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="prGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="prGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Heat distortion halo === -->
  <circle cx="64" cy="54" r="60" fill="url(#prHalo)"/>
  <circle cx="64" cy="54" r="54" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.15" stroke-dasharray="2 5"/>
  <circle cx="64" cy="54" r="48" fill="none" stroke="#ea580c" stroke-width="0.3" opacity="0.1" stroke-dasharray="1 4"/>

  <!-- === Layer 1: Plasma engine exhaust plumes === -->
  <!-- Left engine plume -->
  <ellipse cx="34" cy="88" rx="8" ry="22" fill="url(#prExhaust)"/>
  <ellipse cx="34" cy="90" rx="4" ry="14" fill="#fbbf24" opacity="0.5" filter="url(#prGl)"/>
  <ellipse cx="34" cy="92" rx="2" ry="8" fill="#fef3c7" opacity="0.4" filter="url(#prGls)"/>
  <!-- Right engine plume -->
  <ellipse cx="94" cy="88" rx="8" ry="22" fill="url(#prExhaust)"/>
  <ellipse cx="94" cy="90" rx="4" ry="14" fill="#fbbf24" opacity="0.5" filter="url(#prGl)"/>
  <ellipse cx="94" cy="92" rx="2" ry="8" fill="#fef3c7" opacity="0.4" filter="url(#prGls)"/>

  <!-- === Layer 2: Main flying wing body (B-2 silhouette) === -->
  <!-- Wide swept flying wing: nose at top, trailing edge at bottom, broad wingspan -->
  <path d="M64,14 L10,62 L18,68 L30,72 L46,78 L54,82 L64,80 L74,82 L82,78 L98,72 L110,68 L118,62 Z"
        fill="url(#prBody)" stroke="#ea580c" stroke-width="1.2"/>
  <!-- Center spine line -->
  <line x1="64" y1="18" x2="64" y2="76" stroke="#f97316" stroke-width="0.6" opacity="0.15"/>

  <!-- === Layer 3: Wing surface panel lines (structural detail) === -->
  <!-- Left wing panels -->
  <line x1="38" y1="38" x2="14" y2="62" stroke="#ea580c" stroke-width="0.5" opacity="0.25"/>
  <line x1="44" y1="44" x2="22" y2="66" stroke="#ea580c" stroke-width="0.4" opacity="0.18"/>
  <line x1="50" y1="50" x2="34" y2="70" stroke="#ea580c" stroke-width="0.3" opacity="0.15"/>
  <!-- Right wing panels -->
  <line x1="90" y1="38" x2="114" y2="62" stroke="#ea580c" stroke-width="0.5" opacity="0.25"/>
  <line x1="84" y1="44" x2="106" y2="66" stroke="#ea580c" stroke-width="0.4" opacity="0.18"/>
  <line x1="78" y1="50" x2="94" y2="70" stroke="#ea580c" stroke-width="0.3" opacity="0.15"/>

  <!-- === Layer 4: Armor plating / intake panels === -->
  <!-- Left forward intake -->
  <polygon points="48,30 36,42 42,50 52,40" fill="#292524" stroke="#f97316" stroke-width="0.6" opacity="0.55"/>
  <!-- Right forward intake -->
  <polygon points="80,30 92,42 86,50 76,40" fill="#292524" stroke="#f97316" stroke-width="0.6" opacity="0.55"/>
  <!-- Left mid armor plate -->
  <polygon points="28,56 18,64 30,70 40,62" fill="#1c1917" stroke="#ea580c" stroke-width="0.4" opacity="0.4"/>
  <!-- Right mid armor plate -->
  <polygon points="100,56 110,64 98,70 88,62" fill="#1c1917" stroke="#ea580c" stroke-width="0.4" opacity="0.4"/>

  <!-- === Layer 5: Rear trailing edge / weapon bay panels === -->
  <!-- Left weapon bay -->
  <path d="M38,70 L46,78 L54,80 L50,72 Z" fill="#0c0a09" stroke="#ea580c" stroke-width="0.4" opacity="0.5"/>
  <!-- Right weapon bay -->
  <path d="M90,70 L82,78 L74,80 L78,72 Z" fill="#0c0a09" stroke="#ea580c" stroke-width="0.4" opacity="0.5"/>
  <!-- Bay indicator lights -->
  <circle cx="46" cy="74" r="1" fill="#ef4444" opacity="0.5" filter="url(#prGlt)"/>
  <circle cx="82" cy="74" r="1" fill="#ef4444" opacity="0.5" filter="url(#prGlt)"/>

  <!-- === Layer 6: Engine nacelles (rear trailing edge) === -->
  <!-- Left nacelle housing -->
  <rect x="27" y="68" width="14" height="12" rx="3" fill="#0c0a09" stroke="#ea580c" stroke-width="0.8"/>
  <ellipse cx="34" cy="74" rx="5" ry="4" fill="url(#prNacelle)"/>
  <ellipse cx="34" cy="76" rx="3.5" ry="2.5" fill="#fbbf24" opacity="0.6" filter="url(#prGls)"/>
  <!-- Right nacelle housing -->
  <rect x="87" y="68" width="14" height="12" rx="3" fill="#0c0a09" stroke="#ea580c" stroke-width="0.8"/>
  <ellipse cx="94" cy="74" rx="5" ry="4" fill="url(#prNacelle)"/>
  <ellipse cx="94" cy="76" rx="3.5" ry="2.5" fill="#fbbf24" opacity="0.6" filter="url(#prGls)"/>

  <!-- === Layer 7: Fire core viewport (central furnace) === -->
  <!-- Viewport housing -->
  <ellipse cx="64" cy="52" rx="10" ry="8" fill="#0c0a09" stroke="#f97316" stroke-width="1" opacity="0.8"/>
  <!-- Fire core glow -->
  <ellipse cx="64" cy="52" rx="8" ry="6.5" fill="url(#prCore)" filter="url(#prGl)"/>
  <ellipse cx="64" cy="51" rx="5" ry="4" fill="#fef3c7" opacity="0.65"/>
  <ellipse cx="64" cy="50" rx="2.5" ry="2" fill="#ffffff" opacity="0.85"/>
  <!-- Containment ring -->
  <ellipse cx="64" cy="52" rx="12" ry="9.5" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="64" cy="52" rx="14" ry="11" fill="none" stroke="#ea580c" stroke-width="0.4" opacity="0.18" stroke-dasharray="2 3"/>

  <!-- === Layer 8: Cockpit sensor dome === -->
  <ellipse cx="64" cy="28" rx="8" ry="12" fill="#1c1917" stroke="#f97316" stroke-width="0.8"/>
  <!-- HUD glow inside cockpit -->
  <ellipse cx="64" cy="26" rx="5.5" ry="8" fill="url(#prHUD)"/>
  <ellipse cx="64" cy="24" rx="3" ry="5" fill="#f97316" opacity="0.35"/>
  <!-- Cockpit reflection highlight -->
  <ellipse cx="62" cy="22" rx="1.5" ry="3" fill="#fbbf24" opacity="0.2"/>

  <!-- === Layer 9: Orange accent energy conduits === -->
  <!-- Left conduit: core to left engine -->
  <line x1="54" y1="52" x2="40" y2="68" stroke="#f97316" stroke-width="0.8" opacity="0.3"/>
  <line x1="56" y1="50" x2="44" y2="64" stroke="#ea580c" stroke-width="0.5" opacity="0.2"/>
  <!-- Right conduit: core to right engine -->
  <line x1="74" y1="52" x2="88" y2="68" stroke="#f97316" stroke-width="0.8" opacity="0.3"/>
  <line x1="72" y1="50" x2="84" y2="64" stroke="#ea580c" stroke-width="0.5" opacity="0.2"/>
  <!-- Forward conduits: core to cockpit -->
  <line x1="60" y1="44" x2="60" y2="36" stroke="#f97316" stroke-width="0.5" opacity="0.2"/>
  <line x1="68" y1="44" x2="68" y2="36" stroke="#f97316" stroke-width="0.5" opacity="0.2"/>

  <!-- === Layer 10: Wingtip emitters (nav lights) === -->
  <!-- Left wingtip - orange glow -->
  <circle cx="12" cy="63" r="2.5" fill="#f97316" filter="url(#prGl)"/>
  <circle cx="12" cy="63" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <!-- Right wingtip - orange glow -->
  <circle cx="116" cy="63" r="2.5" fill="#f97316" filter="url(#prGl)"/>
  <circle cx="116" cy="63" r="1.2" fill="#fbbf24" opacity="0.8"/>

  <!-- === Layer 11: Surface heat shimmer particles === -->
  <circle cx="30" cy="50" r="1" fill="#f97316" opacity="0.35" filter="url(#prGlt)"/>
  <circle cx="98" cy="50" r="1" fill="#f97316" opacity="0.35" filter="url(#prGlt)"/>
  <circle cx="50" cy="66" r="0.8" fill="#fbbf24" opacity="0.3" filter="url(#prGlt)"/>
  <circle cx="78" cy="66" r="0.8" fill="#fbbf24" opacity="0.3" filter="url(#prGlt)"/>
  <circle cx="64" cy="72" r="0.8" fill="#ea580c" opacity="0.25" filter="url(#prGlt)"/>
</svg>
