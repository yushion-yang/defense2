<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Body gradient: warm dark, fully opaque -->
    <linearGradient id="evBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <!-- Wing gradient -->
    <linearGradient id="evWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <!-- Canopy gradient: dark with gold tint -->
    <linearGradient id="evCanopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <!-- Engine nacelle gradient -->
    <linearGradient id="evNacelle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <!-- Subtle ambient halo -->
    <radialGradient id="evHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Filters -->
    <filter id="evGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="evGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="evGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Subtle ambient halo (decoration only) === -->
  <circle cx="64" cy="60" r="58" fill="url(#evHalo)"/>

  <!-- === Layer 1: Engine exhaust flares (behind body) === -->
  <ellipse cx="42" cy="104" rx="8" ry="16" fill="#f59e0b" opacity="0.25" filter="url(#evGl)"/>
  <ellipse cx="86" cy="104" rx="8" ry="16" fill="#f59e0b" opacity="0.25" filter="url(#evGl)"/>

  <!-- === Layer 2: Antenna mast + dish (on top of fuselage) === -->
  <!-- Antenna mast -->
  <rect x="62" y="20" width="4" height="24" rx="2" fill="#44403c" stroke="#ca8a04" stroke-width="0.8"/>
  <!-- Mast accent line -->
  <line x1="64" y1="22" x2="64" y2="42" stroke="#eab308" stroke-width="0.6" opacity="0.4"/>
  <!-- Dish support struts -->
  <line x1="54" y1="28" x2="64" y2="34" stroke="#44403c" stroke-width="1.5"/>
  <line x1="74" y1="28" x2="64" y2="34" stroke="#44403c" stroke-width="1.5"/>
  <!-- Dish (solid ellipse, NOT transparent) -->
  <ellipse cx="64" cy="24" rx="16" ry="6" fill="#44403c" stroke="#eab308" stroke-width="1.2"/>
  <!-- Dish surface detail rings -->
  <ellipse cx="64" cy="24" rx="11" ry="4" fill="none" stroke="#ca8a04" stroke-width="0.5" opacity="0.5"/>
  <ellipse cx="64" cy="24" rx="6" ry="2.5" fill="none" stroke="#ca8a04" stroke-width="0.4" opacity="0.4"/>
  <!-- Dish center receiver (solid) -->
  <ellipse cx="64" cy="24" rx="3" ry="1.5" fill="#eab308"/>
  <ellipse cx="64" cy="24" rx="1.2" ry="0.7" fill="#fde047" filter="url(#evGlt)"/>
  <!-- Dish highlight arc -->
  <path d="M50,23 A16,6 0 0,1 78,23" fill="none" stroke="#fde047" stroke-width="0.5" opacity="0.3"/>

  <!-- === Layer 3: Short swept wings/stabilizers (SOLID polygons) === -->
  <!-- Left wing -->
  <polygon points="38,52 6,74 14,66 32,46" fill="#44403c" stroke="#eab308" stroke-width="1.2"/>
  <!-- Left wing surface line -->
  <line x1="22" y1="62" x2="32" y2="48" stroke="#ca8a04" stroke-width="0.5" opacity="0.3"/>
  <!-- Right wing -->
  <polygon points="90,52 122,74 114,66 96,46" fill="#44403c" stroke="#eab308" stroke-width="1.2"/>
  <!-- Right wing surface line -->
  <line x1="106" y1="62" x2="96" y2="48" stroke="#ca8a04" stroke-width="0.5" opacity="0.3"/>

  <!-- === Layer 4: Weapon/sensor pods under wings === -->
  <rect x="14" y="66" width="14" height="4" rx="1.5" fill="#292524" stroke="#eab308" stroke-width="0.6"/>
  <circle cx="18" cy="68" r="1.5" fill="#ef4444" filter="url(#evGlt)"/>
  <circle cx="24" cy="68" r="1.5" fill="#ef4444" filter="url(#evGlt)"/>
  <rect x="100" y="66" width="14" height="4" rx="1.5" fill="#292524" stroke="#eab308" stroke-width="0.6"/>
  <circle cx="104" cy="68" r="1.5" fill="#ef4444" filter="url(#evGlt)"/>
  <circle cx="110" cy="68" r="1.5" fill="#ef4444" filter="url(#evGlt)"/>

  <!-- === Layer 5: Main fuselage (SOLID polygon, wider at rear, tapered at front) === -->
  <polygon points="64,18 46,44 42,58 42,86 52,96 76,96 86,86 86,58 82,44"
           fill="url(#evBody)" stroke="#eab308" stroke-width="1.5"/>
  <!-- Center spine -->
  <line x1="64" y1="22" x2="64" y2="92" stroke="#ca8a04" stroke-width="0.6" opacity="0.2"/>

  <!-- === Layer 6: Fuselage armor panels === -->
  <!-- Upper left panel -->
  <polygon points="52,36 64,22 64,48 48,48" fill="#292524" stroke="#eab308" stroke-width="0.6" opacity="0.5"/>
  <!-- Upper right panel -->
  <polygon points="76,36 64,22 64,48 80,48" fill="#292524" stroke="#eab308" stroke-width="0.6" opacity="0.5"/>
  <!-- Lower left plate -->
  <polygon points="44,68 44,82 56,82 56,68" fill="#1c1917" stroke="#ca8a04" stroke-width="0.5" opacity="0.4"/>
  <!-- Lower right plate -->
  <polygon points="84,68 84,82 72,82 72,68" fill="#1c1917" stroke="#ca8a04" stroke-width="0.5" opacity="0.4"/>

  <!-- Gold accent stripes along hull panels -->
  <line x1="46" y1="50" x2="46" y2="82" stroke="#eab308" stroke-width="1" opacity="0.35"/>
  <line x1="82" y1="50" x2="82" y2="82" stroke="#eab308" stroke-width="1" opacity="0.35"/>
  <!-- Horizontal panel seams -->
  <line x1="44" y1="58" x2="84" y2="58" stroke="#ca8a04" stroke-width="0.4" opacity="0.2"/>
  <line x1="44" y1="74" x2="84" y2="74" stroke="#ca8a04" stroke-width="0.4" opacity="0.2"/>

  <!-- === Layer 7: Cockpit canopy at front (SOLID dark fill with gold tint) === -->
  <ellipse cx="64" cy="32" rx="10" ry="14" fill="url(#evCanopy)" stroke="#eab308" stroke-width="1"/>
  <!-- Canopy glass layers (solid, not transparent) -->
  <ellipse cx="64" cy="30" rx="6.5" ry="9" fill="#422006" opacity="0.7"/>
  <ellipse cx="64" cy="28" rx="3.5" ry="5.5" fill="#78350f" opacity="0.4"/>
  <!-- Canopy reflection -->
  <ellipse cx="62" cy="26" rx="1.8" ry="3" fill="#ffffff" opacity="0.15"/>

  <!-- === Layer 8: Chest viewport with golden energy core === -->
  <ellipse cx="64" cy="60" rx="10" ry="8" fill="#0c0a09" stroke="#eab308" stroke-width="1"/>
  <!-- Containment ring -->
  <ellipse cx="64" cy="60" rx="7.5" ry="6" fill="none" stroke="#ca8a04" stroke-width="0.6" opacity="0.5"/>
  <!-- Energy core (SOLID fills) -->
  <ellipse cx="64" cy="60" rx="5.5" ry="4.5" fill="#92400e" stroke="#eab308" stroke-width="0.5"/>
  <ellipse cx="64" cy="60" rx="3.5" ry="2.8" fill="#eab308" filter="url(#evGls)"/>
  <ellipse cx="64" cy="60" rx="2" ry="1.6" fill="#fbbf24"/>
  <ellipse cx="64" cy="60" rx="0.8" ry="0.6" fill="#ffffff" opacity="0.9"/>
  <!-- Core viewport reflection -->
  <ellipse cx="61" cy="57" rx="1.5" ry="1" fill="#ffffff" opacity="0.1"/>

  <!-- === Layer 9: Twin engine nacelles at rear === -->
  <!-- Left nacelle -->
  <rect x="36" y="82" width="14" height="20" rx="5" fill="url(#evNacelle)" stroke="#eab308" stroke-width="1"/>
  <!-- Left exhaust nozzle -->
  <ellipse cx="43" cy="102" rx="5.5" ry="3.5" fill="#f59e0b" filter="url(#evGls)"/>
  <ellipse cx="43" cy="102" rx="2.5" ry="1.5" fill="#fde047"/>
  <ellipse cx="43" cy="102" rx="1" ry="0.6" fill="#ffffff" opacity="0.8"/>
  <!-- Right nacelle -->
  <rect x="78" y="82" width="14" height="20" rx="5" fill="url(#evNacelle)" stroke="#eab308" stroke-width="1"/>
  <!-- Right exhaust nozzle -->
  <ellipse cx="85" cy="102" rx="5.5" ry="3.5" fill="#f59e0b" filter="url(#evGls)"/>
  <ellipse cx="85" cy="102" rx="2.5" ry="1.5" fill="#fde047"/>
  <ellipse cx="85" cy="102" rx="1" ry="0.6" fill="#ffffff" opacity="0.8"/>

  <!-- === Layer 10: Nav lights === -->
  <!-- Wing tip nav lights -->
  <circle cx="8" cy="73" r="2.5" fill="#ef4444" filter="url(#evGls)"/>
  <circle cx="120" cy="73" r="2.5" fill="#22c55e" filter="url(#evGls)"/>
  <!-- Front nav light -->
  <circle cx="64" cy="20" r="1.8" fill="#eab308" filter="url(#evGlt)"/>
  <!-- Rear nav lights -->
  <circle cx="52" cy="96" r="1.5" fill="#ef4444" opacity="0.7" filter="url(#evGlt)"/>
  <circle cx="76" cy="96" r="1.5" fill="#ef4444" opacity="0.7" filter="url(#evGlt)"/>

  <!-- === Layer 11: Hull detail accents === -->
  <!-- Small observation windows along fuselage sides -->
  <rect x="47" y="54" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#ca8a04" stroke-width="0.4" opacity="0.6"/>
  <rect x="47" y="64" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#ca8a04" stroke-width="0.4" opacity="0.6"/>
  <rect x="78" y="54" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#ca8a04" stroke-width="0.4" opacity="0.6"/>
  <rect x="78" y="64" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#ca8a04" stroke-width="0.4" opacity="0.6"/>

  <!-- === Layer 12: Energy conduits from core to antenna === -->
  <line x1="60" y1="54" x2="60" y2="44" stroke="#eab308" stroke-width="0.8" opacity="0.35"/>
  <line x1="68" y1="54" x2="68" y2="44" stroke="#eab308" stroke-width="0.8" opacity="0.35"/>
</svg>
