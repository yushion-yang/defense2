<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Disc body gradient: warm dark gray -->
    <linearGradient id="evBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <!-- Disc top plate -->
    <linearGradient id="evTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <!-- Gold energy core -->
    <radialGradient id="evCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <!-- Antenna dish gradient -->
    <radialGradient id="evDish" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Thruster glow -->
    <radialGradient id="evThruster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Ambient halo -->
    <radialGradient id="evHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#292524" stop-opacity="0"/>
    </radialGradient>
    <!-- Viewport lens -->
    <radialGradient id="evLens" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Filters -->
    <filter id="evGl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="evGls"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="evGlt"><feGaussianBlur stdDeviation="0.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- === Layer 0: Ambient halo === -->
  <circle cx="64" cy="68" r="58" fill="url(#evHalo)"/>

  <!-- === Layer 1: Signal broadcast rings (emanating upward from antenna) === -->
  <ellipse cx="64" cy="30" rx="30" ry="8" fill="none" stroke="#fde047" stroke-width="0.6" opacity="0.15"/>
  <ellipse cx="64" cy="24" rx="38" ry="10" fill="none" stroke="#fde047" stroke-width="0.5" opacity="0.1"/>
  <ellipse cx="64" cy="18" rx="46" ry="12" fill="none" stroke="#fde047" stroke-width="0.4" opacity="0.07"/>
  <!-- Signal pulse arcs (partial arcs for broadcast feel) -->
  <path d="M44,34 A24,7 0 0,1 84,34" fill="none" stroke="#eab308" stroke-width="0.8" opacity="0.25"/>
  <path d="M38,28 A30,8 0 0,1 90,28" fill="none" stroke="#eab308" stroke-width="0.6" opacity="0.18"/>
  <path d="M32,22 A36,10 0 0,1 96,22" fill="none" stroke="#eab308" stroke-width="0.5" opacity="0.12"/>

  <!-- === Layer 2: Antenna mast and dish === -->
  <!-- Antenna mast (vertical from body center up) -->
  <line x1="64" y1="52" x2="64" y2="36" stroke="#44403c" stroke-width="2.5"/>
  <line x1="64" y1="52" x2="64" y2="36" stroke="#ca8a04" stroke-width="0.6" opacity="0.5"/>
  <!-- Dish base mount -->
  <ellipse cx="64" cy="38" rx="3" ry="1.5" fill="#44403c" stroke="#d97706" stroke-width="0.5"/>
  <!-- Rotating sensor dish (tilted circular dish) -->
  <ellipse cx="64" cy="34" rx="14" ry="6" fill="url(#evDish)" stroke="#d97706" stroke-width="1"/>
  <!-- Dish surface detail: concentric rings -->
  <ellipse cx="64" cy="34" rx="10" ry="4" fill="none" stroke="#eab308" stroke-width="0.4" opacity="0.4"/>
  <ellipse cx="64" cy="34" rx="6" ry="2.5" fill="none" stroke="#eab308" stroke-width="0.3" opacity="0.3"/>
  <!-- Dish center receiver -->
  <ellipse cx="64" cy="34" rx="2.5" ry="1.2" fill="#eab308" opacity="0.8"/>
  <ellipse cx="64" cy="34" rx="1" ry="0.5" fill="#fde047" opacity="0.9" filter="url(#evGlt)"/>
  <!-- Dish rim highlight -->
  <path d="M50,34 A14,6 0 0,1 78,34" fill="none" stroke="#fde047" stroke-width="0.4" opacity="0.3"/>

  <!-- === Layer 3: Main disc body (flattened oval, command center) === -->
  <!-- Disc shadow/depth (lower ellipse, darker) -->
  <ellipse cx="64" cy="72" rx="36" ry="12" fill="#1c1917" opacity="0.6"/>
  <!-- Main disc body -->
  <ellipse cx="64" cy="66" rx="36" ry="14" fill="url(#evBody)" stroke="#44403c" stroke-width="1"/>
  <!-- Top surface plate -->
  <ellipse cx="64" cy="62" rx="32" ry="10" fill="url(#evTop)" stroke="#57534e" stroke-width="0.5" opacity="0.8"/>
  <!-- Gold accent rim line -->
  <ellipse cx="64" cy="66" rx="36" ry="14" fill="none" stroke="#ca8a04" stroke-width="0.8" opacity="0.6"/>
  <!-- Inner accent ring -->
  <ellipse cx="64" cy="66" rx="28" ry="10" fill="none" stroke="#eab308" stroke-width="0.4" opacity="0.3"/>

  <!-- === Layer 4: Surface panel lines and details === -->
  <!-- Radial panel lines (8 directions from center) -->
  <line x1="64" y1="56" x2="64" y2="52" stroke="#ca8a04" stroke-width="0.4" opacity="0.4"/>
  <line x1="64" y1="76" x2="64" y2="80" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <line x1="36" y1="62" x2="30" y2="64" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <line x1="92" y1="62" x2="98" y2="64" stroke="#ca8a04" stroke-width="0.4" opacity="0.3"/>
  <!-- Diagonal conduit lines from core to antenna -->
  <line x1="60" y1="58" x2="58" y2="44" stroke="#eab308" stroke-width="0.5" opacity="0.3"/>
  <line x1="68" y1="58" x2="70" y2="44" stroke="#eab308" stroke-width="0.5" opacity="0.3"/>
  <!-- Data link energy pulses along conduits -->
  <circle cx="59" cy="50" r="0.8" fill="#fde047" opacity="0.5" filter="url(#evGlt)"/>
  <circle cx="69" cy="52" r="0.8" fill="#fde047" opacity="0.4" filter="url(#evGlt)"/>

  <!-- === Layer 5: Communication LED lights along the rim === -->
  <!-- Top arc LEDs -->
  <circle cx="40" cy="58" r="1" fill="#eab308" opacity="0.7" filter="url(#evGlt)"/>
  <circle cx="50" cy="55" r="0.8" fill="#fbbf24" opacity="0.6" filter="url(#evGlt)"/>
  <circle cx="78" cy="55" r="0.8" fill="#fbbf24" opacity="0.6" filter="url(#evGlt)"/>
  <circle cx="88" cy="58" r="1" fill="#eab308" opacity="0.7" filter="url(#evGlt)"/>
  <!-- Bottom arc LEDs -->
  <circle cx="44" cy="74" r="0.8" fill="#eab308" opacity="0.5" filter="url(#evGlt)"/>
  <circle cx="56" cy="76" r="0.7" fill="#fbbf24" opacity="0.45" filter="url(#evGlt)"/>
  <circle cx="72" cy="76" r="0.7" fill="#fbbf24" opacity="0.45" filter="url(#evGlt)"/>
  <circle cx="84" cy="74" r="0.8" fill="#eab308" opacity="0.5" filter="url(#evGlt)"/>
  <!-- Side LEDs -->
  <circle cx="30" cy="64" r="0.8" fill="#d97706" opacity="0.5" filter="url(#evGlt)"/>
  <circle cx="98" cy="64" r="0.8" fill="#d97706" opacity="0.5" filter="url(#evGlt)"/>

  <!-- === Layer 6: 4 thruster pods around perimeter === -->
  <!-- Front thruster -->
  <ellipse cx="64" cy="54" rx="4" ry="2.5" fill="#292524" stroke="#d97706" stroke-width="0.6"/>
  <ellipse cx="64" cy="54" rx="2.5" ry="1.5" fill="url(#evThruster)" filter="url(#evGlt)"/>
  <ellipse cx="64" cy="54" rx="1" ry="0.6" fill="#fde047" opacity="0.8"/>
  <!-- Rear thruster -->
  <ellipse cx="64" cy="78" rx="4" ry="2.5" fill="#292524" stroke="#d97706" stroke-width="0.6"/>
  <ellipse cx="64" cy="78" rx="2.5" ry="1.5" fill="url(#evThruster)" filter="url(#evGlt)"/>
  <ellipse cx="64" cy="78" rx="1" ry="0.6" fill="#fde047" opacity="0.8"/>
  <!-- Left thruster -->
  <ellipse cx="32" cy="66" rx="3" ry="2.5" fill="#292524" stroke="#d97706" stroke-width="0.6"/>
  <ellipse cx="32" cy="66" rx="2" ry="1.5" fill="url(#evThruster)" filter="url(#evGlt)"/>
  <ellipse cx="32" cy="66" rx="0.8" ry="0.6" fill="#fde047" opacity="0.8"/>
  <!-- Right thruster -->
  <ellipse cx="96" cy="66" rx="3" ry="2.5" fill="#292524" stroke="#d97706" stroke-width="0.6"/>
  <ellipse cx="96" cy="66" rx="2" ry="1.5" fill="url(#evThruster)" filter="url(#evGlt)"/>
  <ellipse cx="96" cy="66" rx="0.8" ry="0.6" fill="#fde047" opacity="0.8"/>

  <!-- === Layer 7: Bottom viewport and golden energy core === -->
  <!-- Viewport housing (underside) -->
  <ellipse cx="64" cy="70" rx="10" ry="5" fill="#1c1917" stroke="#44403c" stroke-width="0.6"/>
  <!-- Supply bay door panel lines -->
  <line x1="56" y1="70" x2="54" y2="74" stroke="#44403c" stroke-width="0.4" opacity="0.5"/>
  <line x1="72" y1="70" x2="74" y2="74" stroke="#44403c" stroke-width="0.4" opacity="0.5"/>
  <line x1="58" y1="72" x2="70" y2="72" stroke="#44403c" stroke-width="0.3" opacity="0.4"/>
  <!-- Golden energy core (visible through viewport) -->
  <ellipse cx="64" cy="68" rx="7" ry="4" fill="url(#evCore)" filter="url(#evGl)"/>
  <ellipse cx="64" cy="68" rx="4.5" ry="2.5" fill="#fbbf24" opacity="0.65"/>
  <ellipse cx="64" cy="68" rx="2.5" ry="1.5" fill="#fde047" opacity="0.8"/>
  <ellipse cx="64" cy="68" rx="1" ry="0.6" fill="#ffffff" opacity="0.9"/>
  <!-- Core containment ring -->
  <ellipse cx="64" cy="68" rx="9" ry="4.5" fill="none" stroke="#eab308" stroke-width="0.6" opacity="0.5"/>
  <!-- Core highlight reflection -->
  <ellipse cx="62" cy="66.5" rx="1.2" ry="0.8" fill="#ffffff" opacity="0.2"/>

  <!-- === Layer 8: Top surface detail (command center look) === -->
  <!-- Observation window strip -->
  <path d="M48,60 L80,60" fill="none" stroke="#eab308" stroke-width="0.6" opacity="0.4"/>
  <!-- Small window panels -->
  <rect x="50" y="58.5" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  <rect x="55" y="58.5" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  <rect x="70" y="58.5" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  <rect x="75" y="58.5" width="3" height="2" rx="0.5" fill="#1c1917" stroke="#eab308" stroke-width="0.3" opacity="0.5"/>
  <!-- Antenna base housing on top -->
  <ellipse cx="64" cy="60" rx="6" ry="3" fill="#44403c" stroke="#57534e" stroke-width="0.5"/>
  <ellipse cx="64" cy="60" rx="3" ry="1.5" fill="#292524" stroke="#ca8a04" stroke-width="0.4"/>

  <!-- === Layer 9: Thruster exhaust trails === -->
  <line x1="64" y1="80" x2="64" y2="90" stroke="#f59e0b" stroke-width="1.2" opacity="0.12" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="24" y2="72" stroke="#f59e0b" stroke-width="1" opacity="0.1" stroke-linecap="round"/>
  <line x1="98" y1="68" x2="104" y2="72" stroke="#f59e0b" stroke-width="1" opacity="0.1" stroke-linecap="round"/>

  <!-- === Layer 10: Ambient particles === -->
  <circle cx="42" cy="42" r="1" fill="#fde047" opacity="0.25" filter="url(#evGlt)"/>
  <circle cx="86" cy="44" r="0.8" fill="#fde047" opacity="0.2" filter="url(#evGlt)"/>
  <circle cx="34" cy="82" r="1.2" fill="#eab308" opacity="0.2" filter="url(#evGlt)"/>
  <circle cx="94" cy="80" r="1" fill="#eab308" opacity="0.2" filter="url(#evGlt)"/>
  <circle cx="52" cy="88" r="0.8" fill="#f59e0b" opacity="0.15" filter="url(#evGlt)"/>
  <circle cx="76" cy="86" r="0.8" fill="#f59e0b" opacity="0.15" filter="url(#evGlt)"/>
</svg>
