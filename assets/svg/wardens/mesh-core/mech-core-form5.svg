<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="eng5" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="gl5"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- energy halo -->
  <circle cx="64" cy="56" r="58" fill="url(#halo5)"/>
  <circle cx="64" cy="56" r="52" fill="none" stroke="#fbbf24" stroke-width="0.6" opacity="0.25" stroke-dasharray="3 5"/>
  <!-- engine super-flares -->
  <ellipse cx="40" cy="102" rx="10" ry="20" fill="url(#eng5)"/>
  <ellipse cx="64" cy="104" rx="8" ry="18" fill="url(#eng5)"/>
  <ellipse cx="88" cy="102" rx="10" ry="20" fill="url(#eng5)"/>
  <!-- fuselage (reinforced) -->
  <polygon points="64,6 44,54 46,86 64,82 82,86 84,54" fill="url(#body5)" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- layered armor -->
  <polygon points="48,36 44,54 56,52" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <polygon points="80,36 84,54 72,52" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8" opacity="0.6"/>
  <!-- main wings (massive delta) -->
  <polygon points="44,50 2,72 14,62 36,44" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <polygon points="84,50 126,72 114,62 92,44" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <!-- secondary wings -->
  <polygon points="40,68 16,80 22,74 38,64" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <polygon points="88,68 112,80 106,74 90,64" fill="#0f172a" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
  <!-- canards (golden edge) -->
  <polygon points="54,22 28,34 36,26 52,18" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <polygon points="74,22 100,34 92,26 76,18" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <!-- weapon systems -->
  <rect x="10" y="64" width="16" height="5" rx="2" fill="#334155" stroke="#fbbf24" stroke-width="0.5"/>
  <rect x="102" y="64" width="16" height="5" rx="2" fill="#334155" stroke="#fbbf24" stroke-width="0.5"/>
  <circle cx="14" cy="66.5" r="1.5" fill="#ef4444" filter="url(#gl5)"/>
  <circle cx="20" cy="66.5" r="1.5" fill="#ef4444" filter="url(#gl5)"/>
  <circle cx="108" cy="66.5" r="1.5" fill="#ef4444" filter="url(#gl5)"/>
  <circle cx="114" cy="66.5" r="1.5" fill="#ef4444" filter="url(#gl5)"/>
  <!-- belly turret -->
  <circle cx="64" cy="68" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <circle cx="64" cy="68" r="2.5" fill="#fbbf24" opacity="0.8" filter="url(#gl5)"/>
  <!-- triple engines -->
  <rect x="36" y="82" width="12" height="18" rx="5" fill="#020617" stroke="#fbbf24" stroke-width="1"/>
  <rect x="56" y="84" width="16" height="16" rx="6" fill="#020617" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="80" y="82" width="12" height="18" rx="5" fill="#020617" stroke="#fbbf24" stroke-width="1"/>
  <ellipse cx="42" cy="100" rx="5" ry="4" fill="#fbbf24" filter="url(#gl5)"/>
  <ellipse cx="64" cy="100" rx="7" ry="4" fill="#60a5fa" filter="url(#gl5)"/>
  <ellipse cx="86" cy="100" rx="5" ry="4" fill="#fbbf24" filter="url(#gl5)"/>
  <!-- cockpit (golden frame) -->
  <ellipse cx="64" cy="26" rx="10" ry="18" fill="#0c4a6e" stroke="#fbbf24" stroke-width="1.2"/>
  <ellipse cx="64" cy="22" rx="6" ry="11" fill="#0ea5e9" opacity="0.5"/>
  <ellipse cx="64" cy="19" rx="3" ry="6" fill="#38bdf8" opacity="0.4"/>
  <!-- nav lights (large, glowing) -->
  <circle cx="4" cy="71" r="3.5" fill="#ef4444" filter="url(#gl5)"/>
  <circle cx="124" cy="71" r="3.5" fill="#22c55e" filter="url(#gl5)"/>
  <!-- golden energy lines -->
  <line x1="52" y1="42" x2="52" y2="76" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <line x1="76" y1="42" x2="76" y2="76" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
  <line x1="64" y1="46" x2="64" y2="76" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>
  <!-- crown emblem -->
  <polygon points="64,2 58,10 62,7 64,12 66,7 70,10" fill="#fbbf24" opacity="0.8" filter="url(#gl5)"/>
</svg>