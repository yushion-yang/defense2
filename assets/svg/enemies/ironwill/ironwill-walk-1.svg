<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ironBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ironPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="40%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="ironHelm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <radialGradient id="ironEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="ironRivet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="114" rx="28" ry="8" fill="#000" opacity="0.3"/>
  <!-- legs (march stride: left forward, right back) -->
  <rect x="42" y="88" width="14" height="22" rx="2" fill="url(#ironBody)"/>
  <rect x="72" y="92" width="14" height="18" rx="2" fill="url(#ironBody)"/>
  <!-- leg plates -->
  <rect x="41" y="90" width="16" height="6" rx="1" fill="url(#ironPlate)" opacity="0.7"/>
  <rect x="71" y="94" width="16" height="6" rx="1" fill="url(#ironPlate)" opacity="0.7"/>
  <!-- boots (stride shifted) -->
  <path d="M40 108 L40 114 L58 114 L58 108 Q52 106 40 108" fill="#1f2937"/>
  <path d="M70 108 L70 114 L88 114 L88 108 Q82 106 70 108" fill="#1f2937"/>
  <!-- boot rivets -->
  <circle cx="46" cy="112" r="1.2" fill="url(#ironRivet)"/>
  <circle cx="52" cy="112" r="1.2" fill="url(#ironRivet)"/>
  <circle cx="76" cy="112" r="1.2" fill="url(#ironRivet)"/>
  <circle cx="82" cy="112" r="1.2" fill="url(#ironRivet)"/>
  <!-- torso (bobbed up 2px) -->
  <path d="M38 44 L36 88 Q64 92 92 88 L90 44 Q76 36 64 34 Q52 36 38 44" fill="url(#ironBody)"/>
  <!-- chest plate -->
  <path d="M42 46 L40 78 Q64 82 88 78 L86 46 Q76 40 64 38 Q52 40 42 46" fill="url(#ironPlate)"/>
  <!-- plate seams -->
  <line x1="64" y1="40" x2="64" y2="80" stroke="#374151" stroke-width="1"/>
  <line x1="42" y1="58" x2="86" y2="58" stroke="#374151" stroke-width="0.8"/>
  <!-- chest rivets -->
  <circle cx="50" cy="48" r="1.5" fill="url(#ironRivet)"/>
  <circle cx="78" cy="48" r="1.5" fill="url(#ironRivet)"/>
  <circle cx="50" cy="68" r="1.5" fill="url(#ironRivet)"/>
  <circle cx="78" cy="68" r="1.5" fill="url(#ironRivet)"/>
  <circle cx="64" cy="58" r="2" fill="url(#ironRivet)"/>
  <!-- shoulder plates -->
  <path d="M32 42 Q28 36 32 30 Q40 28 46 34 L42 44 Z" fill="url(#ironPlate)"/>
  <path d="M96 42 Q100 36 96 30 Q88 28 82 34 L86 44 Z" fill="url(#ironPlate)"/>
  <!-- shoulder rivets -->
  <circle cx="38" cy="36" r="1.5" fill="url(#ironRivet)"/>
  <circle cx="90" cy="36" r="1.5" fill="url(#ironRivet)"/>
  <!-- arms (march swing: left forward, right back) -->
  <path d="M34 44 Q22 52 18 68 L22 70 Q24 56 34 48" fill="url(#ironBody)"/>
  <path d="M94 44 Q106 54 108 70 L104 72 Q102 58 94 48" fill="url(#ironBody)"/>
  <!-- forearm plates (shifted with swing) -->
  <rect x="16" y="62" width="8" height="14" rx="2" fill="url(#ironPlate)"/>
  <rect x="104" y="64" width="8" height="14" rx="2" fill="url(#ironPlate)"/>
  <!-- gauntlets -->
  <rect x="14" y="74" width="12" height="10" rx="3" fill="#1f2937"/>
  <rect x="102" y="76" width="12" height="10" rx="3" fill="#1f2937"/>
  <!-- helmet (bobbed up 2px) -->
  <path d="M42 34 Q42 12 64 8 Q86 12 86 34 Q80 40 64 42 Q48 40 42 34" fill="url(#ironHelm)"/>
  <!-- visor slit -->
  <path d="M48 26 Q56 24 64 24 Q72 24 80 26 L78 30 Q70 28 64 28 Q58 28 50 30 Z" fill="#111827"/>
  <!-- eyes behind visor -->
  <ellipse cx="54" cy="28" rx="3" ry="1.5" fill="url(#ironEye)"/>
  <ellipse cx="74" cy="28" rx="3" ry="1.5" fill="url(#ironEye)"/>
  <!-- helmet crest -->
  <path d="M64 8 L62 2 L66 2 Z" fill="#9ca3af"/>
  <rect x="62" y="2" width="4" height="10" rx="1" fill="#6b7280"/>
  <!-- face guard -->
  <line x1="54" y1="30" x2="54" y2="36" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="38" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="64" y1="30" x2="64" y2="38" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="68" y1="30" x2="68" y2="38" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="74" y1="30" x2="74" y2="36" stroke="#4b5563" stroke-width="1.5"/>
  <!-- CC-immune symbol on chest -->
  <circle cx="64" cy="50" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="60" y1="46" x2="68" y2="54" stroke="#9ca3af" stroke-width="1.5"/>
</svg>
