<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="devBody" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="devRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="40%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="devEnergy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="devEye" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </radialGradient>
    <linearGradient id="devHood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e0533"/>
    </linearGradient>
    <radialGradient id="devOrb" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="116" rx="28" ry="7" fill="#3b0764" opacity="0.4"/>
  <!-- energy aura -->
  <ellipse cx="64" cy="66" rx="40" ry="44" fill="url(#devEnergy)" opacity="0.3"/>
  <!-- robe base (2px bob down, slight sway) -->
  <path d="M36 44 Q30 62 28 84 Q26 102 34 118 L94 118 Q102 102 100 84 Q98 62 92 44 Q80 38 64 36 Q48 38 36 44" fill="url(#devRobe)"/>
  <!-- robe folds (shifted for sway) -->
  <path d="M42 52 Q38 72 36 92 Q34 108 40 118" stroke="#3b0764" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M66 42 Q64 72 62 102 L62 118" stroke="#3b0764" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M86 52 Q90 72 92 92 Q94 108 90 118" stroke="#3b0764" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- robe hem detail (shifted wave) -->
  <path d="M34 118 Q42 112 50 118 Q58 112 66 118 Q74 112 82 118 Q86 112 94 118" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- devotion symbol on chest -->
  <circle cx="64" cy="70" r="10" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.6"/>
  <circle cx="64" cy="70" r="6" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.5"/>
  <!-- inner symbol: inverted triangle -->
  <polygon points="64,64 59,74 69,74" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.7"/>
  <!-- eye of devotion in center -->
  <ellipse cx="64" cy="70" rx="2.5" ry="1.5" fill="#c084fc" opacity="0.8"/>
  <!-- left arm (swung forward) -->
  <path d="M36 48 Q24 52 18 64 Q16 72 20 76" fill="url(#devRobe)" stroke="#3b0764" stroke-width="0.5"/>
  <!-- left sleeve -->
  <path d="M36 48 Q32 50 26 52" stroke="#4c1d95" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- left hand with orb -->
  <circle cx="18" cy="76" r="4" fill="#4c1d95"/>
  <!-- floating orb left (repositioned higher) -->
  <circle cx="14" cy="64" r="6" fill="url(#devOrb)" opacity="0.8"/>
  <circle cx="12" cy="62" r="2" fill="#fff" opacity="0.4"/>
  <!-- orb energy trails (shifted) -->
  <path d="M14 58 Q10 52 14 46" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M8 64 Q4 58 8 52" stroke="#c084fc" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- right arm (swung back) -->
  <path d="M92 48 Q104 56 108 72 Q110 80 106 84" fill="url(#devRobe)" stroke="#3b0764" stroke-width="0.5"/>
  <!-- right sleeve -->
  <path d="M92 48 Q96 50 100 54" stroke="#4c1d95" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- right hand -->
  <circle cx="108" cy="84" r="4" fill="#4c1d95"/>
  <!-- floating orb right (repositioned lower) -->
  <circle cx="112" cy="78" r="6" fill="url(#devOrb)" opacity="0.8"/>
  <circle cx="110" cy="76" r="2" fill="#fff" opacity="0.4"/>
  <!-- orb energy trails (shifted) -->
  <path d="M112 72 Q116 66 112 60" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M118 78 Q122 72 118 66" stroke="#c084fc" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- hood (2px bob down) -->
  <path d="M42 42 Q40 22 64 14 Q88 22 86 42 Q80 48 64 50 Q48 48 42 42" fill="url(#devHood)"/>
  <!-- hood shadow interior -->
  <path d="M46 40 Q46 26 64 20 Q82 26 82 40 Q76 44 64 46 Q52 44 46 40" fill="#1e0533" opacity="0.7"/>
  <!-- eyes glowing in hood shadow -->
  <ellipse cx="56" cy="36" rx="4" ry="2.5" fill="url(#devEye)"/>
  <circle cx="56" cy="36" r="1.2" fill="#fff" opacity="0.7"/>
  <ellipse cx="72" cy="36" rx="4" ry="2.5" fill="url(#devEye)"/>
  <circle cx="72" cy="36" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- energy wisps (shifted) -->
  <path d="M56 32 Q50 24 54 18" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M72 32 Q78 24 74 18" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- floating energy particles (shifted positions) -->
  <circle cx="82" cy="24" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="46" cy="30" r="1.2" fill="#c084fc" opacity="0.4"/>
  <circle cx="92" cy="58" r="1" fill="#e9d5ff" opacity="0.35"/>
  <circle cx="36" cy="52" r="1.3" fill="#e9d5ff" opacity="0.3"/>
  <circle cx="64" cy="8" r="1.5" fill="#c084fc" opacity="0.3"/>
</svg>
