<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sfBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>
    <linearGradient id="sfArmor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="50%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="sfBoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>
    <radialGradient id="sfTread" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#422006"/>
    </radialGradient>
    <linearGradient id="sfBelt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="116" rx="32" ry="8" fill="#000" opacity="0.25"/>
  <!-- left boot (forward stride) -->
  <path d="M30 94 L24 114 L50 114 L50 94" fill="url(#sfBoot)"/>
  <!-- left boot treads -->
  <rect x="24" y="108" width="26" height="3" rx="1" fill="url(#sfTread)"/>
  <line x1="28" y1="109" x2="28" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="32" y1="109" x2="32" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="36" y1="109" x2="36" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="40" y1="109" x2="40" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="44" y1="109" x2="44" y2="111" stroke="#422006" stroke-width="1.5"/>
  <!-- left boot straps -->
  <rect x="28" y="96" width="22" height="3" rx="1" fill="#a16207"/>
  <rect x="28" y="102" width="22" height="3" rx="1" fill="#a16207"/>
  <!-- left boot buckle -->
  <rect x="38" y="95" width="4" height="5" rx="0.5" fill="#d97706" stroke="#422006" stroke-width="0.5"/>
  <!-- right boot (back stride, lifted) -->
  <path d="M78 98 L80 114 L102 114 L98 98" fill="url(#sfBoot)"/>
  <!-- right boot treads -->
  <rect x="80" y="108" width="22" height="3" rx="1" fill="url(#sfTread)"/>
  <line x1="84" y1="109" x2="84" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="88" y1="109" x2="88" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="92" y1="109" x2="92" y2="111" stroke="#422006" stroke-width="1.5"/>
  <line x1="96" y1="109" x2="96" y2="111" stroke="#422006" stroke-width="1.5"/>
  <!-- right boot straps -->
  <rect x="80" y="100" width="18" height="3" rx="1" fill="#a16207"/>
  <rect x="80" y="106" width="18" height="3" rx="1" fill="#a16207"/>
  <!-- right boot buckle -->
  <rect x="86" y="99" width="4" height="5" rx="0.5" fill="#d97706" stroke="#422006" stroke-width="0.5"/>
  <!-- legs (asymmetric stride) -->
  <rect x="36" y="80" width="16" height="16" rx="2" fill="url(#sfBody)"/>
  <rect x="76" y="84" width="16" height="16" rx="2" fill="url(#sfBody)"/>
  <!-- torso (slight lean forward, 2px body bob down) -->
  <path d="M36 44 L32 86 Q62 90 92 86 L90 44 Q78 38 64 36 Q50 38 36 44" fill="url(#sfBody)"/>
  <!-- chest armor -->
  <path d="M40 46 L38 76 Q62 80 86 76 L86 46 Q76 42 64 40 Q52 42 40 46" fill="url(#sfArmor)"/>
  <!-- armor details -->
  <line x1="63" y1="42" x2="63" y2="78" stroke="#713f12" stroke-width="1.2"/>
  <path d="M44 56 Q63 52 82 56" stroke="#713f12" stroke-width="0.8" fill="none"/>
  <!-- belt -->
  <rect x="34" y="78" width="56" height="6" rx="2" fill="url(#sfBelt)"/>
  <!-- belt buckle -->
  <rect x="56" y="77" width="12" height="8" rx="1.5" fill="#d97706" stroke="#422006" stroke-width="0.8"/>
  <!-- steady symbol on buckle -->
  <line x1="59" y1="81" x2="65" y2="81" stroke="#422006" stroke-width="1.2"/>
  <polygon points="62,78 60,80 64,80" fill="#422006"/>
  <polygon points="62,84 60,82 64,82" fill="#422006"/>
  <!-- shoulder pads -->
  <ellipse cx="34" cy="44" rx="10" ry="6" fill="url(#sfArmor)"/>
  <ellipse cx="92" cy="44" rx="10" ry="6" fill="url(#sfArmor)"/>
  <!-- arms (swinging opposite to legs) -->
  <path d="M26 46 Q18 54 16 68 L20 68 Q22 56 28 48" fill="url(#sfBody)"/>
  <path d="M100 46 Q108 58 110 72 L106 72 Q104 60 98 50" fill="url(#sfBody)"/>
  <!-- fists -->
  <circle cx="18" cy="72" r="6" fill="#713f12"/>
  <circle cx="108" cy="76" r="6" fill="#713f12"/>
  <!-- head (slight lean, 2px bob) -->
  <path d="M47 36 Q47 20 63 16 Q79 20 79 36 Q73 40 63 42 Q53 40 47 36" fill="url(#sfBody)"/>
  <!-- helmet -->
  <path d="M47 32 Q47 20 63 16 Q79 20 79 32 Q71 30 63 30 Q55 30 47 32" fill="url(#sfArmor)"/>
  <!-- helmet brim -->
  <path d="M43 32 Q53 34 63 34 Q73 34 83 32 Q75 30 63 30 Q51 30 43 32" fill="#a16207"/>
  <!-- eyes -->
  <ellipse cx="55" cy="32" rx="3" ry="2.5" fill="#1c1917"/>
  <circle cx="55" cy="32" r="1" fill="#a16207"/>
  <ellipse cx="71" cy="32" rx="3" ry="2.5" fill="#1c1917"/>
  <circle cx="71" cy="32" r="1" fill="#a16207"/>
  <!-- determined mouth -->
  <line x1="57" y1="38" x2="69" y2="38" stroke="#422006" stroke-width="1.5" stroke-linecap="round"/>
</svg>
