<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="110" rx="24" ry="8" fill="url(#shadow)"/>
  <!-- speed lines: shifted vertically by 4-6px -->
  <rect x="10" y="48" width="28" height="2" rx="1" fill="url(#streakGrad)"/>
  <rect x="6" y="58" width="30" height="2" rx="1" fill="url(#streakGrad)"/>
  <rect x="14" y="68" width="24" height="2" rx="1" fill="url(#streakGrad)"/>
  <!-- legs: swapped stride positions + bob 2px -->
  <path d="M52 94 L58 108" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 92 L66 108" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <!-- body: bob down 2px -->
  <path d="M44 70 Q44 44 64 40 Q84 44 84 70 Q84 94 64 98 Q44 94 44 70Z" fill="url(#bodyGrad)"/>
  <!-- chest plate: bob down 2px -->
  <path d="M50 58 Q64 52 78 58 L76 76 Q64 80 52 76Z" fill="#06b6d4" opacity="0.6"/>
  <!-- head: bob down 2px -->
  <ellipse cx="64" cy="38" rx="16" ry="14" fill="url(#bodyGrad)"/>
  <!-- visor: bob down 2px -->
  <path d="M50 36 Q64 30 78 36 Q78 42 64 44 Q50 42 50 36Z" fill="#083344" opacity="0.85"/>
  <!-- visor glow: bob down 2px -->
  <ellipse cx="60" cy="37" rx="6" ry="2.5" fill="#22d3ee" opacity="0.4"/>
  <!-- fins: bob down 2px, slightly rotated -->
  <path d="M82 52 L98 42 L90 56Z" fill="#06b6d4" opacity="0.7"/>
  <path d="M46 52 L30 42 L38 56Z" fill="#06b6d4" opacity="0.7"/>
  <!-- head fin: bob down 2px -->
  <path d="M64 24 L70 18 L64 32Z" fill="#0891b2" opacity="0.8"/>
  <!-- core glow: bob down 2px -->
  <ellipse cx="64" cy="68" rx="6" ry="6" fill="url(#coreGlow)" opacity="0.5"/>
</svg>
