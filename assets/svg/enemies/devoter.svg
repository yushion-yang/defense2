<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="devBody" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>
    <linearGradient id="devRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="40%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="devEnergy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="devEye" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </radialGradient>
    <linearGradient id="devHood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e0533"/>
    </linearGradient>
    <radialGradient id="devOrb" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="116" rx="28" ry="7" fill="#3b0764" opacity="0.4"/>
  <!-- energy aura -->
  <ellipse cx="64" cy="64" rx="40" ry="44" fill="url(#devEnergy)" opacity="0.3"/>
  <!-- robe base -->
  <path d="M38 42 Q32 60 30 82 Q28 100 36 116 L92 116 Q100 100 98 82 Q96 60 90 42 Q78 36 64 34 Q50 36 38 42" fill="url(#devRobe)"/>
  <!-- robe folds -->
  <path d="M44 50 Q42 70 40 90 Q38 106 42 116" stroke="#3b0764" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M64 40 Q62 70 64 100 L64 116" stroke="#3b0764" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M84 50 Q86 70 88 90 Q90 106 86 116" stroke="#3b0764" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- robe hem detail -->
  <path d="M36 116 Q44 110 52 116 Q60 110 68 116 Q76 110 84 116 Q88 110 92 116" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- devotion symbol on chest -->
  <circle cx="64" cy="68" r="10" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.6"/>
  <circle cx="64" cy="68" r="6" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.5"/>
  <!-- inner symbol: inverted triangle -->
  <polygon points="64,62 59,72 69,72" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.7"/>
  <!-- eye of devotion in center -->
  <ellipse cx="64" cy="68" rx="2.5" ry="1.5" fill="#c084fc" opacity="0.8"/>
  <!-- left arm -->
  <path d="M38 46 Q28 54 24 68 Q22 76 26 80" fill="url(#devRobe)" stroke="#3b0764" stroke-width="0.5"/>
  <!-- left sleeve -->
  <path d="M38 46 Q34 48 30 52" stroke="#4c1d95" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- left hand with orb -->
  <circle cx="24" cy="80" r="4" fill="#4c1d95"/>
  <!-- floating orb left -->
  <circle cx="20" cy="72" r="6" fill="url(#devOrb)" opacity="0.8"/>
  <circle cx="18" cy="70" r="2" fill="#fff" opacity="0.4"/>
  <!-- orb energy trails -->
  <path d="M20 66 Q16 60 20 54" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M14 72 Q10 66 14 60" stroke="#c084fc" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- right arm -->
  <path d="M90 46 Q100 54 104 68 Q106 76 102 80" fill="url(#devRobe)" stroke="#3b0764" stroke-width="0.5"/>
  <!-- right sleeve -->
  <path d="M90 46 Q94 48 98 52" stroke="#4c1d95" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- right hand -->
  <circle cx="104" cy="80" r="4" fill="#4c1d95"/>
  <!-- floating orb right -->
  <circle cx="108" cy="72" r="6" fill="url(#devOrb)" opacity="0.8"/>
  <circle cx="106" cy="70" r="2" fill="#fff" opacity="0.4"/>
  <!-- orb energy trails -->
  <path d="M108 66 Q112 60 108 54" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M114 72 Q118 66 114 60" stroke="#c084fc" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- hood -->
  <path d="M42 40 Q40 20 64 12 Q88 20 86 40 Q80 46 64 48 Q48 46 42 40" fill="url(#devHood)"/>
  <!-- hood shadow interior -->
  <path d="M46 38 Q46 24 64 18 Q82 24 82 38 Q76 42 64 44 Q52 42 46 38" fill="#1e0533" opacity="0.7"/>
  <!-- eyes glowing in hood shadow -->
  <ellipse cx="56" cy="34" rx="4" ry="2.5" fill="url(#devEye)"/>
  <circle cx="56" cy="34" r="1.2" fill="#fff" opacity="0.7"/>
  <ellipse cx="72" cy="34" rx="4" ry="2.5" fill="url(#devEye)"/>
  <circle cx="72" cy="34" r="1.2" fill="#fff" opacity="0.7"/>
  <!-- energy wisps -->
  <path d="M56 30 Q52 22 58 16" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M72 30 Q76 22 70 16" stroke="#c084fc" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- floating energy particles -->
  <circle cx="48" cy="26" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="80" cy="28" r="1.2" fill="#c084fc" opacity="0.4"/>
  <circle cx="36" cy="56" r="1" fill="#e9d5ff" opacity="0.35"/>
  <circle cx="92" cy="54" r="1.3" fill="#e9d5ff" opacity="0.3"/>
  <circle cx="64" cy="10" r="1.5" fill="#c084fc" opacity="0.3"/>
</svg>