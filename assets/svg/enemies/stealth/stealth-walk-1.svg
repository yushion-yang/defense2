<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#5b21b6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- aura: slight sway left 2px -->
  <ellipse cx="62" cy="68" rx="44" ry="44" fill="url(#auraGrad)"/>
  <!-- shadow -->
  <ellipse cx="64" cy="108" rx="20" ry="6" fill="url(#shadow)"/>
  <!-- wisp trails: repositioned for shimmer shift -->
  <path d="M42 86 Q34 76 38 66" stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M86 92 Q94 82 90 72" stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.15" stroke-linecap="round"/>
  <path d="M74 94 Q80 84 76 76" stroke="#6d28d9" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <!-- legs: swapped stride + bob 2px -->
  <path d="M54 90 L58 104" stroke="#6d28d9" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M74 90 L70 104" stroke="#6d28d9" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <!-- body: sway left 2px, bob down 2px -->
  <path d="M42 62 Q42 40 62 36 Q82 40 82 62 Q82 90 62 96 Q42 90 42 62Z" fill="url(#bodyGrad)"/>
  <!-- inner edge: sway left 2px, bob down 2px -->
  <path d="M46 60 Q46 44 62 40 Q78 44 78 60 Q78 84 62 90 Q46 84 46 60Z" stroke="#c4b5fd" stroke-width="0.5" fill="none" opacity="0.25"/>
  <!-- dagger left: sway + bob, slightly different angle -->
  <path d="M34 64 L24 50 L28 48 L38 60Z" fill="url(#bladeGrad)"/>
  <!-- dagger right: sway + bob, slightly different angle -->
  <path d="M90 60 L96 44 L92 42 L86 56Z" fill="url(#bladeGrad)"/>
  <!-- head: sway left 2px, bob down 2px -->
  <path d="M48 40 Q62 26 76 40 Q72 48 62 50 Q52 48 48 40Z" fill="#6d28d9" opacity="0.55"/>
  <!-- eyes: sway left 2px, bob down 2px -->
  <ellipse cx="54" cy="40" rx="4" ry="2.5" fill="#c4b5fd" opacity="0.8"/>
  <ellipse cx="70" cy="40" rx="4" ry="2.5" fill="#c4b5fd" opacity="0.8"/>
  <!-- eye glow: sway left 2px, bob down 2px -->
  <ellipse cx="54" cy="40" rx="6" ry="3.5" fill="#c4b5fd" opacity="0.15"/>
  <ellipse cx="70" cy="40" rx="6" ry="3.5" fill="#c4b5fd" opacity="0.15"/>
  <!-- core glow: sway left 2px, bob down 2px -->
  <ellipse cx="62" cy="64" rx="8" ry="8" fill="url(#coreGrad)"/>
  <!-- hood point: sway left 2px, bob down 2px -->
  <path d="M62 26 L58 36 L66 36Z" fill="#5b21b6" opacity="0.5"/>
</svg>
