<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="colBody" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="60%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </radialGradient>
    <radialGradient id="colCrystal" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="colGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="colRock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="colArm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="114" rx="40" ry="10" fill="#000" opacity="0.25"/>
  <!-- left leg (forward stride) -->
  <path d="M42 88 L38 106 L50 106 L50 88" fill="url(#colArm)"/>
  <rect x="36" y="104" width="16" height="8" rx="3" fill="#374151"/>
  <!-- right leg (back stride) -->
  <path d="M78 88 L78 110 L90 110 L84 88" fill="url(#colArm)"/>
  <rect x="76" y="108" width="16" height="8" rx="3" fill="#374151"/>
  <!-- rock cracks on legs -->
  <line x1="44" y1="92" x2="42" y2="100" stroke="#1f2937" stroke-width="1"/>
  <line x1="82" y1="92" x2="84" y2="104" stroke="#1f2937" stroke-width="1"/>
  <!-- body (bobbed down 3px - heavy stomp) -->
  <path d="M36 53 Q34 47 40 39 Q52 31 64 29 Q76 31 88 39 Q94 47 92 53 L96 93 Q64 99 32 93 Z" fill="url(#colBody)"/>
  <!-- rock texture -->
  <line x1="44" y1="43" x2="48" y2="59" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="45" x2="78" y2="61" stroke="#374151" stroke-width="1.5" opacity="0.6"/>
  <line x1="56" y1="73" x2="72" y2="71" stroke="#374151" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="79" x2="50" y2="83" stroke="#374151" stroke-width="1" opacity="0.4"/>
  <!-- crystal core glow (pulse larger) -->
  <ellipse cx="64" cy="61" rx="16" ry="14" fill="url(#colGlow)"/>
  <!-- crystal core -->
  <polygon points="64,47 54,59 58,73 70,73 74,59" fill="url(#colCrystal)"/>
  <!-- crystal highlights -->
  <polygon points="64,49 58,57 64,55 70,57" fill="#c4b5fd" opacity="0.5"/>
  <line x1="60" y1="53" x2="56" y2="65" stroke="#ddd6fe" stroke-width="0.8" opacity="0.6"/>
  <!-- shoulder boulder left -->
  <path d="M30 47 Q24 39 28 33 Q34 31 40 37 Q38 45 32 49" fill="url(#colRock)"/>
  <!-- shoulder boulder right -->
  <path d="M98 47 Q104 39 100 33 Q94 31 88 37 Q90 45 96 49" fill="url(#colRock)"/>
  <!-- left arm (swung forward) -->
  <path d="M32 49 Q18 56 14 72 Q12 80 18 84 L24 80 Q20 74 22 64 Q24 54 36 53" fill="url(#colArm)"/>
  <!-- left fist (forward) -->
  <circle cx="20" cy="82" r="8" fill="#4b5563"/>
  <line x1="16" y1="78" x2="24" y2="86" stroke="#374151" stroke-width="1"/>
  <!-- right arm (swung back) -->
  <path d="M96 49 Q110 60 112 76 Q114 84 108 88 L102 84 Q106 78 104 68 Q102 58 92 53" fill="url(#colArm)"/>
  <!-- right fist (back) -->
  <circle cx="106" cy="86" r="8" fill="#4b5563"/>
  <line x1="102" y1="82" x2="110" y2="90" stroke="#374151" stroke-width="1"/>
  <!-- head (bobbed down 3px) -->
  <path d="M48 35 Q50 23 64 19 Q78 23 80 35 Q76 41 64 43 Q52 41 48 35" fill="url(#colRock)"/>
  <!-- eyes -->
  <ellipse cx="56" cy="31" rx="4" ry="3" fill="#a78bfa"/>
  <circle cx="56" cy="31" r="1.5" fill="#c4b5fd"/>
  <ellipse cx="72" cy="31" rx="4" ry="3" fill="#a78bfa"/>
  <circle cx="72" cy="31" r="1.5" fill="#c4b5fd"/>
  <!-- brow ridge -->
  <path d="M50 27 Q56 25 60 27" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M68 27 Q72 25 78 27" stroke="#374151" stroke-width="2" fill="none"/>
  <!-- small crystals -->
  <polygon points="46,37 42,31 48,33" fill="#a78bfa" opacity="0.7"/>
  <polygon points="82,37 86,31 80,33" fill="#a78bfa" opacity="0.7"/>
  <polygon points="64,21 62,15 66,15" fill="#a78bfa" opacity="0.5"/>
</svg>
