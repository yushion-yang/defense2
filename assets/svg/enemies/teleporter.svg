<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="tpBody" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </radialGradient>
    <radialGradient id="tpPortal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tpGlitch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tpWarp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="tpCloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- portal ring behind -->
  <ellipse cx="64" cy="68" rx="42" ry="38" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 6"/>
  <!-- shadow -->
  <ellipse cx="64" cy="112" rx="24" ry="6" fill="#7e22ce" opacity="0.3"/>
  <!-- portal glow -->
  <ellipse cx="64" cy="68" rx="32" ry="28" fill="url(#tpPortal)"/>
  <!-- glitch fragments (displaced copies) -->
  <ellipse cx="72" cy="62" rx="12" ry="16" fill="#a855f7" opacity="0.15"/>
  <ellipse cx="56" cy="74" rx="10" ry="14" fill="#c084fc" opacity="0.12"/>
  <!-- glitch lines -->
  <rect x="36" y="44" width="20" height="2" fill="#c084fc" opacity="0.4"/>
  <rect x="72" y="52" width="18" height="1.5" fill="#c084fc" opacity="0.3"/>
  <rect x="42" y="84" width="14" height="1.5" fill="#c084fc" opacity="0.35"/>
  <rect x="76" y="78" width="12" height="2" fill="#c084fc" opacity="0.25"/>
  <!-- legs (glitchy, offset) -->
  <rect x="50" y="92" width="8" height="14" rx="2" fill="#7e22ce" opacity="0.7"/>
  <rect x="52" y="94" width="8" height="14" rx="2" fill="#9333ea" opacity="0.5"/>
  <rect x="70" y="92" width="8" height="14" rx="2" fill="#7e22ce" opacity="0.7"/>
  <rect x="68" y="94" width="8" height="14" rx="2" fill="#9333ea" opacity="0.5"/>
  <!-- cloak/body -->
  <path d="M40 44 Q36 56 38 80 Q40 96 48 98 Q56 94 64 94 Q72 94 80 98 Q88 96 90 80 Q92 56 88 44 Q78 36 64 34 Q50 36 40 44" fill="url(#tpBody)" opacity="0.85"/>
  <!-- cloak fade -->
  <path d="M42 70 Q44 88 52 94 Q58 90 64 90 Q70 90 76 94 Q84 88 86 70" fill="url(#tpCloak)" opacity="0.4"/>
  <!-- body warp distortion -->
  <path d="M48 50 Q56 46 64 48 Q72 46 80 50 L78 68 Q72 64 64 66 Q56 64 50 68 Z" fill="url(#tpWarp)" opacity="0.3"/>
  <!-- arms (phasing) -->
  <path d="M40 48 Q30 58 28 70 Q26 76 30 78" stroke="#9333ea" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 70 Q28 76 32 80" stroke="#c084fc" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M88 48 Q98 58 100 70 Q102 76 98 78" stroke="#9333ea" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M96 70 Q100 76 96 80" stroke="#c084fc" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- head -->
  <ellipse cx="64" cy="32" rx="16" ry="18" fill="url(#tpBody)"/>
  <!-- glitch head copy -->
  <ellipse cx="68" cy="30" rx="16" ry="18" fill="#a855f7" opacity="0.15"/>
  <!-- face void -->
  <ellipse cx="64" cy="34" rx="10" ry="8" fill="#3b0764" opacity="0.6"/>
  <!-- eyes -->
  <ellipse cx="58" cy="32" rx="4" ry="3" fill="url(#tpGlitch)"/>
  <circle cx="58" cy="32" r="1.5" fill="#e9d5ff"/>
  <ellipse cx="70" cy="32" rx="4" ry="3" fill="url(#tpGlitch)"/>
  <circle cx="70" cy="32" r="1.5" fill="#e9d5ff"/>
  <!-- phase particles -->
  <circle cx="34" cy="40" r="2" fill="#c084fc" opacity="0.6"/>
  <circle cx="94" cy="44" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="44" cy="20" r="1.8" fill="#e9d5ff" opacity="0.4"/>
  <circle cx="84" cy="24" r="2.2" fill="#c084fc" opacity="0.5"/>
  <circle cx="28" cy="62" r="1.5" fill="#e9d5ff" opacity="0.3"/>
  <circle cx="100" cy="58" r="1.8" fill="#c084fc" opacity="0.4"/>
  <circle cx="52" cy="10" r="1.2" fill="#c084fc" opacity="0.35"/>
  <circle cx="76" cy="12" r="1" fill="#e9d5ff" opacity="0.3"/>
  <!-- portal ring front -->
  <ellipse cx="64" cy="68" rx="42" ry="38" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.2" stroke-dasharray="2 8"/>
</svg>