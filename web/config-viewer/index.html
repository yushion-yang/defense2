<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Defense2 配置预览</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <div class="eyebrow">Defense2</div>
        <h1>配置预览</h1>
        <p class="sidebar-desc">游戏配置数据只读预览工具</p>
      </div>

      <div class="sidebar-tools">
        <input id="globalSearch" class="search-input" placeholder="搜索敌人 / 炮塔 / 字段" />
        <button data-tab="overview" class="tab active">总览</button>
        <button data-tab="enemies" class="tab">敌人</button>
        <button data-tab="towers" class="tab">炮塔</button>
        <button data-tab="waves" class="tab">波次</button>
        <button data-tab="towerGallery" class="tab">炮塔图鉴</button>
        <button data-tab="enemyGallery" class="tab">敌人图鉴</button>
      </div>

      <div class="sidebar-actions">
        <div id="status" class="status">加载中...</div>
      </div>
    </aside>

    <main class="content">
      <section id="overview" class="panel active"></section>
      <section id="enemies" class="panel"></section>
      <section id="towers" class="panel"></section>
      <section id="waves" class="panel"></section>
      <section id="towerGallery" class="panel"></section>
      <section id="enemyGallery" class="panel"></section>
    </main>
  </div>

  <script src="./viewer.js"></script>
</body>
</html>
