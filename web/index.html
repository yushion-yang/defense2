<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tower Defense</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏰</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
        body { display: flex; justify-content: center; align-items: center; }

        /* 游戏画布：保持 1200:540 宽高比，居中填满视口 */
        canvas {
            width: 100vw;
            height: calc(100vw * 540 / 1200);
            max-height: 100vh;
            max-width: calc(100vh * 1200 / 540);
        }

        /* 加载遮罩 */
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: #0a0a0a; color: #ccc;
            font-family: -apple-system, "Noto Sans SC", sans-serif;
            z-index: 10; transition: opacity 0.4s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading h1 { font-size: 1.5rem; margin-bottom: 1.2rem; color: #e0c060; }

        .progress-bar {
            width: min(60vw, 360px); height: 6px;
            background: #222; border-radius: 3px; overflow: hidden;
        }
        .progress-bar .fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #e0c060, #f0d878);
            border-radius: 3px; transition: width 0.3s;
        }
        #loading .status { margin-top: 0.8rem; font-size: 0.85rem; color: #888; }

        /* 错误提示 */
        #error {
            position: fixed; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            background: #0a0a0a; color: #ccc;
            font-family: -apple-system, "Noto Sans SC", sans-serif;
            z-index: 20;
        }
        #error h1 { font-size: 1.3rem; color: #e06060; margin-bottom: 0.8rem; }
        #error .msg { font-size: 0.85rem; color: #888; max-width: 400px; text-align: center; }
        #error button {
            margin-top: 1.2rem; padding: 0.5rem 1.5rem;
            background: #333; color: #ccc; border: 1px solid #555;
            border-radius: 4px; cursor: pointer; font-size: 0.9rem;
        }
        #error button:hover { background: #444; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>Tower Defense</h1>
        <div class="progress-bar"><div class="fill" id="progress"></div></div>
        <div class="status" id="status">Loading...</div>
    </div>

    <div id="error">
        <h1>Failed to Load</h1>
        <div class="msg" id="error-msg"></div>
        <button onclick="location.reload()">Retry</button>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
    (async function() {
        const $progress = document.getElementById("progress");
        const $status   = document.getElementById("status");
        const $loading  = document.getElementById("loading");
        const $error    = document.getElementById("error");
        const $errorMsg = document.getElementById("error-msg");

        function setProgress(pct, text) {
            $progress.style.width = pct + "%";
            if (text) $status.textContent = text;
        }

        function showError(msg) {
            $loading.style.display = "none";
            $errorMsg.textContent = msg;
            $error.style.display = "flex";
        }

        // 检查 WebAssembly 支持
        if (typeof WebAssembly !== "object") {
            showError("Your browser does not support WebAssembly. Please use a modern browser.");
            return;
        }

        try {
            setProgress(10, "Downloading game...");

            // 带进度的 fetch
            const resp = await fetch("game.wasm");
            if (!resp.ok) throw new Error("HTTP " + resp.status + ": " + resp.statusText);

            const contentLength = resp.headers.get("Content-Length");
            const total = contentLength ? parseInt(contentLength, 10) : 0;

            let loaded = 0;
            const reader = resp.body.getReader();
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total > 0) {
                    const pct = Math.min(10 + (loaded / total) * 70, 80);
                    const mb = (loaded / 1048576).toFixed(1);
                    const totalMB = (total / 1048576).toFixed(1);
                    setProgress(pct, "Downloading... " + mb + " / " + totalMB + " MB");
                }
            }

            setProgress(80, "Compiling WebAssembly...");
            const wasmBytes = new Uint8Array(loaded);
            let offset = 0;
            for (const chunk of chunks) {
                wasmBytes.set(chunk, offset);
                offset += chunk.length;
            }

            const go = new Go();
            const result = await WebAssembly.instantiate(wasmBytes, go.importObject);

            setProgress(95, "Starting...");

            // 等一帧让 UI 更新
            await new Promise(r => requestAnimationFrame(r));

            go.run(result.instance);

            setProgress(100, "");
            $loading.classList.add("hidden");
            setTimeout(() => { $loading.style.display = "none"; }, 500);

        } catch (e) {
            console.error("WASM load failed:", e);
            showError(e.message || "Unknown error while loading the game.");
        }
    })();
    </script>
</body>
</html>
